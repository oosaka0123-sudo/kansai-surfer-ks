<!-- KS GEAR BANNER START -->
<style>
/* Compact photo banner, immediately followed by the wave-information heading. */
.ks-gear-home-promo{width:100%;max-width:1200px;margin:9px auto 0;padding:0 12px;box-sizing:border-box}
.ks-gear-home-promo .ks-gear-promo-link{height:152px;position:relative;display:flex;align-items:center;overflow:hidden;border-radius:9px;isolation:isolate;background:#052438;color:#fff;text-decoration:none;box-shadow:0 5px 13px rgba(1,17,28,.19);box-sizing:border-box}
.ks-gear-home-promo .ks-photo-bg{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(2,22,37,.98) 0%,rgba(2,26,44,.93) 43%,rgba(2,30,45,.5) 74%,rgba(2,23,40,.22) 100%),url('/gear/images/06.jpg') 75% 47% / cover no-repeat}
.ks-gear-home-promo .ks-promo-copy{position:relative;z-index:2;width:72%;min-width:0;padding:8px 24px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;box-sizing:border-box}
.ks-gear-home-promo .ks-promo-eyebrow{font-size:10px;line-height:1.2;letter-spacing:.14em;font-weight:800;color:#7ce9df;margin-bottom:5px}
.ks-gear-home-promo .ks-promo-title{font-size:clamp(24px,3.3vw,38px);line-height:1.12;letter-spacing:-.035em;font-weight:900;text-shadow:0 2px 5px rgba(0,0,0,.45)}
.ks-gear-home-promo .ks-promo-title em{color:#ffdc4f;font-style:normal}
.ks-gear-home-promo .ks-promo-arrow{display:inline-block;color:#ff8069;margin-left:6px;font-weight:900}
.ks-gear-home-promo .ks-promo-disclaimer{color:#d5e8e9;font-size:9px;line-height:1.25;margin-top:7px}
.ks-gear-home-promo .ks-gear-promo-link:focus-visible{outline:3px solid #ffdc4f;outline-offset:3px}
.ks-gear-home-promo .ks-gear-illustration{position:absolute;z-index:1;right:1%;top:4%;width:31%;height:92%;pointer-events:none;filter:drop-shadow(0 4px 7px rgba(0,0,0,.24))}
.ks-gear-home-promo .ks-gear-illustration svg{display:block;width:100%;height:100%}
/* Home title is the very next sibling: reduce only the gap below this promo. */
.ks-gear-home-promo + .top-hero{margin-top:0!important;padding-top:12px!important}
.ks-gear-home-promo + .top-hero h1{margin-top:0!important}
@media(max-width:720px){
.ks-gear-home-promo{margin:6px auto 0;padding:0 8px}
.ks-gear-home-promo .ks-gear-promo-link{height:102px;border-radius:7px;box-shadow:none}
.ks-gear-home-promo .ks-photo-bg{background:linear-gradient(90deg,rgba(1,21,35,.98) 0%,rgba(2,24,41,.96) 57%,rgba(2,27,44,.39) 100%),url('/gear/images/06.jpg') 65% 49% / cover no-repeat}
.ks-gear-home-promo .ks-promo-copy{width:76%;padding:6px 12px}
.ks-gear-home-promo .ks-promo-eyebrow{font-size:8px;margin-bottom:3px;letter-spacing:.08em}
.ks-gear-home-promo .ks-promo-title{font-size:clamp(17px,5vw,23px);line-height:1.12}
.ks-gear-home-promo .ks-promo-disclaimer{font-size:7px;line-height:1.15;margin-top:4px;max-width:255px}
.ks-gear-home-promo .ks-gear-illustration{width:32%;right:1.5%;height:88%;top:6%}
.ks-gear-home-promo + .top-hero{margin-top:0!important;padding-top:5px!important}
.ks-gear-home-promo + .top-hero h1{margin-top:0!important}
}
</style>
