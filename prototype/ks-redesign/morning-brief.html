<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05080b">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>KS 朝刊プレビュー｜NAMI TEST</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root{--paper:#f6f3ec;--sheet:#fffdfa;--ink:#14242b;--muted:#68767b;--rule:#ddd8cd;--sea:#087a91;--sea-deep:#07586a;--sand:#efe8da;--warn:#a6462d;--warn-bg:#fff1eb}
    body{background:var(--paper);color:var(--ink)}
    .site-header{background:#07141b;border-bottom:1px solid rgba(255,255,255,.08)}
    .site-header .brand{color:#fff}
    .brief-wrap{width:min(100% - 28px,900px);margin:0 auto;padding:112px 0 76px}
    .morning-paper{max-width:760px;margin:0 auto;background:var(--sheet);padding:clamp(24px,5vw,52px);box-shadow:0 18px 55px rgba(17,33,40,.08)}
    .masthead{padding-bottom:30px;border-bottom:1px solid var(--rule)}
    .edition-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brief-kicker{margin:0;font-size:.74rem;letter-spacing:.18em;font-weight:800;color:var(--sea)}
    .test-chip{font-size:.68rem;letter-spacing:.08em;color:var(--muted);border:1px solid var(--rule);padding:5px 8px;border-radius:999px}
    .brief-title{font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(2rem,7vw,3.6rem);line-height:1.18;letter-spacing:-.03em;margin:0 0 14px;color:var(--ink)}
    .brief-meta,.opening-meta{color:var(--muted);font-size:.78rem;line-height:1.65}
    .brief-deck{margin:0 0 10px;font-size:1rem;line-height:1.8;color:#405158}
    .opening-story{padding:28px 0 6px}
    .opening-story p{margin:0 0 10px;line-height:1.9}
    .opening-greeting{font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:1.18rem;font-weight:700}
    .opening-weather{font-size:1rem}
    .opening-topic{margin-top:18px!important;padding-left:14px;border-left:3px solid var(--sea);font-weight:650}
    .opening-transition{color:var(--muted)}
    .brief-lead{font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(1.16rem,3.5vw,1.45rem);line-height:1.85;margin:20px 0 38px;color:#22343c}
    .brief-section{padding:34px 0;border-top:1px solid var(--rule)}
    .brief-section h2{display:flex;align-items:center;gap:10px;margin:0 0 22px;font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:1.5rem;line-height:1.35;color:var(--ink)}
    .brief-section h2::before{content:"";width:24px;height:2px;background:var(--sea);flex:none}
    .rank-list,.spot-list,.news-list{display:grid}
    .rank-row{padding:16px 0;border-bottom:1px solid var(--rule)}
    .rank-row:first-child{padding-top:0}
    .rank-main{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:baseline}
    .rank-no{font-size:1.35rem;font-weight:900;color:var(--sea-deep)}
    .rank-spot{font-size:1.08rem}
    .rank-size{font-size:1.05rem;font-weight:800;white-space:nowrap}
    .rank-sub{display:flex;flex-wrap:wrap;gap:7px 12px;padding-left:56px;margin-top:7px;color:var(--muted);font-size:.82rem;line-height:1.55}
    .basis-badge,.mini-label{display:inline-flex;align-items:center;border:1px solid currentColor;border-radius:3px;padding:1px 6px;font-size:.68rem;font-weight:800;letter-spacing:.02em}
    .spot-row{padding:20px 0;border-bottom:1px solid var(--rule)}
    .spot-row:first-child{padding-top:0}
    .spot-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
    .spot-row h3{margin:0;font-size:1.12rem}
    .spot-now{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 10px;margin:0 0 8px}
    .spot-now strong{font-size:1.08rem}
    .spot-reference{margin:5px 0 12px;color:var(--muted);font-size:.84rem;line-height:1.65}
    .spot-forecast{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px 10px;padding:12px 14px;background:#f5f2eb;color:#44545b;font-size:.86rem;line-height:1.55}
    .spot-forecast .label{color:var(--sea-deep);font-weight:800}
    .news-row{padding:20px 0;border-bottom:1px solid var(--rule)}
    .news-row:first-child{padding-top:0}
    .news-row h3{margin:0 0 7px;color:var(--sea-deep);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
    .news-row .news-title{margin:0 0 8px;font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:1.08rem;line-height:1.65;color:var(--ink)}
    .news-row p{margin:5px 0;line-height:1.8;color:#405158}
    .alert{margin-top:4px;padding:16px;border-left:4px solid var(--warn);background:var(--warn-bg)}
    .sleague-link,.source-link{color:var(--sea-deep);text-decoration:underline;text-underline-offset:3px}
    .empty{color:#8c9699}
    .search-ref{color:#a26b21;font-weight:700}
    .search-confirmed{color:var(--sea-deep);font-weight:800}.reference-estimate{color:#7a5b16;font-weight:800}
    .method-note{margin:34px 0 8px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 0;color:var(--muted);font-size:.82rem;line-height:1.7}
    .method-note summary{cursor:pointer;font-weight:800;color:#4d5e65}
    .method-note p{margin:10px 0 0}
    .brief-footer{padding-top:20px;color:#8a9497;font-size:.76rem;line-height:1.7}
    @media(max-width:760px){
      .brief-wrap{width:100%;padding:72px 0 0}
      .morning-paper{padding:28px 20px 54px;box-shadow:none}
      .brief-title{font-size:2.15rem}
      .rank-main{grid-template-columns:38px minmax(0,1fr)}
      .rank-size{grid-column:2;white-space:normal}
      .rank-sub{padding-left:48px}
      .spot-forecast{grid-template-columns:68px minmax(0,1fr)}
      .brief-section{padding:30px 0}
    }
  </style>
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">KS</span><span class="brand-copy">KANSAI SURFER</span></a></header>
  <main class="brief-wrap" id="brief" aria-live="polite">
    <p class="brief-kicker">NAMI TEST / MORNING BRIEF</p><h1 class="brief-title">朝刊プレビューを読み込み中…</h1><p class="brief-note">本番未反映。表示・情報設計の確認用です。</p>
  </main>
<script>
const SLEAGUE_URL='https://sleague.rss7.net/';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safeUrl=s=>{try{const u=new URL(String(s));return u.protocol==='https:'?u.href:''}catch{return''}};
const sourceLink=(label,url)=>{const href=safeUrl(url);return href?`<a class="source-link" href="${esc(href)}" rel="noopener noreferrer">${esc(label||href)}</a>`:esc(label||'')};
const sleagueText=s=>esc(s).replaceAll('S.LEAGUE',`<a class="sleague-link" href="${SLEAGUE_URL}">S.LEAGUE</a>`).replaceAll('エスリーグ',`<a class="sleague-link" href="${SLEAGUE_URL}">エスリーグ</a>`);
const hasValue=v=>v!==null&&v!==undefined&&v!=='';
const valueOrEmpty=(v,fallback='未接続')=>hasValue(v)?sleagueText(v):`<span class="empty">${esc(fallback)}</span>`;
const neutralSourceLabel=s=>/S\.LEAGUE|エスリーグ/i.test(String(s||''))?'出典':(s||'出典');
const calendarDay=s=>{
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));
  return m?Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3])):null;
};
const fallbackEligible=(item,date)=>{
  if(item?.publish!==true||!item?.title||!item?.body)return false;
  if(item.meaningful_change===true)return true;
  if(!item.last_published_at)return true;
  const last=calendarDay(item.last_published_at), now=calendarDay(date);
  if(last===null||now===null)return false;
  const minDays=Math.max(3,Number(item.repeat_after_days)||3);
  return (now-last)>=minDays*86400000;
};
const fetchJson=(url,required=false)=>fetch(`${url}?v=${Date.now()}`,{cache:'no-store'})
  .then(r=>{if(!r.ok){if(required)throw new Error(`JSON load failed: ${url}`);return null}return r.json()});
const mergeExternal=(base,external)=>{
  if(!external||external.schema_version!=='ks-morning-brief-v2'||external.verified!==true||external.preview!==false){
    return {...base,_external:false};
  }
  return {
    ...base,
    date: external.date||base.date,
    weekday: external.weekday||base.weekday,
    generated_at: external.generated_at||base.generated_at,
    opening: external.opening||base.opening||{},
    headline: external.headline??base.headline??null,
    ranking: external.ranking||base.ranking||[],
    spots: external.spots||base.spots||[],
    competition_news: external.competition_news||base.competition_news||[],
    competition_fallback: external.competition_fallback||base.competition_fallback||[],
    surf_news: external.surf_news||base.surf_news||[],
    safety_news: external.safety_news||base.safety_news||[],
    safety_status: external.safety_status||base.safety_status||{},
    closing: external.closing??base.closing??null,
    sources_note: [base.sources_note,external.sources_note].filter(Boolean).join(' / '),
    _external:true,
    _collector:external.collection_meta?.collector||'official-context',
    _external_checked_at:external.collection_meta?.checked_at||external.generated_at||null
  };
};
const bodyLabel={0:'フラット',1:'スネ',2:'ヒザ',3:'モモ',4:'腰',5:'腹',6:'胸',7:'肩',8:'頭'};
const overlapLabel=(low,high)=>low===high?`${bodyLabel[low]||'?'}前後`:`${bodyLabel[low]||'?'}〜${bodyLabel[high]||'?'}`;
const sourceKey=o=>{try{return new URL(String(o?.source_url||'')).hostname.replace(/^www\./,'')}catch{return String(o?.source_url||'')}};
const isBcmObservation=o=>/^(?:www\.)?(?:bcm-surfpatrol\.com|m\.bc01\.com)$/i.test(String(o?._sourceKey||''))||/^BCM$/i.test(String(o?.source_name||'').trim())||String(o?.source_kind||'').startsWith('bcm_');
const rangeCenter=o=>(Number(o?.normalized_low)+Number(o?.normalized_high))/2;
const midpointBodyLabel=value=>{
  const v=Math.max(0,Math.min(8,Math.round(Number(value)*2)/2));
  if(v===0)return 'フラット';
  if(Number.isInteger(v))return `${bodyLabel[v]||'?'}前後`;
  const low=Math.floor(v),high=Math.ceil(v);
  return `${bodyLabel[low]||'?'}〜${bodyLabel[high]||'?'}`;
};
const buildBcmKsMidpoint=(rows,policy)=>{
  const cfg=policy?.reference_midpoint||{};
  if(cfg.enabled!==true||cfg.method!=='50_50_midpoint')return null;
  const ksFreshLimit=Math.max(1,Number(cfg.ks_fresh_minutes)||90);
  const bcmMaxAge=Math.max(ksFreshLimit,Number(cfg.bcm_sample_max_age_minutes)||2160);
  const validRange=o=>Number.isFinite(Number(o?.normalized_low))&&Number.isFinite(Number(o?.normalized_high));
  const bcm=rows.find(o=>{
    if(!isBcmObservation(o)||o._age===null||o._age>bcmMaxAge||!validRange(o))return false;
    if(cfg.bcm_requires_delayed_sample_kind===true&&o.source_kind!=='bcm_delayed_public_sample_reference')return false;
    if(o.mapping_kind==='nearby_proxy'&&cfg.proxy_mapping_allowed!==true)return false;
    return true;
  });
  const ks=rows.find(o=>!isBcmObservation(o)&&o._age!==null&&o._age<=ksFreshLimit&&validRange(o));
  if(!bcm||!ks)return null;
  const value=(rangeCenter(bcm)+rangeCenter(ks))/2;
  return {
    label:midpointBodyLabel(value),
    value,
    observed_at:ks.observed_at,
    bcm_observed_at:bcm.observed_at,
    ks_observed_at:ks.observed_at,
    bcm_mapping_kind:bcm.mapping_kind||'exact',
    basis:'bcm_plus_ks_midpoint',
    approximate:true
  };
};
const applySearchObservations=(data,searchData)=>{
  if(!searchData||searchData.schema_version!=='ks-current-search-v1'||searchData.verified!==true||searchData.date!==data.date){
    return {...data,_searchReferenceCount:0,_searchConfirmedCount:0,_referenceEstimateCount:0};
  }
  const now=Date.now();
  const policy=searchData.consensus_policy||{};
  const freshMinutes=Math.max(1,Number(policy.fresh_minutes)||90);
  const agingMinutes=Math.max(freshMinutes,Number(policy.aging_minutes)||180);
  const minSources=Math.max(2,Number(policy.minimum_independent_sources)||2);
  const usable=(searchData.observations||[]).map(o=>{
    const observed=Date.parse(o?.observed_at||'');
    const age=Number.isFinite(observed)&&now>=observed?(now-observed)/60000:null;
    const freshness=age===null?'invalid':age<=freshMinutes?'fresh':age<=agingMinutes?'aging':'stale';
    return {...o,_age:age,_freshness:freshness,_sourceKey:sourceKey(o)};
  }).filter(o=>o?.spot&&o?.normalized_size&&o._freshness!=='invalid');

  const bySpot=new Map();
  for(const o of usable){
    if(!bySpot.has(o.spot))bySpot.set(o.spot,[]);
    bySpot.get(o.spot).push(o);
  }

  let referenceCount=0, confirmedCount=0, referenceEstimateCount=0;
  const spots=(data.spots||[]).map(spot=>{
    const rows=(bySpot.get(spot.name)||[]).sort((a,b)=>Date.parse(b.observed_at)-Date.parse(a.observed_at));
    // NAMI is a staging/data-preview surface: keep the latest valid search
    // observation visible even when stale, but never promote stale data to
    // confirmed current size.
    const references=rows.filter(o=>o._freshness!=='invalid');
    const latest=references[0]||null;
    if(latest)referenceCount++;

    const freshBySource=[];
    const seen=new Set();
    for(const o of rows.filter(x=>x._freshness==='fresh'&&!isBcmObservation(x))){
      if(seen.has(o._sourceKey))continue;
      if(!Number.isFinite(Number(o.normalized_low))||!Number.isFinite(Number(o.normalized_high)))continue;
      seen.add(o._sourceKey); freshBySource.push(o);
    }
    let consensus=null;
    if(freshBySource.length>=minSources){
      const low=Math.max(...freshBySource.map(o=>Number(o.normalized_low)));
      const high=Math.min(...freshBySource.map(o=>Number(o.normalized_high)));
      if(low<=high){
        consensus={
          label:overlapLabel(low,high),low,high,
          source_count:freshBySource.length,
          observed_at:freshBySource.map(o=>o.observed_at).sort().at(-1)
        };
      }
    }
    const referenceEstimate=buildBcmKsMidpoint(rows,policy);
    if(consensus)confirmedCount++;
    if(referenceEstimate)referenceEstimateCount++;
    return {
      ...spot,
      ...(consensus?{current:consensus.label,current_at:consensus.observed_at,current_basis:'search_consensus'}:{}),
      search_reference:latest?{
        size:latest.normalized_size,
        observed_at:latest.observed_at,
        freshness:latest._freshness,
        age_minutes:Math.round(latest._age),
        wind:latest.wind||null
      }:null,
      search_consensus:consensus,
      reference_estimate:referenceEstimate
    };
  });

  const hybridSummary=`検索参考 ${referenceCount}スポット、BCM＋KS中間の参考推定 ${referenceEstimateCount}スポット、複数ソース一致の現在確定 ${confirmedCount}スポット。`;
  return {...data,spots,_hybridSummary:hybridSummary,_searchReferenceCount:referenceCount,_searchConfirmedCount:confirmedCount,_referenceEstimateCount:referenceEstimateCount,_searchCheckedAt:searchData.checked_at||null};
};
Promise.all([
  fetchJson('data/morning-brief.json',true),
  fetchJson('data/morning-external-candidate.json',false),
  fetchJson('data/current-search-observations.json',false)
])
.then(([base,external,searchData])=>{
  const d=applySearchObservations(mergeExternal(base,external),searchData);
  const dateText=d.date?esc(String(d.date).replaceAll('-','/')):'日付未設定';
  const title=`${dateText}（${esc(d.weekday||'')}）関西サーフィン波情報`;
  const o=d.opening||{}, weather=o.osaka_weather||{}, topic=o.topic||{};
  const weatherMeta=[weather.observed_at&&`観測 ${esc(weather.observed_at)}`,weather.forecast_at&&`予報 ${esc(weather.forecast_at)}`,weather.checked_at&&`確認 ${esc(weather.checked_at)}`].filter(Boolean).join('｜');
  const topicMeta=[topic.published_at&&`発表 ${esc(topic.published_at)}`,topic.checked_at&&`確認 ${esc(topic.checked_at)}`].filter(Boolean).join('｜');
  const opening=`<section class="opening-story"><p class="opening-greeting">${esc(o.greeting||'おはようございます、木山です。')}</p><p class="opening-weather">${weather.current?sleagueText(weather.current):'<span class="empty">大阪の現在天気は未接続です。</span>'}</p>${weather.forecast?`<p class="opening-weather">${sleagueText(weather.forecast)}</p>`:''}${weatherMeta?`<p class="opening-meta">${weatherMeta}</p>`:''}<p class="opening-topic">${topic.text?sleagueText(topic.text):'<span class="empty">今日の時事・季節ネタは未接続です。</span>'}</p>${topicMeta?`<p class="opening-meta">${topicMeta}</p>`:''}<p class="opening-transition">${sleagueText(o.transition||'では今日の波を見ていきましょう。')}</p></section>`;
  const ranking=(d.ranking||[]).length?d.ranking.slice(0,5).map(x=>`<article class="rank-row"><div class="rank-main"><span class="rank-no">${esc(x.rank)}位</span><strong class="rank-spot">${esc(x.spot)}</strong><span class="rank-size">${valueOrEmpty(x.size,'サイズなし')}</span></div><div class="rank-sub"><span>${valueOrEmpty(x.wind,'風なし')}</span><span>${valueOrEmpty(x.note,'コメントなし')}</span>${x.basis?`<span class="basis-badge">${x.basis==='current'?'現在':'予報'}</span>`:''}</div></article>`).join(''):'<p class="empty">ランキングデータ未接続。推測値は表示しません。</p>';
  const spots=(d.spots||[]).map(x=>{
    const ref=x.search_reference||null, consensus=x.search_consensus||null, estimate=x.reference_estimate||null;
    const searchSize=consensus
      ?`<span class="search-confirmed">${esc(consensus.label)}</span> <small>複数検索一致</small>`
      :ref
        ?`<span class="search-ref">${esc(ref.size)}</span> <small>${ref.freshness==='fresh'?'新着参考':ref.freshness==='aging'?'時間経過・参考':'古い参考'} / ${esc(ref.observed_at||'')}</small>`
        :'<span class="empty">検索サイズ未取得</span>';
    const estimateLine=estimate?`<p class="spot-reference"><span class="mini-label">参考推定</span> <span class="reference-estimate">${esc(estimate.label)}</span> <small>BCM公開サンプル＋KS参考の中間値 / 現在確定ではありません</small></p>`:'';
    return `<article class="spot-row"><div class="spot-head"><h3>${esc(x.name)}</h3></div><p class="spot-now"><span class="mini-label">現在確定</span><strong>${valueOrEmpty(x.current,'複数検索の一致待ち')}</strong>${x.current_at?`<small>${esc(x.current_at)}</small>`:''}</p><p class="spot-reference"><span class="mini-label">検索参考</span> ${searchSize}</p>${estimateLine}<div class="spot-forecast"><span class="label">API予報</span><span>${valueOrEmpty(x.forecast,'API予報データなし')} ${x.forecast_at?`<small>${esc(x.forecast_at)}</small>`:''}</span><span class="label">API風</span><span>${valueOrEmpty(x.wind_forecast,'風予報なし')} ${x.wind_forecast_at?`<small>${esc(x.wind_forecast_at)}</small>`:''}</span></div></article>`;
  }).join('');
  const freshComp=(d.competition_news||[]).filter(x=>x?.title||x?.body).map(x=>`<article class="news-row"><h3>${sleagueText(x.type||'COMPETITION')}</h3><p class="news-title"><strong>${sleagueText(x.title||'')}</strong></p><p>${sleagueText(x.body||'')}</p>${x.published_at?`<p class="brief-meta">発表 ${esc(x.published_at)}｜確認 ${esc(x.checked_at||'')}</p>`:''}</article>`).join('');
  const fallback=(d.competition_fallback||[]).filter(x=>fallbackEligible(x,d.date)).slice(0,2).map(x=>`<article class="news-row"><h3>COMPETITION</h3><p class="news-title"><strong>${sleagueText(x.title)}</strong></p><p>${sleagueText(x.body)}</p>${x.checked_at?`<p class="brief-meta">確認 ${esc(x.checked_at)}</p>`:''}</article>`).join('');
  const comp=freshComp||fallback||'<p class="empty">本日、大きなコンペニュースはありません。定番情報も再掲条件を満たす場合のみ掲載します。</p>';
  const surf=(d.surf_news||[]).filter(x=>x?.title||x?.body).length?(d.surf_news||[]).filter(x=>x?.title||x?.body).map(x=>`<article class="news-row"><h3>SURF NEWS</h3><p class="news-title"><strong>${sleagueText(x.title)}</strong></p><p>${sleagueText(x.body)}</p>${x.published_at?`<p class="brief-meta">発表 ${esc(x.published_at)}｜確認 ${esc(x.checked_at||'')}</p>`:''}</article>`).join(''):'<p class="empty">本日、掲載するサーフィン関連ニュースはありません。</p>';
  const safetyStatus=d.safety_status||{};
  const safety=(d.safety_news||[]).length?d.safety_news.map(x=>`<article class="news-row alert"><h3>${sleagueText(x.title)}</h3><p>${sleagueText(x.body)}</p><p><span class="label">発表時刻</span>${esc(x.published_at||'')}</p><p><span class="label">確認時刻</span>${esc(x.checked_at||'')}</p></article>`).join(''):(safetyStatus.summary&&safetyStatus.checked_at?`<p class="empty">${sleagueText(safetyStatus.summary)}（${esc(safetyStatus.checked_at)}時点）</p>`:(d._external?'<p class="empty">現在、掲載対象の安全情報はありません。</p>':'<p class="empty">安全情報は準備中です。</p>'));
  document.querySelector('#brief').innerHTML=`<article class="morning-paper"><header class="masthead"><div class="edition-row"><p class="brief-kicker">KANSAI SURFER KS / MORNING</p><span class="test-chip">NAMI TEST</span></div><h1 class="brief-title">${dateText} 朝の波情報</h1><p class="brief-deck">関西9スポットの波情報・風・サーフニュースを、朝の読み物としてまとめています。</p><p class="brief-meta">${esc(d.weekday||'')}曜日｜記事生成 ${d.generated_at?esc(d.generated_at):'未生成'}</p></header>${opening}<p class="brief-lead">${d.headline?sleagueText(d.headline):'<span class="empty">朝刊見出しは未生成です。</span>'}</p><section class="brief-section"><h2>今日の関西 波ランキングTOP5</h2><div class="rank-list">${ranking}</div></section><section class="brief-section"><h2>9スポットの波情報</h2><div class="spot-list">${spots}</div></section><section class="brief-section"><h2>今日のコンペニュース</h2><div class="news-list">${comp}</div></section><section class="brief-section"><h2>サーフィン関連ニュース</h2><div class="news-list">${surf}</div></section><section class="brief-section"><h2>海の事故・安全情報</h2><div class="news-list">${safety}</div></section><section class="brief-section"><h2>今日のひとこと</h2><p>${d.closing?sleagueText(d.closing):'<span class="empty">未生成</span>'}</p></section><details class="method-note"><summary>このページのデータについて</summary><p>NAMI TEST / API + SEARCH DATA</p><p>API予報とWeb検索サイズを別表示。${d._hybridSummary?sleagueText(d._hybridSummary):''} NAMIでは古い検索結果もテスト確認用に参考表示します。BCMの公開サンプル（1日前）を補助参考として使える場合は、BCM側と90分以内のKS検索参考を50%ずつで中間化した「参考推定」も表示します。BCM単独や参考推定は「現在確定」には使わず、「現在確定」は90分以内の独立2ソース以上が重なった場合だけです。</p></details><footer class="brief-footer">現在値・予報・ニュース・警報を分離し、未確認の現地体験や人物証言は生成しません。</footer></article>`;
})
.catch(()=>{const root=document.querySelector('#brief');if(root)root.innerHTML='<p class="alert">データを読み込めませんでした。推測値は表示しません。</p>';});
</script>
</body>
</html>
