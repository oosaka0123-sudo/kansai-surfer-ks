name: Deploy KS redesign preview to nami

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read

concurrency:
  group: kansai-surfer-nami-redesign-preview
  cancel-in-progress: false

jobs:
  deploy-nami-preview:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.user.type != 'Bot' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@deploy-nami-preview')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ftp.lolipop.jp
      DEPLOY_SCHEME: ftp
      DEPLOY_PORT: "21"
      DEPLOY_ROOT: /nami
      DEPLOY_SUBDIR: ks-redesign
      SITE_URL: https://nami.rss7.net/ks-redesign/
      SOURCE_DIR: prototype/ks-redesign

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate source and nami target
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          [[ -n "$DEPLOY_USER" && -n "$DEPLOY_PASSWORD" ]] \
            || { echo "nami FTP user/password secrets are incomplete."; exit 1; }
          [[ "$DEPLOY_HOST" == "ftp.lolipop.jp" ]] \
            || { echo "nami FTP host is invalid."; exit 1; }
          [[ "$DEPLOY_SCHEME" == "ftp" ]] \
            || { echo "nami FTP scheme is invalid."; exit 1; }
          [[ "$DEPLOY_PORT" == "21" ]] \
            || { echo "nami FTP port is invalid."; exit 1; }
          [[ "$DEPLOY_ROOT" == "/nami" ]] \
            || { echo "nami root must be exactly /nami."; exit 1; }
          [[ "$DEPLOY_SUBDIR" == "ks-redesign" ]] \
            || { echo "preview subdirectory is invalid."; exit 1; }
          [[ "${SITE_URL%/}" == "https://nami.rss7.net/ks-redesign" ]] \
            || { echo "preview URL is invalid."; exit 1; }

          test -f "$SOURCE_DIR/index.html" \
            || { echo "Missing $SOURCE_DIR/index.html"; exit 1; }
          test -f "$SOURCE_DIR/isonoura.html" \
            || { echo "Missing $SOURCE_DIR/isonoura.html"; exit 1; }
          test -f "$SOURCE_DIR/styles.css" \
            || { echo "Missing $SOURCE_DIR/styles.css"; exit 1; }
          test -f "$SOURCE_DIR/data/current-search-observations.json" \
            || { echo "Missing $SOURCE_DIR/data/current-search-observations.json"; exit 1; }

          echo "Preview source and target validation passed."

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Ensure isolated preview directory exists
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          # Lolipop rejects lftp's recursive `mkdir -p` implementation with
          # `SITE MKDIR`. First test whether the directory already exists;
          # otherwise create exactly one child directory with standard FTP MKD.
          if lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT"
          cd "$DEPLOY_ROOT/$DEPLOY_SUBDIR"
          bye
          LFTP
          then
            echo "Preview directory already exists."
          else
            echo "Preview directory does not exist yet; creating it with standard FTP MKD."
            lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT"
          cd "$DEPLOY_ROOT"
          mkdir "$DEPLOY_SUBDIR"
          cd "$DEPLOY_SUBDIR"
          bye
          LFTP
          fi

      - name: Upload isolated preview without remote deletion
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT"
          mirror --reverse --verbose --parallel=2 --no-perms --exclude-glob README.md --exclude-glob data/current-search-observations.json "$SOURCE_DIR" "$DEPLOY_ROOT/$DEPLOY_SUBDIR"
          bye
          LFTP

          echo "Preview upload finished. No remote delete option was used."

      - name: Verify public preview URLs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$SITE_URL" > /tmp/ks-preview-index.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${SITE_URL}isonoura.html" > /tmp/ks-preview-isonoura.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${SITE_URL}morning-brief.html" > /tmp/ks-preview-morning.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${SITE_URL}data/morning-brief.json" > /tmp/ks-preview-morning.json
          CACHE_BUST="$(date +%s)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 -H 'Cache-Control: no-cache' "${SITE_URL}data/morning-external-candidate.json?v=${CACHE_BUST}" > /tmp/ks-preview-external.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 -H 'Cache-Control: no-cache' "${SITE_URL}data/current-search-observations.json?v=${CACHE_BUST}" > /tmp/ks-preview-search.json

          grep -qi '<html' /tmp/ks-preview-index.html
          grep -qi '<html' /tmp/ks-preview-isonoura.html
          grep -q 'おはようございます、木山です。' /tmp/ks-preview-morning.html
          grep -q 'サーフィン関連ニュース' /tmp/ks-preview-morning.html
          grep -q '海の事故・安全情報' /tmp/ks-preview-morning.html
          grep -q 'https://sleague.rss7.net/' /tmp/ks-preview-morning.html
          grep -q 'API + SEARCH DATA' /tmp/ks-preview-morning.html
          grep -q 'morning-external-candidate.json' /tmp/ks-preview-morning.html
          grep -q 'current-search-observations.json' /tmp/ks-preview-morning.html

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/ks-preview-morning.json').read_text(encoding='utf-8'))
          expected = ['磯ノ浦','国府の浜','生見','小松海岸','伊良湖','静波','浜詰','高浜','白兎']

          assert data.get('schema_version') == 'ks-morning-brief-v2'
          assert data.get('preview') is True
          assert data.get('verified') is False
          assert (data.get('opening') or {}).get('greeting') == 'おはようございます、木山です。'
          assert [x.get('name') for x in data.get('spots', [])] == expected

          fallback_kinds = {x.get('kind') for x in data.get('competition_fallback', [])}
          for required in {'monthly_schedule', 'sleague_top3', 'kanoa_ranking'}:
              assert required in fallback_kinds, f'missing fallback kind: {required}'

          search_data = json.loads(Path('/tmp/ks-preview-search.json').read_text(encoding='utf-8'))
          assert search_data.get('schema_version') == 'ks-current-search-v1'
          assert search_data.get('verified') is True
          assert search_data.get('date')
          assert search_data.get('observations')
          assert all(x.get('spot') and x.get('normalized_size') and x.get('observed_at') and x.get('source_url') for x in search_data['observations'])
          policy = search_data.get('consensus_policy') or {}
          assert policy.get('minimum_independent_sources') == 2
          assert policy.get('fresh_minutes') == 90
          assert policy.get('single_source') == 'reference_only'
          assert policy.get('source_visibility') == 'backend_only'
          midpoint = policy.get('reference_midpoint') or {}
          assert midpoint.get('enabled') is True
          assert midpoint.get('method') == '50_50_midpoint'
          assert midpoint.get('ks_fresh_minutes') == 90
          assert midpoint.get('bcm_sample_max_age_minutes') == 2160
          assert midpoint.get('bcm_requires_delayed_sample_kind') is True
          assert midpoint.get('output') == 'reference_estimate_only'
          assert all(x.get('normalized_low') is not None and x.get('normalized_high') is not None for x in search_data['observations'])

          external = json.loads(Path('/tmp/ks-preview-external.json').read_text(encoding='utf-8'))
          assert external.get('schema_version') == 'ks-morning-brief-v2'
          assert external.get('verified') is True and external.get('preview') is False
          assert (external.get('opening') or {}).get('osaka_weather', {}).get('current')
          assert len(external.get('ranking') or []) == 5
          assert all(x.get('basis') == 'forecast' for x in external.get('ranking', []))
          assert sum(1 for x in external.get('spots', []) if x.get('forecast')) == 9
          print('Morning brief public JSON verification passed.')
          print('Live TOP5:', [(x['rank'], x['spot'], x['size']) for x in external['ranking']])
          PY

          python3 scripts/validate_morning_brief.py --mode production --file /tmp/ks-preview-external.json
          echo "nami preview HTTP verification succeeded: $SITE_URL"

      - name: Verify rendered morning brief in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          [[ -n "$CHROME" ]] || { echo "Chrome is unavailable on runner."; exit 1; }
          CACHE_BUST="$(date +%s)"
          PAGE="${SITE_URL}morning-brief.html?v=${CACHE_BUST}"
          CANDIDATE="${SITE_URL}data/morning-external-candidate.json?v=${CACHE_BUST}"
          SEARCH_DATA="${SITE_URL}data/current-search-observations.json?v=${CACHE_BUST}"
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$CANDIDATE" > /tmp/render-candidate.json
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$SEARCH_DATA" > /tmp/render-search.json
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom "$PAGE" > /tmp/rendered-morning.html

          python3 - <<'PY'
          import html
          import json
          import re
          from pathlib import Path

          candidate = json.loads(Path('/tmp/render-candidate.json').read_text(encoding='utf-8'))
          search_data = json.loads(Path('/tmp/render-search.json').read_text(encoding='utf-8'))
          rendered = html.unescape(Path('/tmp/rendered-morning.html').read_text(encoding='utf-8'))
          visible = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', rendered)
          text = re.sub(r'<[^>]+>', ' ', visible)
          text = re.sub(r'\s+', ' ', text)

          for hidden_label in ('天気ソース','話題ソース','出典','発表元','一次情報','確認元：','公式外部ソース接続済み','1173life','SURFAREA','Surf life'):
              assert hidden_label not in text, hidden_label
          assert 'API予報とWeb検索サイズを別表示' in text
          assert '検索サイズ' in text
          assert '現在確定' in text
          assert '複数検索の一致待ち' in text
          assert 'API予報' in text
          weather = candidate['opening']['osaka_weather']['current']
          assert weather in text, weather
          for item in candidate['ranking']:
              assert item['spot'] in text, item
              assert item['size'] in text, item
          for spot in candidate['spots']:
              assert spot['name'] in text, spot['name']
              if spot.get('forecast'):
                  assert spot['forecast'] in text, spot
          observed_spots={obs['spot'] for obs in search_data['observations']}
          for spot in observed_spots:
              assert spot in text, spot
          sizes=[obs['normalized_size'] for obs in search_data['observations']]
          assert any(size in text for size in sizes) or '複数検索一致' in text
          assert '1173life.com' not in text
          assert 'API + SEARCH DATA' in text
          print('Rendered NAMI morning DOM verification passed.')
          print('Rendered weather:', weather)
          print('Rendered TOP5:', [(x['rank'], x['spot'], x['size']) for x in candidate['ranking']])
          PY
