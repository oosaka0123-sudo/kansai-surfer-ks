name: Validate share buttons on 10 major pages

on:
  push:
    branches:
      - feat/share-buttons-major-9-spots-20261021

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify markup and responsive screenshots
        shell: bash
        run: |
          set -euo pipefail
          pages=(index.html isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html)

          python3 - <<'PY'
          import pathlib,re
          pages=["index.html","isonoura.html","kounohama.html","ikumi.html","komatsu.html","irago.html","shizunami.html","hamadutu.html","takahama.html","hakuto.html"]
          for p in pages:
              s=pathlib.Path(p).read_text(encoding="utf-8")
              strip_start=s.find('<div class="top-strip">')
              verdict=s.find('<section class="verdict-banner">',strip_start)
              hero=s.find('<section class="top-hero">',strip_start)
              end_candidates=[x for x in (verdict,hero) if x>=0]
              if strip_start<0 or not end_candidates:
                  raise SystemExit(f"{p}: top strip boundary missing")
              strip=s[strip_start:min(end_candidates)]
              if p=="index.html":
                  if s.count('id="topShareBtn"')!=1:
                      raise SystemExit(f"{p}: top share count")
                  if 'id="topShareBtn"' not in strip:
                      raise SystemExit(f"{p}: top share not in strip")
              else:
                  if s.count('id="spotPageShareBtn"')!=1:
                      raise SystemExit(f"{p}: spot share count")
                  if 'id="spotPageShareBtn"' not in strip:
                      raise SystemExit(f"{p}: spot share not in strip")
                  for token in ("navigator.share","navigator.clipboard","AbortError","border: 0","background: transparent"):
                      if token not in s:
                          raise SystemExit(f"{p}: missing {token}")
              if 'isonouraShareBtn' in s:
                  raise SystemExit(f"{p}: legacy Isonoura share remains")
              print("OK",p)
          PY

          python3 -m http.server 8765 >/tmp/ks-major-share.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          mkdir -p "$RUNNER_TEMP/major-share"
          for p in "${pages[@]}"; do
            out="${p%.html}-390.png"
            timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars               --virtual-time-budget=1500 --window-size=390,844               --screenshot="$RUNNER_TEMP/major-share/$out"               "http://127.0.0.1:8765/$p"
            test -s "$RUNNER_TEMP/major-share/$out"
          done

          for p in index.html isonoura.html hakuto.html; do
            out="${p%.html}-320.png"
            timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars               --virtual-time-budget=1500 --window-size=320,760               --screenshot="$RUNNER_TEMP/major-share/$out"               "http://127.0.0.1:8765/$p"
            test -s "$RUNNER_TEMP/major-share/$out"
          done

          echo MAJOR_10_SHARE_PREVIEW_OK

      - uses: actions/upload-artifact@v4
        with:
          name: major-10-share-preview
          path: ${{ runner.temp }}/major-share/*.png
          retention-days: 3
