name: Patch LINE welcome text on nami

on:
  push:
    branches:
      - chore/line-group-welcome-bot
    paths:
      - '.github/workflows/patch-line-welcome-text-nami.yml'
      - '.github/scripts/patch-line-welcome-text.php'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ftp.lolipop.jp
      BOT_DIR: /nami/ks-line-bot
      WEBHOOK_URL: https://nami.rss7.net/ks-line-bot/webhook.php

    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Download current webhook
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          get "$BOT_DIR/webhook.php" -o /tmp/webhook-before.php
          bye
          LFTP
          php -l /tmp/webhook-before.php

      - name: Save rollback copy
        uses: actions/upload-artifact@v4
        with:
          name: line-webhook-before-welcome-text-update
          path: /tmp/webhook-before.php
          retention-days: 30

      - name: Patch only welcome text
        run: |
          set -euo pipefail
          php .github/scripts/patch-line-welcome-text.php /tmp/webhook-before.php /tmp/webhook-after.php
          php -l /tmp/webhook-after.php
          grep -q 'はじめまして！〇〇です' /tmp/webhook-after.php
          grep -q 'ニックネーム：〇〇' /tmp/webhook-after.php

      - name: Upload patched webhook only
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          put /tmp/webhook-after.php -o "$BOT_DIR/webhook.php"
          bye
          LFTP

      - name: Verify live webhook
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(curl --fail --silent --show-error --location "$WEBHOOK_URL")" = 'ok'
          set +x
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          get "$BOT_DIR/webhook.php" -o /tmp/webhook-live.php
          bye
          LFTP
          php -l /tmp/webhook-live.php
          grep -q 'はじめまして！〇〇です' /tmp/webhook-live.php
          grep -q 'ニックネーム：〇〇' /tmp/webhook-live.php
          echo "LINE welcome text deployed."
