name: KS forecast audit capture
on:
  schedule:
    - cron: '30 10 * * *' # 19:30 JST primary
    - cron: '0 11 * * *' # 20:00 JST fallback
    - cron: '0 12 * * *' # 21:00 JST fallback
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ks-forecast-audit-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit tool
        run: node --test tests/forecast-accuracy-audit.test.cjs
      - name: Guard scheduled JST issuance window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            minute=$(TZ=Asia/Tokyo date +%H%M)
            if [ "$minute" -lt 1930 ] || [ "$minute" -gt 2200 ]; then
              echo "Outside evening issue window; no forecast mislabeled."
              exit 1
            fi
          fi
      - name: Freeze publicly served KS forecast
        id: freeze
        run: |
          mkdir -p audit-output
          node scripts/forecast-accuracy-audit.cjs capture audit-output/snapshot.json
      - name: Retain immutable run snapshot
        if: always() && (steps.freeze.outcome == 'success' || steps.freeze.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: ks-forecast-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/snapshot.json
          if-no-files-found: error
          retention-days: 90
