name: Inspect production Claude model safely

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Inspect likely production AI scripts
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          TMP="$RUNNER_TEMP/ks-claude-inspect"
          mkdir -p "$TMP"

          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          get /kansai/admin/ai_draft.php -o "$TMP/ai_draft.php"
          get /kansai/admin/auto_wave_post.php -o "$TMP/auto_wave_post.php"
          get /kansai/admin/auto_wave_today.php -o "$TMP/auto_wave_today.php"
          bye
          LFTP_EOF

          PROD_ROOT="$TMP" python - <<'PY'
          import os, re, pathlib
          root = pathlib.Path(os.environ['PROD_ROOT'])
          model_re = re.compile(r'claude-[a-z0-9][a-z0-9._-]*', re.I)
          print('CLAUDE_RUNTIME_MATCHES')
          for p in sorted(root.glob('*.php')):
              text = p.read_text(encoding='utf-8', errors='ignore')
              models = sorted(set(model_re.findall(text)))
              anthropic = 'api.anthropic.com' in text.lower() or 'anthropic' in text.lower()
              print(f'FILE={p.name}')
              print('MODELS=' + (','.join(models) if models else '(none detected)'))
              print('ANTHROPIC_REF=' + ('yes' if anthropic else 'no'))
          PY
