name: Inspect production Claude model safely

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Locate Claude runtime references safely
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          TMP="$RUNNER_TEMP/ks-claude-inspect"
          mkdir -p "$TMP/files"

          lftp <<LFTP_EOF > "$TMP/list.txt"
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          find /kansai
          bye
          LFTP_EOF

          grep -Ei '\.(php|py|js|sh)$' "$TMP/list.txt"             | grep -Ei '(blog|diary|journal|cron|claude|anthropic|article|generate|ai)'             | grep -Evi '(config|secret|token|credential|uploads|/data/)'             | head -n 120 > "$TMP/candidates.txt" || true

          echo 'CANDIDATE_PATHS'
          cat "$TMP/candidates.txt" || true

          while IFS= read -r remote; do
            [ -n "$remote" ] || continue
            safe="$(printf '%s' "$remote" | tr '/ ' '__')"
            local_file="$TMP/files/$safe"
            lftp <<LFTP_EOF >/dev/null
            set cmd:fail-exit true
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ftp:passive-mode true
            open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
            get "$remote" -o "$local_file"
            bye
            LFTP_EOF
          done < "$TMP/candidates.txt"

          PROD_ROOT="$TMP/files" python - <<'PY'
          import os, re, pathlib
          root = pathlib.Path(os.environ['PROD_ROOT'])
          model_re = re.compile(r'claude-[a-z0-9][a-z0-9._-]*', re.I)
          hits = []
          for p in root.iterdir():
              if not p.is_file():
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              models = sorted(set(model_re.findall(text)))
              anthropic = 'api.anthropic.com' in text.lower() or 'anthropic' in text.lower()
              if models or anthropic:
                  hits.append((p.name, models, anthropic))
          print('CLAUDE_RUNTIME_MATCHES')
          if not hits:
              print('NONE')
          for name, models, anthropic in hits:
              print(f'FILE={name}')
              print('MODELS=' + (','.join(models) if models else '(none detected)'))
              print('ANTHROPIC_REF=' + ('yes' if anthropic else 'no'))
          PY
