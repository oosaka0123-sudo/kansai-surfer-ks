name: Audit production morning generator safely

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  isonoura-kanto-tide-one-spot:
    if: github.ref == 'refs/heads/deploy/isonoura-kanto-port-20261123' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
      ROOT: /kansai
      OLD_SHA256: 9c67673d95a5ff1f09708d659f4c9b707819692bf18b8d13a454f5c2fabd9f24
      NEW_SHA256: cbb6b25924c35f2b20e64cb4ac58214c736c80fa5d26bccb4e23bc4fcbf0d7c1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Guard exact old HTML and the new six assets
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          test "$FTP_HOST" = ftp.lolipop.jp && test "$ROOT" = /kansai
          D="$RUNNER_TEMP/ks-isonoura-kanto-tide"
          mkdir -m 700 "$D"
          git show 94d7f723128ba5ecd688c0c6bf20652595e3c26b:isonoura.html > "$D/baseline.html"
          lftp <<LFTP_GET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$ROOT/isonoura.html" -o "$D/old.html"
          bye
          LFTP_GET
          curl --fail --silent --show-error --location --retry 3 "https://kansai.rss7.net/isonoura.html?pre_ks_port=$GITHUB_RUN_ID" -o "$D/http-old.html"
          cmp "$D/baseline.html" "$D/old.html"
          cmp "$D/old.html" "$D/http-old.html"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'ks-isonoura-kanto-tide'
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(d/'old.html')==os.environ['OLD_SHA256'],'PRODUCTION_CHANGED_REFUSE_OVERWRITE'
          assert sha('isonoura.html')==os.environ['NEW_SHA256'],'TARGET_SHA_MISMATCH'
          assert sha('isonoura-hourly/app.js')=='4501ecaa3b9e566d5c4ed4a2ed358e9634380bc6e6431308fb6e7d1e5df0870e','Kanto app.js changed'
          assert sha('isonoura-hourly/styles.css')=='0db55514fd86b56c7d40f6317d2efa6643e961e1c9cef73772140e3d50500e68','Kanto CSS changed'
          new=Path('isonoura.html').read_bytes()
          old=Path(d/'old.html').read_bytes()
          assert b'id="ks-isonoura-kanto-hourly"' in new
          assert b'id="ks-isonoura-kanto-hourly"' not in old
          for marker in (b'id="ks10-forecast"',b'LAT: 34.18, LNG: 135.05,',b'WAVE_FACTOR: 0.7,',b'nami_common.js?v=1018'):
              assert new.count(marker)==old.count(marker)==1,marker
          for yr in (2026,2027):
              tide=json.loads(Path(f'isonoura-hourly/data/WY-{yr}.json').read_text(encoding='utf-8'))
              assert tide['station_id']=='WY' and tide['year']==yr and tide['observation'] is False
              assert len(tide['days'])==365
              assert tide['days'][0]['date']==f'{yr}-01-01'
              assert all(len(x['hourly_cm'])==24 for x in tide['days'])
          for file in ['isonoura-hourly/index.html','isonoura-hourly/app.js','isonoura-hourly/styles.css','isonoura-hourly/adapter.js','isonoura-hourly/data/WY-2026.json','isonoura-hourly/data/WY-2027.json']:
              assert Path(file).stat().st_size>500,(file,'empty asset')
          print('PREFLIGHT_PASS_ONLY_ISONOURA_AND_NEW_ASSETS')
          PY
          # No pre-existing dedicated graph folder may be overwritten.
          if lftp <<LFTP_EXISTS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 1
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          cls -1 "$ROOT/isonoura-hourly"
          bye
          LFTP_EXISTS
          then
            echo "GRAPH_ASSETS_DIRECTORY_ALREADY_EXISTS_STOP"
            exit 1
          fi
          echo "LIVE_AND_ASSET_GUARDS_PASS"

      - name: Preserve original production page for rollback
        uses: actions/upload-artifact@v4
        with:
          name: ks-isonoura-before-kanto-port-${{ github.run_id }}
          path: ${{ runner.temp }}/ks-isonoura-kanto-tide/old.html
          retention-days: 30
          if-no-files-found: error

      - name: Publish new dedicated assets then switch ONLY Isonoura page
        shell: bash
        run: |
          set -euo pipefail
          set +x
          D="$RUNNER_TEMP/ks-isonoura-kanto-tide"
          MODIFIED=0
          rollback() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$MODIFIED" -eq 1 ]; then
              echo "UPLOAD_FAILED_TRY_RESTORE_ORIGINAL_ISONOURA"
              lftp <<LFTP_RESTORE || true
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "$D/old.html" -o "$ROOT/isonoura.html"
          bye
          LFTP_RESTORE
              echo "ROLLBACK_ATTEMPTED_MANUALLY_VERIFY"
            fi
            exit "$status"
          }
          trap rollback EXIT
          lftp <<LFTP_REGET_OLD
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$ROOT/isonoura.html" -o "$D/check-old.html"
          bye
          LFTP_REGET_OLD
          cmp "$D/old.html" "$D/check-old.html"
          # Dedicated paths only; NEVER mirror the repository or upload main.
          lftp <<LFTP_ASSETS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          mkdir -p "$ROOT/isonoura-hourly/data"
          put "isonoura-hourly/index.html" -o "$ROOT/isonoura-hourly/index.html"
          put "isonoura-hourly/app.js" -o "$ROOT/isonoura-hourly/app.js"
          put "isonoura-hourly/styles.css" -o "$ROOT/isonoura-hourly/styles.css"
          put "isonoura-hourly/adapter.js" -o "$ROOT/isonoura-hourly/adapter.js"
          put "isonoura-hourly/data/WY-2026.json" -o "$ROOT/isonoura-hourly/data/WY-2026.json"
          put "isonoura-hourly/data/WY-2027.json" -o "$ROOT/isonoura-hourly/data/WY-2027.json"
          bye
          LFTP_ASSETS
          # Verify public assets before switching the existing spot page.
          for asset in index.html app.js styles.css adapter.js data/WY-2026.json data/WY-2027.json; do
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "https://kansai.rss7.net/isonoura-hourly/$asset?verify_assets=$GITHUB_RUN_ID" -o "$D/asset-$(basename "$asset")"
            cmp "isonoura-hourly/$asset" "$D/asset-$(basename "$asset")"
          done
          # Switch the one existing page only when the six assets are readable.
          MODIFIED=1
          lftp <<LFTP_SWITCH
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "isonoura.html" -o "$ROOT/isonoura.html"
          get "$ROOT/isonoura.html" -o "$D/verify-new.html"
          bye
          LFTP_SWITCH
          cmp "isonoura.html" "$D/verify-new.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "https://kansai.rss7.net/isonoura.html?post_ks_port=$GITHUB_RUN_ID" -o "$D/http-new.html"
          cmp "isonoura.html" "$D/http-new.html"
          test "$(sha256sum "$D/http-new.html" | cut -d ' ' -f1)" = "$NEW_SHA256"
          MODIFIED=0
          trap - EXIT
          echo "PRODUCTION_DEPLOY_PASS_ISONOURA_ONLY_AND_SIX_NEW_ASSETS"
