name: Audit production morning generator safely

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ks-pr138-isolated-ci
  cancel-in-progress: false

jobs:
  test_takahama_split:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout PR138 candidate (no credential persistence)
        uses: actions/checkout@v4
        with:
          ref: proposal/ks-takahama-split-dryrun-20261122
          persist-credentials: false
      - name: Verify reviewed candidate revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "21ab30ee72ecf84a74a11be848952d65a2988f36"
          test -f scripts/takahama_split_dryrun.py
          test -f scripts/test_takahama_split_dryrun.py
          echo "REVIEWED_SHA_GUARD=PASS"
      - name: Install PHP CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli >/dev/null
      - name: Execute 11 offline unit and PHP URL tests (no external API)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_takahama_split_dryrun.py' -v
          echo "OFFLINE_TESTS_COMPLETE"
          echo "PRODUCTION_CHANGED=0"
