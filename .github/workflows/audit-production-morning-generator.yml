name: Audit production morning generator safely
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ks-takahama-10day-ui-single-file-release
  cancel-in-progress: false
jobs:
  takahama_10day_html_only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed Takahama HTML candidate
        uses: actions/checkout@v4
        with:
          ref: fix/takahama-10day-ui-only-20261122
          persist-credentials: false
      - name: Prepare private FTPS workspace
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch takahama.html >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp gnupg >/dev/null
          install -d -m 0700 "$RUNNER_TEMP/ks-takahama-10day-release"
          test "$(sha256sum takahama.html | cut -d' ' -f1)" = "cc9dadaaf2169d70b492d4e7d3c27c182c587b84b49b0aaf68abc4bc9bcc9b9f"
          echo "CANDIDATE_SHA256_PIN=PASS"
      - name: Download live Takahama HTML by FTPS GET only
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          root="$RUNNER_TEMP/ks-takahama-10day-release"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" ftp.lolipop.jp
          get /kansai/takahama.html -o "$root/original.html"
          bye
          LFTP_EOF
          test -s "$root/original.html"
          test "$(sha256sum "$root/original.html" | cut -d' ' -f1)" = "88fab7a37e31e67678f1772b3b11b273d9045f05f5dcc65e8e5f4b645ed7a6a9"
          echo "LIVE_HTML_BASELINE_SHA=PASS"
      - name: Verify the only changed bytes belong to section 05
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ks-takahama-10day-release"
          ORIGINAL="$root/original.html" CANDIDATE="$GITHUB_WORKSPACE/takahama.html" python3 - <<'PY'
          from pathlib import Path
          import os,hashlib,re
          o=Path(os.environ['ORIGINAL']).read_bytes()
          n=Path(os.environ['CANDIDATE']).read_bytes()
          def locate(data,needle):
              start=data.find(needle)
              assert start!=-1 and data.find(needle,start+1)==-1,"anchor missing or repeated"
              begin=data.rfind(b'<section class="section',0,start)
              assert begin>=0,"section start missing"
              end=data.find(b'</section>',start)
              assert end!=-1,"section end missing"
              return begin,end+len(b'</section>')
          os_,oe=locate(o,b'<span class="no">05</span>')
          ns,ne=locate(n,b'id="ks10-title"')
          assert o[:os_]==n[:ns],"preceding page content changed"
          assert o[oe:]==n[ne:],"following page content changed"
          old=o[os_:oe].decode('utf-8')
          new=n[ns:ne].decode('utf-8')
          assert 'id="weeklyBody"' in old
          assert 'id="ks10-body"' in new
          assert '10日間の波・風予報' in new
          assert 'latitude=35.65&longitude=135.45' in new
          assert 'latitude=35.49133&longitude=135.55782' in new
          assert 'forecast_days=10' in new
          assert '伊良湖' not in new and 'Ikumi' not in new
          assert n.count(b'class="floating-line"')==o.count(b'class="floating-line"')==1
          assert b'nami_common.js?v=1018' in n
          assert b'const SPOT_CONFIG' in n
          assert b'LAT: 35.708, LNG: 135.208' in n
          print('SECTION_05_ONLY_DIFF=PASS')
          print('LINE_AND_OTHER_SECTIONS_IDENTICAL=YES')
          print('TWO_API_COORDINATES=CORRECT')
          print('ORIGINAL_SHA256='+hashlib.sha256(o).hexdigest())
          print('CANDIDATE_SHA256='+hashlib.sha256(n).hexdigest())
          PY
      - name: Save encrypted original to recoverable private artifact
        shell: bash
        env:
          BACKUP_SECRET: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          root="$RUNNER_TEMP/ks-takahama-10day-release"
          printf '%s' "$BACKUP_SECRET" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$root/takahama-old.html.gpg" "$root/original.html"
          printf '%s' "$BACKUP_SECRET" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$root/takahama-old.html.gpg" > "$root/verify.html"
          cmp "$root/original.html" "$root/verify.html"
          rm -f "$root/verify.html"
          echo "ENCRYPTED_BACKUP_VERIFIED=YES"
      - name: Store encrypted rollback artifact before upload
        uses: actions/upload-artifact@v4
        with:
          name: takahama-weekly-html-before-10day-20261122
          path: ${{ runner.temp }}/ks-takahama-10day-release/takahama-old.html.gpg
          retention-days: 30
          if-no-files-found: error
      - name: Recheck origin and upload exactly one HTML file with rollback
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          root="$RUNNER_TEMP/ks-takahama-10day-release"
          lftp <<LFTP_RECHECK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" ftp.lolipop.jp
          get /kansai/takahama.html -o "$root/preput.html"
          bye
          LFTP_RECHECK
          cmp "$root/original.html" "$root/preput.html"
          rollback() {
            echo "UPLOAD_FAILED_ATTEMPT_ROLLBACK"
            if lftp <<LFTP_RESTORE
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" ftp.lolipop.jp
          put "$root/original.html" -o /kansai/takahama.html
          get /kansai/takahama.html -o "$root/restored.html"
          bye
          LFTP_RESTORE
            then
              cmp -s "$root/original.html" "$root/restored.html" && echo "ROLLBACK_VERIFIED=YES" || echo "ROLLBACK_VERIFIED=NO"
            else
              echo "ROLLBACK_FTPS_FAILED"
            fi
          }
          if ! lftp <<LFTP_DEPLOY
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" ftp.lolipop.jp
          put "$GITHUB_WORKSPACE/takahama.html" -o /kansai/takahama.html
          get /kansai/takahama.html -o "$root/verified.html"
          bye
          LFTP_DEPLOY
          then
            rollback
            exit 1
          fi
          if ! cmp -s "$GITHUB_WORKSPACE/takahama.html" "$root/verified.html"; then
            rollback
            exit 1
          fi
          test "$(sha256sum "$root/verified.html" | cut -d' ' -f1)" = "cc9dadaaf2169d70b492d4e7d3c27c182c587b84b49b0aaf68abc4bc9bcc9b9f" || { rollback; exit 1; }
          echo "DEPLOY_SUCCESS_TARGET=/kansai/takahama.html"
          echo "REMOTE_SHA256=cc9dadaaf2169d70b492d4e7d3c27c182c587b84b49b0aaf68abc4bc9bcc9b9f"
          echo "OTHER_UPLOADED_FILES=0"
      - name: Verify published UI and HTTP health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://kansai.rss7.net/takahama.html?ks10_deploy=20261122' -o "$RUNNER_TEMP/takahama-live.html"
          grep -q 'id="ks10-forecast"' "$RUNNER_TEMP/takahama-live.html"
          grep -q 'id="ks10-body"' "$RUNNER_TEMP/takahama-live.html"
          grep -q '10日間の波・風予報' "$RUNNER_TEMP/takahama-live.html"
          if grep -q 'id="weeklyBody"' "$RUNNER_TEMP/takahama-live.html"; then echo "OLD_WEEKLY_UI_STILL_LIVE";exit 1;fi
          echo "PUBLIC_10DAY_UI=PASS"
          echo "PUB_HTTP=200"
