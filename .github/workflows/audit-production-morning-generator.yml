name: Audit production morning generator safely

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ks-pr138-isolated-ci
  cancel-in-progress: false

jobs:
  test_takahama_split:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout PR138 candidate (no credential persistence)
        uses: actions/checkout@v4
        with:
          ref: proposal/ks-takahama-split-dryrun-20261122
          persist-credentials: false
      - name: Verify reviewed candidate revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "60958d5b0df0d18ae55f72c43ee067bc6cbe8169"
          test -f scripts/takahama_split_dryrun.py
          test -f scripts/test_takahama_split_dryrun.py
          echo "REVIEWED_SHA_GUARD=PASS"
      - name: Install PHP CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli >/dev/null
      - name: Execute 18 offline unit and PHP URL tests (no external API)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_takahama_split_dryrun.py' -v
          echo "OFFLINE_TESTS_COMPLETE"
          echo "PRODUCTION_CHANGED=0"

  verify_production_coordinate_dependents:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install FTPS read-only utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
      - name: Download production generator (FTPS GET only)
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/takahama-pr138-coord-audit"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 2
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          get /kansai/fetch_wave_data.php -o "$RUNNER_TEMP/takahama-pr138-coord-audit/production.php"
          bye
          LFTP_EOF
          test -s "$RUNNER_TEMP/takahama-pr138-coord-audit/production.php"
          echo "FTPS_GET_ONLY=YES"
      - name: Report redacted coordinate usages and source hash
        shell: bash
        run: |
          set -euo pipefail
          PHP="$RUNNER_TEMP/takahama-pr138-coord-audit/production.php" python3 - <<'PY'
          import hashlib,os,pathlib,re
          path=pathlib.Path(os.environ['PHP'])
          b=path.read_bytes()
          src=b.decode('utf-8')
          lines=src.splitlines()
          print('SOURCE_SHA256='+hashlib.sha256(b).hexdigest())
          print('SOURCE_BYTE_COUNT='+str(len(b)))
          latlon=re.compile(r'''\$spot\s*\[\s*['"](?:lat|lng)['"]\s*\]''',re.I)
          found=[]
          for i,line in enumerate(lines):
              matches=latlon.findall(line)
              if not matches:continue
              context=' '.join(lines[max(0,i-4):min(len(lines),i+2)])
              kinds=[]
              if re.search(r'\bmarineUrl\b',context):kinds.append('marine_url')
              if re.search(r'\bweatherUrl\b',context):kinds.append('weather_url')
              if re.search(r'\bscore|ranking|map|sunrise|cache|temperature\b',context,re.I):kinds.append('other_related')
              if not kinds:kinds.append('unclassified')
              found.append((i+1,len(matches),','.join(kinds)))
          print('SPOT_COORD_REF_SITES='+str(len(found)))
          print('SPOT_COORD_REF_TOTAL='+str(sum(n for _,n,_ in found)))
          for line,n,kind in found:
              print('REF_LINE='+str(line)+' COUNT='+str(n)+' CONTEXT='+kind)
          var_rx=re.compile(r'\$(?:lat|lng)\b')
          derived=[]
          for i,line in enumerate(lines):
              n=len(var_rx.findall(line))
              if n:
                  kind='marine_url' if 'marineUrl' in line else ('weather_url' if 'weatherUrl' in line else 'other')
                  derived.append((i+1,n,kind))
          print('DERIVED_COORD_VAR_REF_SITES='+str(len(derived)))
          for i,n,kind in derived:
              print('DERIVED_LINE='+str(i)+' COUNT='+str(n)+' KIND='+kind)
          print('PRODUCTION_WRITES=0')
          print('ORIGINAL_SOURCE_NOT_EXPORTED=YES')
          PY

      - name: Checkout PR138 hardened patch without credentials
        uses: actions/checkout@v4
        with:
          ref: proposal/ks-takahama-split-dryrun-20261122
          persist-credentials: false
      - name: Verify exact hardened candidate and install PHP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "60958d5b0df0d18ae55f72c43ee067bc6cbe8169"
          sudo apt-get install -y -qq php-cli >/dev/null
          echo "CANDIDATE_SHA=VERIFIED"
      - name: Apply protected private preview to current production source (no API call)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/takahama-pr138-coord-audit"
          chmod 0700 "$root"
          python3 scripts/takahama_split_dryrun.py \
            --input "$root/production.php" \
            --expected-sha256 "18026fb8285570dbb85170a8b5edb55a02ecbe340a34d6693995257f3a2f7caf" \
            --output "$root/preview.php"
          php -l "$root/preview.php"
          PREVIEW_ROOT="$root" python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path(os.environ['PREVIEW_ROOT'])
          original=(root/'production.php').read_bytes()
          preview=(root/'preview.php').read_bytes()
          assert original != preview
          assert original.count(b"$weatherJson = fetchUrl($weatherUrl);")==1
          assert preview.count(b"$weatherJson = fetchUrl($weatherUrl);")==1
          assert b"$ksQuery['latitude'] = '35.49133';" in preview
          assert b"$ksQuery['longitude'] = '135.55782';" in preview
          assert b"PHP_QUERY_RFC3986" in preview
          assert len(preview)>len(original)
          print('ACTUAL_PRODUCTION_SOURCE_PATCH=PASS')
          print('ORIGINAL_SOURCE_SHA256='+hashlib.sha256(original).hexdigest())
          print('PREVIEW_SOURCE_SHA256='+hashlib.sha256(preview).hexdigest())
          print('PREVIEW_ONLY_PRIVATE_TEMP=TRUE')
          print('PRODUCTION_WRITE_COUNT=0')
          PY
