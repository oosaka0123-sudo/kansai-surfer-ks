name: Audit Hamadutu production wave generator safely

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'dry-run or deploy the locked Hamadutu PHP + HTML patch'
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - deploy

permissions:
  contents: read

concurrency:
  group: ks-hamadutu-generator-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Read production wave generator (FTPS download only)
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          TMP="$RUNNER_TEMP/ks-hamadutu-audit"
          mkdir -p "$TMP"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          get /kansai/fetch_wave_data.php -o "$TMP/fetch_wave_data.php"
          bye
          LFTP_EOF
          AUDIT_ROOT="$TMP" python3 - <<'PY'
          import os
          import re
          import hashlib
          import pathlib
          t=pathlib.Path(os.environ['AUDIT_ROOT'],'fetch_wave_data.php').read_text(encoding='utf-8',errors='replace')
          print('HAMADUTU_GENERATOR_AUDIT_READONLY')
          print('GENERATOR_BYTES='+str(len(t.encode('utf-8'))))
          print('GENERATOR_SHA256='+hashlib.sha256(t.encode('utf-8')).hexdigest())
          for key in ('hamadutu','wave_api.json','spot_','file_put_contents','json_encode','wave_height','wind_speed','marine-api.open-meteo.com','api.open-meteo.com','PHP_SAPI','cron'):
              print('REFCOUNT_'+re.sub(r'[^A-Z0-9]','_',key.upper())+'='+str(t.lower().count(key.lower())))
          spot=re.search(r"""['"]hamadutu['"]\s*=>\s*\[(.*?)\]""",t,re.S|re.I)
          print('HAMADUTU_CONFIG_FOUND='+('YES' if spot else 'NO'))
          if spot:
              s=spot.group(1)
              for field in ('lat','lng','lon','latitude','longitude'):
                  match=re.search(r"""['"]"""+field+r"""['"]\s*=>\s*(-?[0-9]+(?:\.[0-9]+)?)""",s,re.I)
                  if match: print('HAMADUTU_'+field.upper()+'='+match.group(1))
          print('EXTERNAL_SOURCE_NOT_EXPORTED')
          print('AUDIT_FINISHED_NO_SERVER_WRITE')
          PY
      - name: Validate Hamadutu-only coordinate change in memory (dry run)
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/ks-hamadutu-audit"
          curl --fail --silent --show-error --location --retry 3 "https://kansai.rss7.net/hamadutu.html" -o "$TMP/live_hamadutu.html"
          DRYRUN_ROOT="$TMP" python3 - <<'PY'
          import pathlib,os,re,hashlib,subprocess
          root=pathlib.Path(os.environ['DRYRUN_ROOT'])
          php=root/'fetch_wave_data.php'
          html=root/'live_hamadutu.html'
          def sha(b): return hashlib.sha256(b).hexdigest()
          def patch_php(original):
              s=original.decode('utf-8')
              m=re.search(r"""(['"]hamadutu['"]\s*=>\s*\[)(.*?)(\])""",s,re.I|re.S)
              if not m: raise SystemExit('FAIL: missing hamadutu PHP config')
              mid=m.group(2)
              replacement=[('lat','35.644','35.665200'),('lng','135.086','134.966082')]
              for key,old,new in replacement:
                  pat=r"""(['"]"""+key+r"""['"]\s*=>\s*)"""+re.escape(old)+r"\b"
                  mid,c=re.subn(pat,lambda x:x.group(1)+new,mid,count=1)
                  if c!=1: raise SystemExit('FAIL: PHP '+key+' match not exactly one')
              result=s[:m.start(2)]+mid+s[m.end(2):]
              if result==s:raise SystemExit('FAIL: PHP unchanged')
              inv=result.replace('35.665200','35.644',1).replace('134.966082','135.086',1)
              if inv!=s:raise SystemExit('FAIL: PHP unexpected changes')
              return result.encode('utf-8')
          def patch_html(original):
              s=original.decode('utf-8')
              m=re.search(r"const\s+SPOT_CONFIG\s*=\s*\{.*?\};",s,re.S)
              if not m:raise SystemExit('FAIL: missing inline spot config')
              segment=m.group(0)
              pat=r"\bLAT:\s*35\.644\s*,\s*LNG:\s*135\.086\b"
              fixed,n=re.subn(pat,"LAT: 35.665200, LNG: 134.966082",segment)
              if n!=1:raise SystemExit('FAIL: HTML expected config not unique')
              result=s[:m.start()]+fixed+s[m.end():]
              inv=result.replace('LAT: 35.665200, LNG: 134.966082','LAT: 35.644, LNG: 135.086',1)
              if inv!=s:raise SystemExit('FAIL: HTML unexpected changes')
              return result.encode('utf-8')
          p0=php.read_bytes()
          h0=html.read_bytes()
          if sha(p0)!='412947b2a621bd858c079a2a8a0a4f36805e89b0c05f7c34994fb3fb0b19ebfa':
              raise SystemExit('FAIL: PHP source changed since last verified Hakuto patch')
          p1=patch_php(p0)
          h1=patch_html(h0)
          out=root/'patched_hamadutu_generator.php'
          out.write_bytes(p1)
          subprocess.run(['php','-l',str(out)],check=True,stdout=subprocess.DEVNULL)
          print('HAMADUTU_DRYRUN_PASSED')
          print('PHP_OLD_SHA256='+sha(p0))
          print('PHP_PATCH_SHA256='+sha(p1))
          print('HTML_OLD_SHA256='+sha(h0))
          print('HTML_PATCH_SHA256='+sha(h1))
          print('PHP_SYNTAX=PASS')
          print('REVERSIBILITY=PASS')
          print('FILES_DEPLOYED=0')
          PY
      - name: Deploy approved Hamadutu beach coordinates with FTP backups and rollback
        if: github.ref == 'refs/heads/audit/hamadutu-generator-readonly-20261122' && github.actor == 'oosaka0123-sudo' && inputs.deploy_mode == 'deploy'
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          TMP="$RUNNER_TEMP/ks-hamadutu-deploy"
          mkdir -p "$TMP"
          MODIFIED=0
          rollback() {
            CODE=$?
            if [ "$CODE" -ne 0 ] && [ "$MODIFIED" -eq 1 ]; then
              echo "DEPLOY_VERIFY_FAILED_ATTEMPTING_TWO_FILE_ROLLBACK"
              lftp <<LFTP_ROLLBACK || true
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          put "$TMP/original.php" -o /kansai/fetch_wave_data.php
          put "$TMP/original.html" -o /kansai/hamadutu.html
          bye
          LFTP_ROLLBACK
              echo "ROLLBACK_ATTEMPT_FINISHED"
            fi
            exit "$CODE"
          }
          trap rollback EXIT
          lftp <<LFTP_GET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          get /kansai/fetch_wave_data.php -o "$TMP/original.php"
          get /kansai/hamadutu.html -o "$TMP/original.html"
          get /kansai/index.html -o "$TMP/home-original.html"
          bye
          LFTP_GET
          curl -fsSL --retry 3 "https://kansai.rss7.net/hamadutu.html?before=$GITHUB_RUN_ID" -o "$TMP/http-original.html"
          curl -fsSL --retry 3 "https://kansai.rss7.net/index.html?before=$GITHUB_RUN_ID" -o "$TMP/http-home-original.html"
          cmp "$TMP/original.html" "$TMP/http-original.html"
          cmp "$TMP/home-original.html" "$TMP/http-home-original.html"
          STAGE="$TMP" python3 - <<'PY'
          import os,pathlib,re,hashlib
          root=pathlib.Path(os.environ["STAGE"])
          php=(root/"original.php").read_bytes()
          html=(root/"original.html").read_bytes()
          def h(b):return hashlib.sha256(b).hexdigest()
          assert h(php)=="412947b2a621bd858c079a2a8a0a4f36805e89b0c05f7c34994fb3fb0b19ebfa", "PHP changed from locked baseline"
          assert h(html)=="6acc9fbe14c931c83e889a7721abd3b81f6fe67dd0750b2ba5eb96d4f6595207", "HTML changed from locked baseline"
          ps=php.decode("utf-8")
          m=re.search(r"""(['"]hamadutu['"]\s*=>\s*\[)(.*?)(\])""",ps,re.S|re.I)
          assert m, "missing Hamadutu block"
          segment=m.group(2)
          for key,old,new in [('lat','35.644','35.665200'),('lng','135.086','134.966082')]:
              pat=r"""(['"]"""+key+r"""['"]\s*=>\s*)"""+re.escape(old)+r"\b"
              segment,n=re.subn(pat,lambda match:match.group(1)+new,segment,count=1)
              assert n==1, "PHP coordinate not unique: "+key
          phpn=(ps[:m.start(2)]+segment+ps[m.end(2):]).encode("utf-8")
          assert phpn.replace(b"35.665200",b"35.644",1).replace(b"134.966082",b"135.086",1)==php
          hs=html.decode("utf-8")
          m=re.search(r"const\s+SPOT_CONFIG\s*=\s*\{.*?\};",hs,re.S)
          assert m, "missing HTML spot config"
          part,n=re.subn(r"\bLAT:\s*35\.644\s*,\s*LNG:\s*135\.086\b","LAT: 35.665200, LNG: 134.966082",m.group(0))
          assert n==1, "HTML coordinate not unique"
          htmln=(hs[:m.start()]+part+hs[m.end():]).encode("utf-8")
          assert htmln.replace(b"LAT: 35.665200, LNG: 134.966082",b"LAT: 35.644, LNG: 135.086",1)==html
          assert h(phpn)=="a88f119579f9ca5ed038cb0173c7d57e0acb351b6df7c763d3a2c97ccadbbd10", "PHP patch mismatch with approved dry run"
          assert h(htmln)=="3f38cf194595af5542df66d6555c024ed3451d757f65d995dd9d5b3c724df5a7", "HTML patch mismatch with approved dry run"
          (root/"patched.php").write_bytes(phpn)
          (root/"patched.html").write_bytes(htmln)
          print("LOCKED_TWO_FILE_HAMADUTU_PATCH_VALIDATED")
          PY
          php -l "$TMP/patched.php"
          curl -fsSL --retry 3 "https://kansai.rss7.net/hamadutu.html?preflight=$GITHUB_RUN_ID" -o "$TMP/preflight.html"
          cmp "$TMP/preflight.html" "$TMP/original.html"
          MODIFIED=1
          lftp <<LFTP_PUT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          put "$TMP/patched.php" -o /kansai/fetch_wave_data.php
          put "$TMP/patched.html" -o /kansai/hamadutu.html
          bye
          LFTP_PUT
          lftp <<LFTP_VERIFY
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          get /kansai/fetch_wave_data.php -o "$TMP/verify.php"
          get /kansai/hamadutu.html -o "$TMP/verify.html"
          get /kansai/index.html -o "$TMP/home-verify.html"
          bye
          LFTP_VERIFY
          cmp "$TMP/verify.php" "$TMP/patched.php"
          cmp "$TMP/verify.html" "$TMP/patched.html"
          cmp "$TMP/home-verify.html" "$TMP/home-original.html"
          php -l "$TMP/verify.php"
          curl -fsSL --retry 5 --retry-delay 2 "https://kansai.rss7.net/hamadutu.html?after=$GITHUB_RUN_ID" -o "$TMP/http-after.html"
          cmp "$TMP/http-after.html" "$TMP/patched.html"
          curl -fsSL --retry 5 --retry-delay 2 "https://kansai.rss7.net/index.html?after=$GITHUB_RUN_ID" -o "$TMP/http-home-after.html"
          cmp "$TMP/http-home-after.html" "$TMP/home-original.html"
          MODIFIED=0
          echo "HAMADUTU_PHP_AND_HTML_BEACH_COORDINATES_DEPLOY_SUCCESS"
          echo "NEXT_SCHEDULED_GENERATOR_UPDATE_MUST_BE_CHECKED"
