name: Audit production morning generator safely

on:
  workflow_dispatch:
    inputs:
      spot:
        description: "Only one homepage SPOTS coordinate to update"
        required: true
        type: choice
        options:
          - irago
          - hamadutu
          - hakuto

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  one-homepage-coordinate:
    if: github.ref == 'refs/heads/deploy/ks-home-coords-only-20261122' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SPOT: ${{ inputs.spot }}
      FTP_HOST: ftp.lolipop.jp
      PROD_FILE: /kansai/index.html
      FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Preflight homepage identity and exact one-coordinate patch
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          test "$FTP_HOST" = ftp.lolipop.jp
          test "$PROD_FILE" = /kansai/index.html
          case "$SPOT" in irago|hamadutu|hakuto) ;; *) exit 1 ;; esac
          D="$RUNNER_TEMP/ks-home-coordinate"
          mkdir -m 700 "$D"
          git show a1c910f2cf063d807e71d10195035c7d8f2401e1:index.html > "$D/baseline.html"
          test -s "$D/baseline.html"
          lftp <<LFTP_GET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$PROD_FILE" -o "$D/old.html"
          bye
          LFTP_GET
          curl --fail --silent --show-error --location --retry 3 "https://kansai.rss7.net/index.html?ks_verify_pre=$GITHUB_RUN_ID" -o "$D/http-old.html"
          cmp "$D/old.html" "$D/http-old.html"
          python3 scripts/ks_home_coord_patch.py "$D/baseline.html" "$D/old.html" "$D/new.html" "$SPOT"
          test -s "$D/new.html"
          echo "PRECHECK_PASSED_SINGLE_COORDINATE_ONLY"

      - name: Save pre-deployment public HTML for rollback
        uses: actions/upload-artifact@v4
        with:
          name: ks-home-before-${{ inputs.spot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ks-home-coordinate/old.html
          retention-days: 30
          if-no-files-found: error

      - name: Deploy only index.html, verify and auto-rollback if needed
        shell: bash
        run: |
          set -euo pipefail
          set +x
          D="$RUNNER_TEMP/ks-home-coordinate"
          CHANGED=0
          rollback() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ] && [ "$CHANGED" -eq 1 ]; then
              echo "DEPLOY_FAIL_ATTEMPT_RESTORE"
              lftp <<LFTP_ROLLBACK || true
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "$D/old.html" -o "$PROD_FILE"
          bye
          LFTP_ROLLBACK
              echo "ROLLBACK_ATTEMPTED_CHECK_SITE"
            fi
            exit "$code"
          }
          trap rollback EXIT
          lftp <<LFTP_REGET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$PROD_FILE" -o "$D/recheck.html"
          bye
          LFTP_REGET
          cmp "$D/old.html" "$D/recheck.html"
          CHANGED=1
          lftp <<LFTP_PUT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "$D/new.html" -o "$PROD_FILE"
          bye
          LFTP_PUT
          lftp <<LFTP_VERIFY
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$PROD_FILE" -o "$D/verify.html"
          bye
          LFTP_VERIFY
          cmp "$D/new.html" "$D/verify.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "https://kansai.rss7.net/index.html?ks_verify_post=$GITHUB_RUN_ID" -o "$D/http-new.html"
          cmp "$D/new.html" "$D/http-new.html"
          CHANGED=0
          trap - EXIT
          echo "DEPLOY_OK_SPOT=$SPOT SINGLE_HTML_ONLY"

