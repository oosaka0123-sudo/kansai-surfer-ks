name: Audit production morning generator safely

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  one-page-kounohama-windy:
    if: github.ref == 'refs/heads/deploy/kounohama-windy-marker-20261126' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
      PROD_FILE: /kansai/kounohama.html
      OLD_SHA: 2ba792ce6b1311be3f428424053fefeec5f16ad1bced2269ca3fc92310fc1f0c
      NEW_SHA: a2e4813edd7fdcd5a76c0ad136954934200538e9850276182a06c6ce8f2feb5c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Verify production and ONLY the specified Windy coordinate changes
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          test "$FTP_HOST" = ftp.lolipop.jp
          test "$PROD_FILE" = /kansai/kounohama.html
          D="$RUNNER_TEMP/ks-kounohama-windy-only"
          mkdir -m 700 "$D"
          git show f417584:kounohama.html > "$D/baseline.html"
          lftp <<LFTP_GET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$PROD_FILE" -o "$D/old.html"
          bye
          LFTP_GET
          curl --fail --silent --show-error --location --retry 3 "https://kansai.rss7.net/kounohama.html?pre_windy=$GITHUB_RUN_ID" -o "$D/http-old.html"
          cmp "$D/baseline.html" "$D/old.html"
          cmp "$D/old.html" "$D/http-old.html"
          D="$D" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          d=Path(os.environ["D"])
          original=(d/"old.html").read_bytes()
          patched=Path("kounohama.html").read_bytes()
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert sha(original)==os.environ["OLD_SHA"],"LIVE_HTML_DRIFT_REFUSE"
          assert sha(patched)==os.environ["NEW_SHA"],"PATCH_SHA_MISMATCH_REFUSE"
          marker=b'<section class="section ks-windy-section" id="kounohama-windy"'
          assert original.count(marker)==1
          begin=original.index(marker)
          end=original.index(b"</section>",begin)+len(b"</section>")
          section=original[begin:end]
          assert section.count(b"34.34")==9 and section.count(b"136.92")==9
          changed=section.replace(b"34.34",b"34.33771").replace(b"136.92",b"136.87966")
          old_link=b'href="https://www.windy.com/?wind,34.33,136.92,11"'
          new_link=b'href="https://www.windy.com/?wind,34.33771,136.87966,11"'
          assert original.count(old_link)==1
          expected=(original[:begin]+changed+original[end:]).replace(old_link,new_link,1)
          assert patched==expected,"UNRELATED_PRODUCTION_HTML_MODIFIED"
          assert patched.count(b'LAT: 34.34, LNG: 136.92')==original.count(b'LAT: 34.34, LNG: 136.92')
          assert b'overlay=waves&product=ecmwfWaves' in patched
          assert b'overlay=wind&product=ecmwf' in patched
          print("WINDY_ONLY_BYTE_EXACT_PATCH_PRECHECK_PASS")
          PY

      - name: Backup existing kounohama HTML for recovery
        uses: actions/upload-artifact@v4
        with:
          name: kounohama-windy-before-${{ github.run_id }}
          path: ${{ runner.temp }}/ks-kounohama-windy-only/old.html
          retention-days: 30
          if-no-files-found: error

      - name: Upload ONLY kounohama.html and verify with rollback
        shell: bash
        run: |
          set -euo pipefail
          set +x
          D="$RUNNER_TEMP/ks-kounohama-windy-only"
          CHANGED=0
          rollback() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ] && [ "$CHANGED" -eq 1 ]; then
              echo "ERROR_RESTORE_OLD_KOUNOHAMA_PAGE"
              lftp <<LFTP_RESTORE || true
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "$D/old.html" -o "$PROD_FILE"
          bye
          LFTP_RESTORE
              echo "ROLLBACK_ATTEMPTED_CHECK_LIVE_PAGE"
            fi
            exit "$code"
          }
          trap rollback EXIT
          lftp <<LFTP_RECHECK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$PROD_FILE" -o "$D/recheck.html"
          bye
          LFTP_RECHECK
          cmp "$D/old.html" "$D/recheck.html"
          CHANGED=1
          lftp <<LFTP_UPLOAD
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "kounohama.html" -o "$PROD_FILE"
          get "$PROD_FILE" -o "$D/ftps-after.html"
          bye
          LFTP_UPLOAD
          cmp "kounohama.html" "$D/ftps-after.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "https://kansai.rss7.net/kounohama.html?post_windy=$GITHUB_RUN_ID" -o "$D/http-after.html"
          cmp "kounohama.html" "$D/http-after.html"
          test "$(sha256sum "$D/http-after.html" | cut -d ' ' -f1)" = "$NEW_SHA"
          CHANGED=0
          trap - EXIT
          echo "KOUNOHAMA_WINDY_MARKER_ONE_HTML_DEPLOY_VERIFIED"
