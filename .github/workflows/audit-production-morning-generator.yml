name: Audit production morning generator safely

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ks-morning-generator-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Download production generator candidates read-only
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          TMP="$RUNNER_TEMP/ks-morning-generator-audit"
          mkdir -p "$TMP"

          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          get /kansai/admin/ai_draft.php -o "$TMP/ai_draft.php"
          get /kansai/admin/auto_wave_post.php -o "$TMP/auto_wave_post.php"
          get /kansai/admin/auto_wave_today.php -o "$TMP/auto_wave_today.php"
          bye
          LFTP_EOF

          AUDIT_ROOT="$TMP" python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          from urllib.parse import urlparse

          root = pathlib.Path(os.environ["AUDIT_ROOT"])
          terms = [
              "朝", "今日", "明日", "ランキング", "記事", "ブログ", "波情報",
              "articles.json", "file_put_contents", "json_encode", "json_decode",
              "anthropic", "gemini", "claude", "prompt", "system"
          ]
          safe_calls = [
              "file_put_contents", "file_get_contents", "json_encode", "json_decode",
              "curl_init", "curl_exec", "fopen", "fwrite", "rename", "copy"
          ]

          print("MORNING_GENERATOR_SAFE_AUDIT_V1")
          for path in sorted(root.glob("*.php")):
              raw = path.read_bytes()
              text = raw.decode("utf-8", errors="ignore")
              print(f"FILE={path.name}")
              print(f"BYTES={len(raw)}")
              print(f"LINES={text.count(chr(10)) + 1}")
              print(f"SHA256={hashlib.sha256(raw).hexdigest()}")

              funcs = sorted(set(re.findall(r"(?i)\bfunction\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", text)))
              print("FUNCTIONS=" + (",".join(funcs) if funcs else "(none)"))

              calls = [name for name in safe_calls if re.search(r"\b" + re.escape(name) + r"\s*\(", text)]
              print("SAFE_CALLS=" + (",".join(calls) if calls else "(none)"))

              php_refs = sorted(set(pathlib.PurePosixPath(x).name for x in re.findall(r"""['"]([^'"]+\.php)['"]""", text)))
              print("PHP_REFS=" + (",".join(php_refs) if php_refs else "(none)"))

              json_refs = sorted(set(pathlib.PurePosixPath(x).name for x in re.findall(r"""['"]([^'"]+\.json)['"]""", text)))
              print("JSON_REFS=" + (",".join(json_refs) if json_refs else "(none)"))

              array_keys = sorted(set(re.findall(r"""\[['"]([A-Za-z0-9_\-]{1,64})['"]\]""", text)))
              print("ARRAY_KEYS=" + (",".join(array_keys[:200]) if array_keys else "(none)"))

              for fname in ("generate_article", "fetch_osaka_weather", "fetch_marine_data", "save_article", "rate_spot"):
                  sig = re.search(r"(?is)function\s+" + re.escape(fname) + r"\s*\((.*?)\)\s*\{", text)
                  if sig:
                      params = re.sub(r"\s+", " ", sig.group(1)).strip()
                      params = re.sub(r"=[^,)]*", "=<default>", params)
                      print(f"SIGNATURE[{fname}]={params[:500]}")

              hosts = set()
              for url in re.findall(r"https?://[^\s'\"<>]+", text, flags=re.I):
                  try:
                      host = urlparse(url).hostname
                  except Exception:
                      host = None
                  if host:
                      hosts.add(host.lower())
              print("HOSTS=" + (",".join(sorted(hosts)) if hosts else "(none)"))

              models = sorted(set(re.findall(r"claude-[a-z0-9][a-z0-9._-]*", text, flags=re.I)))
              print("CLAUDE_MODELS=" + (",".join(models) if models else "(none)"))

              prompt_vars = sorted(set(re.findall(
                  r"(?im)^\s*\$([A-Za-z_][A-Za-z0-9_]*(?:prompt|instruction|system)[A-Za-z0-9_]*)\s*=",
                  text
              )))
              print("PROMPT_LIKE_VARS=" + (",".join(prompt_vars) if prompt_vars else "(none)"))

              writes = []
              for match in re.finditer(r"file_put_contents\s*\(\s*(['\"])([^'\"]+)\1", text):
                  target = pathlib.PurePosixPath(match.group(2)).name
                  if target:
                      writes.append(target)
              print("LITERAL_WRITE_BASENAMES=" + (",".join(sorted(set(writes))) if writes else "(none)"))

              cli_guard = bool(re.search(r"PHP_SAPI|php_sapi_name|STDIN|argv", text, flags=re.I))
              print("CLI_GUARD_HINT=" + ("yes" if cli_guard else "no"))

              for term in terms:
                  count = text.lower().count(term.lower())
                  if count:
                      print(f"TERM_COUNT[{term}]={count}")

              shape_lines = []
              for no, line in enumerate(text.splitlines(), start=1):
                  if re.search(r"(?i)prompt|instruction|system", line) and "$" in line:
                      scrubbed = re.sub(r"""(['"])(?:(?=(\\?))\2.)*?\1""", '"<redacted-string>"', line)
                      scrubbed = re.sub(r"[A-Za-z0-9_\-]{24,}", "<redacted-token>", scrubbed)
                      shape_lines.append(f"{no}:{scrubbed.strip()[:240]}")
              print("PROMPT_SHAPE_LINES=" + (" || ".join(shape_lines[:20]) if shape_lines else "(none)"))

              call_shapes = []
              for fname in ("generate_article", "fetch_osaka_weather", "fetch_marine_data", "save_article", "rate_spot"):
                  for no, line in enumerate(text.splitlines(), start=1):
                      if re.search(r"\b" + re.escape(fname) + r"\s*\(", line) and not re.search(r"\bfunction\s+" + re.escape(fname), line):
                          scrubbed = re.sub(r"""(['"])(?:(?=(\\?))\2.)*?\1""", '"<redacted-string>"', line)
                          scrubbed = re.sub(r"[A-Za-z0-9_\-]{24,}", "<redacted-token>", scrubbed)
                          call_shapes.append(f"{no}:{scrubbed.strip()[:320]}")
              print("CALL_SHAPES=" + (" || ".join(call_shapes[:30]) if call_shapes else "(none)"))
              print("END_FILE")

          print("AUDIT_COMPLETE_NO_SOURCE_EXPORTED")
          PY

      - name: Locate production wave-data generator paths read-only
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          OUT="$RUNNER_TEMP/ks-hakuto-generator-list.txt"
          lftp > "$OUT" <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          cls -1 /kansai
          cls -1 /kansai/admin
          bye
          LFTP_EOF
          echo "KNOWN_GENERATOR_FILE_CANDIDATES_ONLY"
          grep -Ei '(wave|spot|cron|api|fetch|update|forecast|weather|marine|config)' "$OUT" | sort -u | head -80 || true
          echo "READ_ONLY_FTPS_SCAN_COMPLETE"

      - name: Inspect public forecast PHP sources without exposing private configuration
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          TMP="$RUNNER_TEMP/hakuto-src-inspect"
          mkdir -p "$TMP"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          get /kansai/fetch_wave_data.php -o "$TMP/fetch_wave_data.php"
          get /kansai/api.php -o "$TMP/api.php"
          get /kansai/wave_proxy.php -o "$TMP/wave_proxy.php"
          get /kansai/admin/auto_wave_today.php -o "$TMP/auto_wave_today.php"
          get /kansai/admin/auto_wave_post.php -o "$TMP/auto_wave_post.php"
          bye
          LFTP_EOF
          SRC_DIR="$TMP" python3 - <<'PY'
          import os, pathlib, re, hashlib
          root=pathlib.Path(os.environ['SRC_DIR'])
          safe=re.compile(r'(?i)hakuto|35\\.512|134\\.168|spot_hakuto|wave_api\\.json|spot_.*?\\.json')
          block=re.compile(r'(?i)password|secret|apikey|api_key|token|authorization|private')
          for p in sorted(root.glob('*.php')):
              s=p.read_text(encoding='utf-8',errors='replace')
              print('PHPFILE',p.name,'sha256',hashlib.sha256(p.read_bytes()).hexdigest(),'lines',len(s.splitlines()))
              for keyword in ('hakuto','35.512','134.168','wave_api.json','spot_hakuto.json'):
                  print('COUNT',p.name,keyword,s.lower().count(keyword.lower()))
              for i,line in enumerate(s.splitlines(),start=1):
                  if safe.search(line) and not block.search(line):
                      print('MATCH',p.name,i,re.sub(r'[\\x00-\\x1f]',' ',line.strip())[:220])
          print('SOURCE_INSPECTION_READ_ONLY_NO_ARTIFACT_NO_CREDENTIALS')
          PY

      - name: Analyze generator branching and selective regeneration feasibility
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/hakuto-src-inspect/fetch_wave_data.php"
          test -s "$SRC"
          SRC="$SRC" python3 - <<'PY'
          import os,re,pathlib,json
          s=pathlib.Path(os.environ["SRC"]).read_text("utf-8",errors="replace")
          lines=s.splitlines()
          print("FORECAST_GENERATOR_CONTROL_FLOW")
          keywords=re.compile(r'(?i)foreach\s*\(|for\s*\(|while\s*\(|file_put_contents\(|rename\(|spot_\w+\.json|wave_api\.json|\$_GET|\$_SERVER|PHP_SAPI|argv|function\s+|if\s*\(.*(isset|is_file|file_exists|mkdir)|\$spots\s*=|\$spots\s*\[|\$spotKey|\$spot_key|\$dataDir|\$outputDir|\$baseDir|\$targetPath|\$tmpPath|\$waveApi|\$allSpots')
          def redact(line):
              line=re.sub(r'(?i)(pass(word)?|api.?key|secret|auth(orization)?|token)',"[SENSITIVE_KEYWORD]",line)
              line=re.sub(r"(?:(?<=')[^']{36,}(?=')|(?<=\")[^\"]{36,}(?=\") )", "[LONG_STRING]",line)
              line=re.sub(r'[A-Za-z0-9_+=\-/]{45,}',"<redacted>",line)
              return line
          for i,line in enumerate(lines,1):
              if keywords.search(line):
                  print("FLOW",i,json.dumps(redact(line.strip()),ensure_ascii=True)[:400])
          print("SCRIPT_STRUCTURE_END")
          PY

      - name: Deploy Hakuto 10-day UI ONLY, with reversible scope and FTP rollback
        if: github.ref == 'refs/heads/audit/hakuto-10day-ui-once-20261122' && github.actor == 'oosaka0123-sudo'
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          DIR="$RUNNER_TEMP/ks-hakuto-10day-ui-20261122"
          mkdir -p "$DIR"
          MODIFIED=0
          rollback_on_error(){
            STATUS=$?
            if [ "$STATUS" -ne 0 ] && [ "$MODIFIED" -eq 1 ]; then
              echo "HAKUTO_HTML_VERIFY_FAILED_ROLLBACK_ATTEMPT"
              lftp <<LFTP_ROLLBACK || true
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          put "$DIR/original.html" -o /kansai/hakuto.html
          bye
          LFTP_ROLLBACK
              echo "ROLLBACK_ATTEMPT_FINISHED"
            fi
            exit "$STATUS"
          }
          trap rollback_on_error EXIT
          lftp <<LFTP_GET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          get /kansai/hakuto.html -o "$DIR/original.html"
          bye
          LFTP_GET
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 "https://kansai.rss7.net/hakuto.html?before=$GITHUB_RUN_ID" -o "$DIR/http-original.html"
          cmp "$DIR/http-original.html" "$DIR/original.html"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 "https://kansai.rss7.net/index.html?before=$GITHUB_RUN_ID" -o "$DIR/home-original.html"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 "https://raw.githubusercontent.com/oosaka0123-sudo/kansai-surfer-ks/31d477a42209c469fcbab4a9645709491244d191/hakuto.html" -o "$DIR/approved.html"
          OLD="$DIR/original.html" NEW="$DIR/approved.html" python3 - <<'PY'
          import os,re,hashlib,pathlib
          old=pathlib.Path(os.environ['OLD']).read_bytes()
          new=pathlib.Path(os.environ['NEW']).read_bytes()
          blob=lambda s:hashlib.sha1(b'blob '+str(len(s)).encode()+b'\0'+s).hexdigest()
          print('PRODUCTION_HTML_GIT_BLOB_BEFORE',blob(old))
          print('APPROVED_HTML_GIT_BLOB_NEW',blob(new))
          assert blob(old)=='26af3ebbbf4ad9f79a70e264b0f115b38744330e', 'production baseline moved'
          assert blob(new)=='d7a3d1f543ae2b9769cb34e74c72d1baa08be3fc','reviewed source drifted'
          old=old.decode('utf-8')
          new=new.decode('utf-8')
          orig=re.search(r'<section class="section">\s*<h2 class="section-title"><span class="no">05</span>[\s\S]*?</section>',old)
          replacement=re.search(r'<section class="section ks10-section" id="ks10-forecast"[\s\S]*?</section>',new)
          assert orig and replacement,'05 section boundaries not identified'
          assert new==old[:orig.start()]+replacement.group(0)+old[orig.end():],'changes beyond 05 section'
          assert '35.527370' in new and '134.116740' in new,'official Hakuto coordinate absent'
          assert 'forecast_days=10' in replacement.group(0),'10day data missing'
          assert "DOMContentLoaded',load" in replacement.group(0),'safe initialization missing'
          assert new.count('id="ks10-forecast"')==1
          assert 'id="weeklyBody"' not in new
          assert new.count('class="floating-line"')==old.count('class="floating-line"'),'LINE changed'
          print('HAKUTO_05_SECTION_ONLY_VERIFIED')
          PY
          MODIFIED=1
          lftp <<LFTP_PUT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          put "$DIR/approved.html" -o /kansai/hakuto.html
          bye
          LFTP_PUT
          lftp <<LFTP_VERIFY
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          get /kansai/hakuto.html -o "$DIR/verified.html"
          bye
          LFTP_VERIFY
          cmp "$DIR/verified.html" "$DIR/approved.html"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 "https://kansai.rss7.net/hakuto.html?after=$GITHUB_RUN_ID" -o "$DIR/http-after.html"
          cmp "$DIR/http-after.html" "$DIR/approved.html"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 "https://kansai.rss7.net/index.html?after=$GITHUB_RUN_ID" -o "$DIR/home-after.html"
          cmp "$DIR/home-after.html" "$DIR/home-original.html"
          MODIFIED=0
          echo "HAKUTO_10DAY_UI_ONLY_SUCCESS_PRODUCTION"
