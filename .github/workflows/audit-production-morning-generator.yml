name: Audit production morning generator safely

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  deploy-isonoura-hourly-1h-only:
    if: github.ref == 'refs/heads/deploy/isonoura-hourly-1h-only-20261123' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
      PROD_FILE: /kansai/isonoura.html
      OLD_SHA256: 09b87feb2126201f21e0ed8c5b3f9478f27075cec21c1485e8abd9939bd07658
      NEW_SHA256: 3b17315ce6631bc07cf697f3fe3b5e3249cd55a066636dafc440d5e71b1c06ab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install secure FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Verify exact snapshot and patch before publishing
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          test "$FTP_HOST" = "ftp.lolipop.jp" && test "$PROD_FILE" = "/kansai/isonoura.html"
          D="$RUNNER_TEMP/ks-isonoura-hourly-1h"
          mkdir -m 700 "$D"
          git show b241e1e43a80386fda959ad0730b79ac3db497a9:isonoura.html > "$D/baseline.html"
          lftp <<LFTP_GET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$PROD_FILE" -o "$D/old.html"
          bye
          LFTP_GET
          curl --fail --silent --show-error --location --retry 3 "https://kansai.rss7.net/isonoura.html?predeploy=$GITHUB_RUN_ID" -o "$D/http-old.html"
          cmp "$D/baseline.html" "$D/old.html"
          cmp "$D/old.html" "$D/http-old.html"
          D="$D" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          d=Path(os.environ['D'])
          hashfile=lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          expected_old=os.environ['OLD_SHA256']
          expected_new=os.environ['NEW_SHA256']
          assert hashfile(d/'old.html')==expected_old,'LIVE_DRIFT_STOP_NO_DEPLOY'
          assert hashfile(Path('isonoura.html'))==expected_new,'UNEXPECTED_PATCH_STOP'
          old=(d/'old.html').read_bytes()
          new=Path('isonoura.html').read_bytes()
          assert old.count(b'id="hourlySvg"')==1
          assert new.count(b'id="hourlySvg"')==0
          assert new.count(b'id="ks-h1"')==1
          assert old.count(b'id="ks10-forecast"')==new.count(b'id="ks10-forecast"')==1
          assert old.count(b'LAT: 34.18, LNG: 135.05,')==new.count(b'LAT: 34.18, LNG: 135.05,')==1
          assert old.count(b'WAVE_FACTOR: 0.7,')==new.count(b'WAVE_FACTOR: 0.7,')==1
          print('ONLY_APPROVED_ISONOURA_HTML_PRECHECK_OK')
          PY

      - name: Back up original production Isonoura page
        uses: actions/upload-artifact@v4
        with:
          name: ks-isonoura-hourly-before-${{ github.run_id }}
          path: ${{ runner.temp }}/ks-isonoura-hourly-1h/old.html
          retention-days: 30
          if-no-files-found: error

      - name: Deploy one HTML and verify, rollback on error
        shell: bash
        run: |
          set -euo pipefail
          set +x
          D="$RUNNER_TEMP/ks-isonoura-hourly-1h"
          MODIFIED=0
          rollback() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ] && [ "$MODIFIED" -eq 1 ]; then
              echo "DEPLOY_FAILURE_ATTEMPT_ROLLBACK"
              lftp <<LFTP_ROLLBACK || true
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "$D/old.html" -o "$PROD_FILE"
          bye
          LFTP_ROLLBACK
              echo "ROLLBACK_ATTEMPTED_VERIFY_SITE"
            fi
            exit "$code"
          }
          trap rollback EXIT
          lftp <<LFTP_REGET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$PROD_FILE" -o "$D/preput.html"
          bye
          LFTP_REGET
          cmp "$D/old.html" "$D/preput.html"
          MODIFIED=1
          lftp <<LFTP_PUT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "isonoura.html" -o "$PROD_FILE"
          bye
          LFTP_PUT
          lftp <<LFTP_VERIFY
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$PROD_FILE" -o "$D/verify.html"
          bye
          LFTP_VERIFY
          cmp "isonoura.html" "$D/verify.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "https://kansai.rss7.net/isonoura.html?postdeploy=$GITHUB_RUN_ID" -o "$D/http-new.html"
          cmp "isonoura.html" "$D/http-new.html"
          test "$(sha256sum "$D/http-new.html" | cut -d ' ' -f1)" = "$NEW_SHA256"
          MODIFIED=0
          trap - EXIT
          echo "ISONOURA_HOURLY_1H_SINGLE_FILE_PRODUCTION_DEPLOY_VERIFIED"
