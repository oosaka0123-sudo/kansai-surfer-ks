name: Audit production morning generator safely

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  takahama-beach-metadata-only:
    if: github.ref == 'refs/heads/deploy/ks-takahama-beach-location-20261122' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
      ROOT: /kansai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Verify two live files and prepare exact one-line updates
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          test "$FTP_HOST" = ftp.lolipop.jp
          test "$ROOT" = /kansai
          D="$RUNNER_TEMP/ks-takahama-beach-only"
          mkdir -m 700 "$D"
          lftp <<LFTP_GET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$ROOT/index.html" -o "$D/old-home.html"
          get "$ROOT/takahama.html" -o "$D/old-spot.html"
          bye
          LFTP_GET
          curl --fail --silent --show-error --location --retry 3 "https://kansai.rss7.net/index.html?ks_taka_pre=$GITHUB_RUN_ID" -o "$D/http-old-home.html"
          curl --fail --silent --show-error --location --retry 3 "https://kansai.rss7.net/takahama.html?ks_taka_pre=$GITHUB_RUN_ID" -o "$D/http-old-spot.html"
          cmp "$D/old-home.html" "$D/http-old-home.html"
          cmp "$D/old-spot.html" "$D/http-old-spot.html"
          D="$D" python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          d=Path(os.environ['D'])
          expected=[
              ('index.html','old-home.html',
               '8c0f3bb448b7154506f0fe0b6175180d6941fe96abc7b6b26b56e3a29a1b8bba',
               b'    lat: 35.487, lng: 135.513,',b'    lat: 35.49133, lng: 135.55782,'),
              ('takahama.html','old-spot.html',
               'cc9dadaaf2169d70b492d4e7d3c27c182c587b84b49b0aaf68abc4bc9bcc9b9f',
               b'  LAT: 35.708, LNG: 135.208,',b'  LAT: 35.49133, LNG: 135.55782,'),
          ]
          for name,oldfile,oldsha,old,new in expected:
              original=(d/oldfile).read_bytes()
              patched=Path(name).read_bytes()
              gotsha=hashlib.sha256(original).hexdigest()
              assert gotsha==oldsha,(name,'production drifted; refusing to write',gotsha)
              assert original.count(old)==1,(name,'old coordinates not unique')
              assert original.count(new)==0,(name,'new coordinates already present')
              assert patched==original.replace(old,new,1),(name,'other bytes changed')
              if name=='takahama.html':
                  for guard in (b"latitude=35.65&longitude=135.45",b"latitude=35.49133&longitude=135.55782",b"WAVE_FACTOR: 0.65,"):
                      assert guard in original and guard in patched,(name,'wave/wind/score guard missing')
              print('PASS_SINGLE_LINE',name,'old_sha',gotsha,'new_sha',hashlib.sha256(patched).hexdigest())
          print('TWO_PAGE_PATCH_PRECHECK_PASSED')
          PY

      - name: Archive prior versions for rollback
        uses: actions/upload-artifact@v4
        with:
          name: ks-takahama-two-html-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ks-takahama-beach-only/old-home.html
            ${{ runner.temp }}/ks-takahama-beach-only/old-spot.html
          retention-days: 30
          if-no-files-found: error

      - name: Upload ONLY these two HTML files and verify; restore on failure
        shell: bash
        run: |
          set -euo pipefail
          set +x
          D="$RUNNER_TEMP/ks-takahama-beach-only"
          MODIFIED=0
          rollback(){
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$MODIFIED" -eq 1 ]; then
              echo "ERROR_DEPLOY_ROLLBACK_ATTEMPT"
              lftp <<LFTP_ROLLBACK || true
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "$D/old-home.html" -o "$ROOT/index.html"
          put "$D/old-spot.html" -o "$ROOT/takahama.html"
          bye
          LFTP_ROLLBACK
              echo "ROLLBACK_ATTEMPTED_VERIFY_SITE"
            fi
            exit "$status"
          }
          trap rollback EXIT
          lftp <<LFTP_CHECK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$ROOT/index.html" -o "$D/check-home.html"
          get "$ROOT/takahama.html" -o "$D/check-spot.html"
          bye
          LFTP_CHECK
          cmp "$D/old-home.html" "$D/check-home.html"
          cmp "$D/old-spot.html" "$D/check-spot.html"
          MODIFIED=1
          lftp <<LFTP_PUT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          put "index.html" -o "$ROOT/index.html"
          put "takahama.html" -o "$ROOT/takahama.html"
          bye
          LFTP_PUT
          lftp <<LFTP_REGET
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$ROOT/index.html" -o "$D/verify-home.html"
          get "$ROOT/takahama.html" -o "$D/verify-spot.html"
          bye
          LFTP_REGET
          cmp index.html "$D/verify-home.html"
          cmp takahama.html "$D/verify-spot.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "https://kansai.rss7.net/index.html?ks_taka_post=$GITHUB_RUN_ID" -o "$D/http-new-home.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "https://kansai.rss7.net/takahama.html?ks_taka_post=$GITHUB_RUN_ID" -o "$D/http-new-spot.html"
          cmp index.html "$D/http-new-home.html"
          cmp takahama.html "$D/http-new-spot.html"
          MODIFIED=0
          trap - EXIT
          echo "TAKAHAMA_TWO_LOCATION_METADATA_LINES_DEPLOY_OK"
