name: Test LINE group welcome bot on nami

on:
  push:
    branches:
      - chore/line-group-welcome-bot
    paths:
      - 'line-bot/**'
      - '.github/workflows/test-line-bot-nami.yml'

permissions:
  contents: read

concurrency:
  group: ks-line-bot-nami
  cancel-in-progress: false

jobs:
  lint-and-stage:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ftp.lolipop.jp
      FTP_SERVER_DIR: /nami/ks-line-bot
      WEBHOOK_URL: https://nami.rss7.net/ks-line-bot/webhook.php

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Lint webhook
        run: php -l line-bot/webhook.php

      - name: Check staging credentials
        id: secrets
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
          LINE_CHANNEL_SECRET: ${{ secrets.KS_LINE_BOT_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.KS_LINE_BOT_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          if [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$LINE_CHANNEL_SECRET" ] && [ -n "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All staging credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LINE bot staging credentials are not complete; upload is intentionally skipped."
          fi

      - name: Prepare isolated staging bundle
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.KS_LINE_BOT_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.KS_LINE_BOT_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          STAGE="$RUNNER_TEMP/ks-line-bot"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp line-bot/webhook.php "$STAGE/webhook.php"

          php -r '
            $config = [
              "channel_secret" => getenv("LINE_CHANNEL_SECRET"),
              "channel_access_token" => getenv("LINE_CHANNEL_ACCESS_TOKEN"),
            ];
            file_put_contents(
              $argv[1],
              "<?php\nif (!defined(\"KS_LINE_BOT_BOOTSTRAP\")) { http_response_code(404); exit; }\nreturn " .
              var_export($config, true) .
              ";\n"
            );
          ' "$STAGE/config.php"

          php -l "$STAGE/webhook.php"
          php -l "$STAGE/config.php"

      - name: Install lftp
        if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Validate isolated target
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ "$FTP_SERVER" = 'ftp.lolipop.jp' ]
          [ "$FTP_SERVER_DIR" = '/nami/ks-line-bot' ]
          [ "$WEBHOOK_URL" = 'https://nami.rss7.net/ks-line-bot/webhook.php' ]

      - name: Upload only LINE bot files to nami
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          STAGE="$RUNNER_TEMP/ks-line-bot"

          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          mkdir -p "$FTP_SERVER_DIR"
          put "$STAGE/webhook.php" -o "$FTP_SERVER_DIR/webhook.php"
          put "$STAGE/config.php" -o "$FTP_SERVER_DIR/config.php"
          bye
          LFTP_EOF

      - name: Verify isolated webhook health endpoint
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$WEBHOOK_URL")"
          [ "$body" = 'ok' ]
          echo "Isolated nami LINE bot endpoint is healthy."
