name: Test LINE group bot on nami

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ks-line-bot-nami
  cancel-in-progress: false

jobs:
  lint-and-stage:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ftp.lolipop.jp
      WEBHOOK_URL: https://nami.rss7.net/ks-line-bot/webhook.php
      POLL_URL: https://nami.rss7.net/ks-line-bot/weekly_poll.php

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Lint LINE bot PHP
        run: |
          php -l line-bot/common.php
          php -l line-bot/webhook.php
          php -l line-bot/weekly_poll.php
          php -l .github/scripts/extract-line-runtime-config.php

      - name: Check FTP credentials
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" || { echo '::error::KS_NAMI_FTP_USER is not configured.'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo '::error::KS_NAMI_FTP_PASSWORD is not configured.'; exit 1; }

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Prepare staging bundle from current production credentials
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          STAGE="$RUNNER_TEMP/ks-line-bot"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          get /kansai/line/webhook.php -o "$STAGE/current-webhook.php"
          bye
          LFTP_EOF

          cp line-bot/common.php "$STAGE/common.php"
          cp line-bot/webhook.php "$STAGE/webhook.php"
          cp line-bot/weekly_poll.php "$STAGE/weekly_poll.php"
          cp line-bot/data/.htaccess "$STAGE/data.htaccess"

          php .github/scripts/extract-line-runtime-config.php             "$STAGE/current-webhook.php"             "$STAGE/config.php"

          php -l "$STAGE/common.php"
          php -l "$STAGE/webhook.php"
          php -l "$STAGE/weekly_poll.php"
          php -l "$STAGE/config.php"

          ACCESS_TOKEN="$(php -r '$c=require $argv[1]; echo $c["channel_access_token"];' "$STAGE/config.php")"
          test -n "$ACCESS_TOKEN"
          curl --fail --silent --show-error             -H "Authorization: Bearer $ACCESS_TOKEN"             https://api.line.me/v2/bot/info >/dev/null
          unset ACCESS_TOKEN
          echo "Existing LINE credentials validated without printing them."

      - name: Upload isolated staging bot
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          STAGE="$RUNNER_TEMP/ks-line-bot"

          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          cd /nami
          mkdir -f ks-line-bot
          cd ks-line-bot
          mkdir -f data
          put "$STAGE/common.php" -o common.php
          put "$STAGE/webhook.php" -o webhook.php
          put "$STAGE/weekly_poll.php" -o weekly_poll.php
          put "$STAGE/config.php" -o config.php
          put "$STAGE/data.htaccess" -o data/.htaccess
          bye
          LFTP_EOF

      - name: Verify uploaded files by FTP
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          CHECK="$RUNNER_TEMP/ks-line-bot-check"
          rm -rf "$CHECK"
          mkdir -p "$CHECK"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          get /nami/ks-line-bot/webhook.php -o "$CHECK/webhook.php"
          get /nami/ks-line-bot/weekly_poll.php -o "$CHECK/weekly_poll.php"
          bye
          LFTP_EOF
          cmp line-bot/webhook.php "$CHECK/webhook.php"
          cmp line-bot/weekly_poll.php "$CHECK/weekly_poll.php"
          echo "FTP upload contents match the branch exactly."

      - name: Verify isolated endpoints
        shell: bash
        run: |
          set -euo pipefail
          webhook="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$WEBHOOK_URL")"
          poll="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$POLL_URL")"
          auto="$(curl --fail --silent --show-error --location "$POLL_URL?mode=auto")"
          echo "webhook_health=$webhook"
          echo "poll_health=$poll"
          echo "$auto" | grep -q '"action":"none"'
          test "$poll" = 'ok'
          echo "Nami scheduler endpoint is healthy; webhook response is recorded for path diagnosis."

      - name: Exercise signed anonymous vote end-to-end
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          STAGE="$RUNNER_TEMP/ks-line-bot"
          TARGET_DATE="$(TZ=Asia/Tokyo date -d 'tomorrow' +%F)"
          SECRET="$(php -r '$c=require $argv[1]; echo $c["channel_secret"];' "$STAGE/config.php")"
          test -n "$SECRET"

          send_vote() {
            spot="$1"
            body="$(printf '{"events":[{"type":"postback","source":{"type":"group","groupId":"Cksstagingtest","userId":"Uksstagingtest"},"postback":{"data":"ks_poll=destination&date=%s&spot=%s"}}]}' "$TARGET_DATE" "$spot")"
            signature="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -binary | base64 -w0)"
            response="$(curl --fail --silent --show-error               -H "Content-Type: application/json"               -H "X-Line-Signature: $signature"               --data "$body"               "$WEBHOOK_URL")"
            test "$response" = 'OK'
          }

          send_vote ikumi
          send_vote isonoura
          unset SECRET

          CHECK="$RUNNER_TEMP/ks-line-vote-check"
          rm -rf "$CHECK"
          mkdir -p "$CHECK"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          get /nami/ks-line-bot/data/votes.json -o "$CHECK/votes.json"
          bye
          LFTP_EOF

          php -r '
            $d=json_decode(file_get_contents($argv[1]),true);
            $votes=$d["votes"][$argv[2]]["Cksstagingtest"] ?? [];
            if(count($votes)!==1){fwrite(STDERR,"Expected exactly one anonymous voter.\n"); exit(1);}
            $vote=array_values($votes)[0] ?? [];
            if(($vote["spot"] ?? "")!=="isonoura"){fwrite(STDERR,"Vote replacement failed.\n"); exit(1);}
            echo "Anonymous one-person-one-vote replacement passed.\n";
          ' "$CHECK/votes.json" "$TARGET_DATE"

          lftp <<LFTP_EOF
          set cmd:fail-exit false
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          rm /nami/ks-line-bot/data/votes.json
          rm /nami/ks-line-bot/data/groups.json
          rm /nami/ks-line-bot/data/sent.json
          bye
          LFTP_EOF
