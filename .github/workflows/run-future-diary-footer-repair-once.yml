name: Run future diary footer repair once
on:
  push:
    paths:
      - '.github/workflows/run-future-diary-footer-repair-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch diary footer repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run repair-future-diary-footer.yml -R oosaka0123-sudo/kansai-surfer-ks --ref main
