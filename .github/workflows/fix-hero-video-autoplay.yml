name: Fix Hero Video Autoplay

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.user.type != 'Bot' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@fix-hero-video-autoplay')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: feat/top-isonoura-production-redesign
          fetch-depth: 0

      - name: Patch index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          s, n1 = re.subn(
              r'<video class="hero-video" id="heroVideo"[^>]*>.*?</video>',
              '<video class="hero-video" id="heroVideo" muted autoplay loop playsinline preload="auto" aria-hidden="true" tabindex="-1">\n      <source src="img/hero-surf-real.mp4" type="video/mp4">\n    </video>',
              s,
              count=1,
              flags=re.S,
          )
          if n1 != 1:
              raise SystemExit("Hero video markup not found")

          s, n2 = re.subn(
              r'<script>\s*\(\(\) => \{\s*const video = document\.getElementById\(\'heroVideo\'\);.*?\}\)\(\);\s*</script>',
              '''<script>
          (() => {
            const video = document.getElementById('heroVideo');
            if (!video) return;
            video.muted = true;
            video.defaultMuted = true;

            const playHero = () => {
              const promise = video.play();
              if (promise && typeof promise.then === 'function') {
                promise.then(() => video.classList.add('is-ready')).catch(() => {});
              }
            };

            video.addEventListener('playing', () => video.classList.add('is-ready'), { once: true });
            video.addEventListener('loadeddata', playHero, { once: true });
            video.addEventListener('canplay', playHero, { once: true });
            playHero();
            document.addEventListener('visibilitychange', () => {
              if (!document.hidden && video.paused) playHero();
            });
          })();
          </script>''',
              s,
              count=1,
              flags=re.S,
          )
          if n2 != 1:
              raise SystemExit("Hero video bootstrap script not found")

          p.write_text(s, encoding="utf-8", newline="\n")
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'muted autoplay loop playsinline preload="auto"' index.html
          grep -F '<source src="img/hero-surf-real.mp4" type="video/mp4">' index.html
          grep -F "video.addEventListener('playing'" index.html
          ! grep -Fq 'source[data-src]' index.html
          ! grep -Fq 'requestIdleCallback(start' index.html
          git diff --check
          test "$(git diff --name-only)" = "index.html"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: make Top Hero video autoplay reliably'
          git push origin HEAD:feat/top-isonoura-production-redesign
