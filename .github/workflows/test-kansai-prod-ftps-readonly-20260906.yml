name: Test Kansai production FTPS read-only

on:
  push:
    branches:
      - test/lolipop-ftps-kansai-prod-20260906

permissions:
  contents: read

jobs:
  test-kansai-prod-ftps-readonly:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ftp.lolipop.jp
      FTP_SERVER_DIR: /kansai
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Verify FTPS login and read-only access
        env:
          FTP_USERNAME: ${{ secrets.KS_PROD_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_PROD_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$FTP_USERNAME" ]; then
            echo "::error::KS_PROD_FTP_USER is not configured."
            exit 1
          fi
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::KS_PROD_FTP_PASSWORD is not configured."
            exit 1
          fi

          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          cd "$FTP_SERVER_DIR"
          pwd
          cls -1 | head -n 5
          bye
          LFTP_EOF

          echo "Kansai production FTPS authentication and read-only /kansai access succeeded."
          echo "No upload, delete, mirror, rename, mkdir, or file modification was performed."

# Triggered for one-time production connection verification only.
