name: Dry-run morning v2 production patch safely

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read

concurrency:
  group: ks-morning-v2-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.user.type != 'Bot' &&
          github.event.issue.pull_request == null &&
          contains(github.event.comment.body, '@dry-run-morning-v2-patch')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ftp.lolipop.jp
      PROD_FILE: /kansai/admin/auto_wave_today.php
      EXPECTED_SHA256: e2224884f6fded3655e4bfee83e3355c02da1f4ed9f08ae4d6b6861782203795

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp and PHP
        run: sudo apt-get update -qq && sudo apt-get install -y lftp php-cli

      - name: Fetch audited production source read-only
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

          mkdir -p "$RUNNER_TEMP/ks-morning-v2"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get "$PROD_FILE" -o "$RUNNER_TEMP/ks-morning-v2/auto_wave_today.php"
          bye
          LFTP_EOF

      - name: Verify exact source and build patch in memory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_auto_wave_today_v2.py \
            --source "$RUNNER_TEMP/ks-morning-v2/auto_wave_today.php" \
            --output "$RUNNER_TEMP/ks-morning-v2/auto_wave_today.v2.php" \
            --expected-sha256 "$EXPECTED_SHA256"

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          php -l "$RUNNER_TEMP/ks-morning-v2/auto_wave_today.v2.php"
          echo "PATCH_VALIDATED_NO_UPLOAD"
