name: Run Top share production once
on:
  push:
    paths:
      - '.github/workflows/run-top-share-production-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Top-only production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-top-share-button-production.yml -R oosaka0123-sudo/kansai-surfer-ks --ref main
