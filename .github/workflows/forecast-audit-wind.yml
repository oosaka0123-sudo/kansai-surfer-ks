name: KS morning wind audit
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ks-morning-wind-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit tools
        run: node --test tests/forecast-accuracy-audit.test.cjs tests/amedas-wind-audit.test.cjs
      - name: Prepare target
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p audit-output
          hour=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$EVENT_NAME" = schedule ] && { [ "$hour" -lt 1100 ] || [ "$hour" -gt 1500 ]; }; then
            echo 'Scheduled run outside 11:00-15:00 JST'; exit 1
          fi
          echo "TARGET_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
      - name: Collect independent station wind
        id: observations
        run: node scripts/amedas-wind-audit.cjs capture audit-output/wind.json "$TARGET_DATE"
      - name: Find preceding scheduled evening forecast
        id: preceding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous=$(date -u -d "$TARGET_DATE -1 day" +%F)
          gh api "repos/$GH_REPO/actions/workflows/forecast-audit-capture.yml/runs?event=schedule&branch=main&status=success&created=$previous&per_page=30" > "$RUNNER_TEMP/runs.json"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          date = datetime.fromisoformat(os.environ["TARGET_DATE"]).date()
          jst = timezone(timedelta(hours=9))
          data = json.loads((Path(os.environ["RUNNER_TEMP"])/"runs.json").read_text())
          candidates = []
          for r in data["workflow_runs"]:
              t = datetime.fromisoformat(r["run_started_at"].replace("Z","+00:00")).astimezone(jst)
              if r["event"]=="schedule" and r["head_branch"]=="main" and r["conclusion"]=="success" and t.date()==date-timedelta(days=1) and (19,30)<=(t.hour,t.minute)<=(22,0):
                  candidates.append(r)
          if len(candidates)>1:
              raise SystemExit("Ambiguous scheduled forecasts")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              if candidates:
                  r=candidates[0]
                  f.write(f"run_id={r['id']}\nattempt={r['run_attempt']}\n")
              else:
                  f.write("run_id=\n")
          PY
      - name: Download exact immutable forecast
        if: steps.preceding.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.preceding.outputs.run_id }}
          name: ks-forecast-schedule-${{ steps.preceding.outputs.run_id }}-${{ steps.preceding.outputs.attempt }}
          path: audit-output/forecast
      - name: Compare only matching frozen forecast
        env:
          RUN_ID: ${{ steps.preceding.outputs.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$RUN_ID" ]; then
            printf '{"status":"missing_previous_scheduled_forecast","target_date":"%s"}\n' "$TARGET_DATE" > audit-output/status.json
            echo 'No matching scheduled snapshot. Never substitute current forecast.'
            if [ "$EVENT_NAME" = schedule ]; then exit 1; fi
            exit 0
          fi
          node -e 'const s=require("./audit-output/forecast/snapshot.json"); const t=new Date(Date.parse(s.captured_at)+32400000).toISOString(); const prev=new Date(Date.parse(process.env.TARGET_DATE+"T00:00:00Z")-86400000).toISOString().slice(0,10); if(s.valid_jst!==process.env.TARGET_DATE||t.slice(0,10)!==prev||t.slice(11,16)<"19:30"||t.slice(11,16)>"22:00") throw Error("wrong snapshot");'
          node scripts/amedas-wind-audit.cjs compare audit-output/forecast/snapshot.json audit-output/wind.json > audit-output/comparison.json
          node -e 'const r=require("./audit-output/comparison.json"); console.log("Matched wind observations:",r.rows.length,"of",r.expected); if(r.rows.length!==r.expected)process.exitCode=2;'
      - name: Retain audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ks-wind-audit-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 90
