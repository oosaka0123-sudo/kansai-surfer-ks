name: Validate Top share strip position

on:
  push:
    branches:
      - fix/top-share-move-to-strip-20261021

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Capture responsive preview
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<div class="top-strip">' index.html
          grep -q 'id="topShareBtn"' index.html
          grep -q 'top: 50%;' index.html
          python3 -m http.server 8765 >/tmp/top-share-strip.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1600             --window-size=390,844 --screenshot="$RUNNER_TEMP/top-strip-390.png" http://127.0.0.1:8765/index.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1600             --window-size=1440,900 --screenshot="$RUNNER_TEMP/top-strip-1440.png" http://127.0.0.1:8765/index.html
          test -s "$RUNNER_TEMP/top-strip-390.png"
          test -s "$RUNNER_TEMP/top-strip-1440.png"
      - uses: actions/upload-artifact@v4
        with:
          name: top-share-strip-preview
          path: |
            ${{ runner.temp }}/top-strip-390.png
            ${{ runner.temp }}/top-strip-1440.png
          retention-days: 3
