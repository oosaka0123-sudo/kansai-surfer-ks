name: Daily LINE self-intro reminder

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-line-intro-age:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger isolated nami reminder check
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
          WEBHOOK_URL: https://nami.rss7.net/ks-line-bot/webhook.php?cron=1
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_PASSWORD"
          CRON_TOKEN="$(printf '%s' "$FTP_PASSWORD" | sha256sum | awk '{print $1}')"
          RESPONSE_FILE="$RUNNER_TEMP/line-bot-cron-response.txt"
          HTTP_CODE="$(curl --http1.1 --silent --show-error --retry 1 \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-KS-Cron-Token: $CRON_TOKEN" \
            --data 'cron=1' \
            "$WEBHOOK_URL")"
          cat "$RESPONSE_FILE"
          echo "HTTP $HTTP_CODE"
          test "$HTTP_CODE" = "200"
