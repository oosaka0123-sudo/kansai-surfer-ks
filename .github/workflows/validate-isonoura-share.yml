name: Validate Isonoura share button

on:
  push:
    branches:
      - feat/isonoura-share-button-20261021

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and responsive render
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="isonouraShareBtn"' isonoura.html
          grep -q 'fa-share-nodes' isonoura.html
          grep -q 'navigator.share' isonoura.html
          grep -q 'navigator.clipboard' isonoura.html
          grep -q 'AbortError' isonoura.html
          grep -q 'border: 0;' isonoura.html
          grep -q 'background: transparent;' isonoura.html

          python3 -m http.server 8765 >/tmp/isonoura-share-preview.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --virtual-time-budget=1800 --window-size=320,760             --screenshot="$RUNNER_TEMP/isonoura-share-320.png"             http://127.0.0.1:8765/isonoura.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --virtual-time-budget=1800 --window-size=390,844             --screenshot="$RUNNER_TEMP/isonoura-share-390.png"             http://127.0.0.1:8765/isonoura.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --virtual-time-budget=1800 --window-size=1440,900             --screenshot="$RUNNER_TEMP/isonoura-share-1440.png"             http://127.0.0.1:8765/isonoura.html

          test -s "$RUNNER_TEMP/isonoura-share-320.png"
          test -s "$RUNNER_TEMP/isonoura-share-390.png"
          test -s "$RUNNER_TEMP/isonoura-share-1440.png"

      - uses: actions/upload-artifact@v4
        with:
          name: isonoura-share-preview
          path: |
            ${{ runner.temp }}/isonoura-share-320.png
            ${{ runner.temp }}/isonoura-share-390.png
            ${{ runner.temp }}/isonoura-share-1440.png
          retention-days: 3
