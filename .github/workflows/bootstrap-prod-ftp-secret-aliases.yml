name: Bootstrap production FTP secret aliases

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Verify existing Lolipop credentials can reach production path read-only
        shell: bash
        env:
          SRC_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          SRC_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SRC_USER"
          test -n "$SRC_PASSWORD"
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          open -u "$SRC_USER","$SRC_PASSWORD" ftp.lolipop.jp
          cd /kansai
          cls -1
          bye
          LFTP

      - name: Create production-only secret aliases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          SRC_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          gh secret set KS_PROD_FTP_USER --repo "$GITHUB_REPOSITORY" --body "$SRC_USER"
          gh secret set KS_PROD_FTP_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$SRC_PASSWORD"
          echo 'Production FTP secret aliases created.'
