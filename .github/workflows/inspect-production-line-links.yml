name: Inspect production LINE links

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Inspect public production LINE anchors
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          ROOT="$RUNNER_TEMP/ks-prod-line-scan"
          mkdir -p "$ROOT"

          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          mirror --verbose=0             --include-glob '*.html'             --include-glob '*.php'             --include-glob '*.js'             --exclude-glob 'admin/**'             --exclude-glob 'data/**'             --exclude-glob 'uploads/**'             --exclude-glob 'line-bot/**'             /kansai "$ROOT"
          bye
          LFTP_EOF

          ROOT="$ROOT" python - <<'PY'
          import pathlib, re, os
          root = pathlib.Path(os.environ['ROOT'])
          pat = re.compile(r'<a\b[^>]*href=["\']([^"\']*(?:line\.me|lin\.ee|openchat)[^"\']*)["\'][^>]*>.*?</a>', re.I|re.S)
          rows=[]
          for p in root.rglob('*'):
              if p.suffix.lower() not in {'.html','.php','.js'} or not p.is_file():
                  continue
              txt=p.read_text(encoding='utf-8',errors='ignore')
              for m in pat.finditer(txt):
                  label=re.sub(r'<[^>]+>',' ',m.group(0))
                  label=' '.join(label.split())
                  rows.append((str(p.relative_to(root)),m.group(1),label[:120]))
          print(f'FOUND={len(rows)}')
          for path,href,label in rows:
              print(f'{path}\t{href}\t{label}')
          PY
