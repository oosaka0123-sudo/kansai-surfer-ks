name: Deploy LINE ChatGPT preview to nami

on:
  push:
    branches:
      - feat/line-community-chatgpt
    paths:
      - 'line-preview-chatgpt/**'
      - '.github/workflows/deploy-line-chatgpt-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kansai-surfer-line-chatgpt-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ftp.lolipop.jp
      DEPLOY_SCHEME: ftp
      DEPLOY_PORT: "21"
      DEPLOY_ROOT: /nami
      SOURCE_FILE: line-preview-chatgpt/index.html
      SOURCE_VIDEO: line-preview-chatgpt/hero-night-silent.mp4
      TARGET_FILE: line-preview-chatgpt-v2.html
      TARGET_VIDEO: line-preview-chatgpt-hero.mp4
      SITE_URL: https://nami.rss7.net/line-preview-chatgpt-v2.html
      VIDEO_URL: https://nami.rss7.net/line-preview-chatgpt-hero.mp4

    steps:
      - uses: actions/checkout@v4

      - name: Validate source and credentials
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -f "$SOURCE_FILE"
          test -f "$SOURCE_VIDEO"
          [[ -n "$DEPLOY_USER" && -n "$DEPLOY_PASSWORD" ]]
          [[ "$DEPLOY_ROOT" == "/nami" ]]
          [[ "$TARGET_FILE" == "line-preview-chatgpt-v2.html" ]]
          [[ "$TARGET_VIDEO" == "line-preview-chatgpt-hero.mp4" ]]
          test "$(stat -c%s "$SOURCE_VIDEO")" -eq 413647

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload preview HTML and video
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT"
          cd "$DEPLOY_ROOT"
          put "$SOURCE_FILE" -o "$TARGET_FILE"
          put "$SOURCE_VIDEO" -o "$TARGET_VIDEO"
          bye
          LFTP

      - name: Verify public preview
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$SITE_URL" > /tmp/line-preview.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$VIDEO_URL" -o /tmp/line-hero.mp4
          grep -qi '<html' /tmp/line-preview.html
          grep -q '関西サーファーLINE' /tmp/line-preview.html
          grep -q 'line-preview-chatgpt-hero.mp4' /tmp/line-preview.html
          grep -q '約330名' /tmp/line-preview.html
          grep -q '約10名' /tmp/line-preview.html
          test "$(stat -c%s /tmp/line-hero.mp4)" -eq 413647
          echo "Preview verified: $SITE_URL"
