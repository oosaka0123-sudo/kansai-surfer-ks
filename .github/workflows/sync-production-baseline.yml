name: Sync production baseline to audit branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ks-production-baseline-sync
  cancel-in-progress: false

jobs:
  sync-production-baseline:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.user.type != 'Bot' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@sync-prod-baseline')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout baseline audit branch
        uses: actions/checkout@v4
        with:
          ref: chore/import-production-baseline-top-isonoura
          fetch-depth: 0

      - name: Fetch exact public production files
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kansai.rss7.net'
          TMP="$RUNNER_TEMP/ks-prod-baseline"
          mkdir -p "$TMP/img"

          fetch_required() {
            local url="$1" out="$2"
            echo "Fetching $url"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 \
              "$url" -o "$out"
          }

          fetch_optional() {
            local url="$1" out="$2"
            echo "Fetching optional $url"
            if ! curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              "$url" -o "$out"; then
              rm -f "$out"
              echo "Optional resource unavailable: $url"
            fi
          }

          fetch_required "$BASE/index.html" "$TMP/index.html"
          fetch_required "$BASE/isonoura.html" "$TMP/isonoura.html"
          fetch_required "$BASE/nami_common.css?v=1018" "$TMP/nami_common.css"
          fetch_required "$BASE/nami_common.js?v=1018" "$TMP/nami_common.js"
          fetch_required "$BASE/manifest.json" "$TMP/manifest.json"
          fetch_required "$BASE/sw.js" "$TMP/sw.js"

          fetch_optional "$BASE/img/logo-ks-white.png" "$TMP/img/logo-ks-white.png"
          fetch_optional "$BASE/img/favicon.png" "$TMP/img/favicon.png"
          fetch_optional "$BASE/img/favicon-32.png" "$TMP/img/favicon-32.png"
          fetch_optional "$BASE/img/icon-192.png" "$TMP/img/icon-192.png"
          fetch_optional "$BASE/img/icon-192-maskable.png" "$TMP/img/icon-192-maskable.png"
          fetch_optional "$BASE/img/icon-512.png" "$TMP/img/icon-512.png"
          fetch_optional "$BASE/img/icon-512-maskable.png" "$TMP/img/icon-512-maskable.png"
          fetch_optional "$BASE/favicon.ico" "$TMP/favicon.ico"

          grep -Eqi '<!doctype html|<html' "$TMP/index.html"
          grep -Eqi '<!doctype html|<html' "$TMP/isonoura.html"
          grep -q 'Common JS repaired v1007' "$TMP/nami_common.js"
          grep -q '{' "$TMP/nami_common.css"
          node --check "$TMP/nami_common.js"
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'ks-prod-baseline' / 'manifest.json'
          json.loads(p.read_text(encoding='utf-8'))
          print('manifest.json parse OK')
          PY

          for f in "$TMP"/img/* "$TMP/favicon.ico"; do
            [ -e "$f" ] || continue
            mime="$(file --brief --mime-type "$f")"
            case "$mime" in
              image/png|image/x-icon|image/vnd.microsoft.icon) ;;
              *) echo "Unexpected image MIME $mime for $f"; exit 1 ;;
            esac
          done

          cp "$TMP/index.html" index.html
          cp "$TMP/isonoura.html" isonoura.html
          cp "$TMP/nami_common.css" nami_common.css
          cp "$TMP/nami_common.js" nami_common.js
          cp "$TMP/manifest.json" manifest.json
          cp "$TMP/sw.js" sw.js
          mkdir -p img docs
          for f in "$TMP"/img/*; do [ -e "$f" ] && cp "$f" img/; done
          [ -e "$TMP/favicon.ico" ] && cp "$TMP/favicon.ico" favicon.ico || true

          {
            echo '# Exact production baseline SHA-256'
            echo
            echo 'Fetched by GitHub Actions directly from https://kansai.rss7.net/ for Issue #25.'
            echo 'These hashes cover only files successfully fetched in this run.'
            echo
            sha256sum index.html isonoura.html nami_common.css nami_common.js manifest.json sw.js
            for f in img/logo-ks-white.png img/favicon.png img/favicon-32.png img/icon-192.png img/icon-192-maskable.png img/icon-512.png img/icon-512-maskable.png favicon.ico; do
              [ -f "$f" ] && sha256sum "$f"
            done
          } > docs/PRODUCTION_BASELINE_SHA256.txt

          echo 'Production fetch and validation completed.'

      - name: Commit exact baseline to audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html isonoura.html nami_common.css nami_common.js manifest.json sw.js docs/PRODUCTION_BASELINE_SHA256.txt img
          if [ -f favicon.ico ]; then git add favicon.ico; fi
          if git diff --cached --quiet; then
            echo 'No baseline changes to commit.'
          else
            git commit -m 'chore: sync exact production Top and Isonoura baseline'
            git push origin HEAD:chore/import-production-baseline-top-isonoura
          fi

      - name: Report result on issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Production baseline sync completed on \`chore/import-production-baseline-top-isonoura\`. Exact public files were fetched by the GitHub runner, validated, hashed, committed when changed, and production was not modified. Current branch HEAD: \`$SHA\`. See \`docs/PRODUCTION_BASELINE_SHA256.txt\`."
