name: hamadutu guarded full UI release (7 paths only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  hamadutu-only:
    if: github.ref == 'refs/heads/ops/hamadutu-full-release-20261126' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_ROOT: /kansai
      SITE: https://kansai.rss7.net
      OLD_HTML: 11bc1a37825b4446f94ff5d1c91dfda496d72d4d933ad398a68cabe7b15f447c
      OLD_COMMON: 034ecc6cd950fbacf6b082336802f0d5fd9927bbd3bf962629e8fc56d44e09fd
      NEW_HTML: 644fbc761b1e811e1e08758fd6f238caf539370f405753826aaab6747c751894
      SHA_INDEX: cc08c9d7ce0bbf82a0aeb5ce07793da3454efe825fb8a64f2ecd66e1dc74499e
      SHA_CSS: 531331bdd5fb8c86e482a08366a7234426979d30f92a1076d52ed219043a8d5d
      SHA_ADAPTER: 2ac2f1fabd35cb2da56b81a268aea12281c0c088144bbed337c1ae8c5d9d5392
      SHA_APP: e9477298fc82c837a4c18d526d5e2ee58ea5dcc66571ef7323db849a47bec33f
      SHA_T62026: 5e3d03ef30e5baae0ae62bf27ae5f390c0367fc47d73bf9983abec8a9d2b74c4
      SHA_T62027: fa60069042a17f7ef1efe0141cf4273cec5ba58aa2b6bed9645ebe39914fdc69

    steps:
      - name: Checkout exact reviewed commit (never deploy main)
        uses: actions/checkout@v4
        with:
          ref: e27e774ae12b999c2a7105ecadffd00b474c7683
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exactly seven deployment files and twelve tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/hamadutu-full-release-20261126'
          test "$FTP_HOST" = 'ftp.lolipop.jp' && test "$FTP_ROOT" = '/kansai'
          test "$SITE" = 'https://kansai.rss7.net'
          test "$(git rev-parse HEAD)" = 'e27e774ae12b999c2a7105ecadffd00b474c7683'
          test "$(sha256sum hamadutu.html | cut -d' ' -f1)" = "$NEW_HTML"
          test "$(sha256sum hamadutu-hourly/index.html | cut -d' ' -f1)" = "$SHA_INDEX"
          test "$(sha256sum hamadutu-hourly/styles.css | cut -d' ' -f1)" = "$SHA_CSS"
          test "$(sha256sum hamadutu-hourly/adapter.js | cut -d' ' -f1)" = "$SHA_ADAPTER"
          test "$(sha256sum hamadutu-hourly/app.js | cut -d' ' -f1)" = "$SHA_APP"
          test "$(sha256sum hamadutu-hourly/data/T6-2026.json | cut -d' ' -f1)" = "$SHA_T62026"
          test "$(sha256sum hamadutu-hourly/data/T6-2027.json | cut -d' ' -f1)" = "$SHA_T62027"
          grep -Fq 'id="hamadutu-windy"' hamadutu.html
          grep -Fq 'hamadutu-hourly/index.html?v=20261126-3' hamadutu.html
          grep -Fq 'lat=35.665200&amp;lon=134.966082' hamadutu.html
          node --check hamadutu-hourly/adapter.js
          node --check hamadutu-hourly/app.js
          node --test tests/hamadutu-20261126.test.cjs
          echo 'SOURCE_GUARDS_OK: exactly hamadutu UI and T6 tides'

      - name: Install explicit secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Compare current HTTPS/FTPS, verify no preexisting hamadutu hourly subtree
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          D="$RUNNER_TEMP/ks-hamadutu-release"
          mkdir -p "$D"
          curl -fsSL --retry 3 "$SITE/hamadutu.html?preflight=$GITHUB_RUN_ID" -o "$D/old-http.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?preflight=$GITHUB_RUN_ID" -o "$D/old-common.js"
          test "$(sha256sum "$D/old-http.html" | cut -d' ' -f1)" = "$OLD_HTML" || { echo '::error::hamadutu HTML changed; refusing upload'; exit 1; }
          test "$(sha256sum "$D/old-common.js" | cut -d' ' -f1)" = "$OLD_COMMON" || { echo '::error::Shared JS changed; refusing upload'; exit 1; }
          lftp <<LFTP_PREFLIGHT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          get "$FTP_ROOT/hamadutu.html" -o "$D/old-ftp.html"
          cls -1 "$FTP_ROOT" > "$D/root-names.txt"
          bye
          LFTP_PREFLIGHT
          cmp "$D/old-http.html" "$D/old-ftp.html"
          if grep -Fq 'hamadutu-hourly' "$D/root-names.txt"; then
            echo '::error::hamadutu hourly directory exists. Refusing to overwrite any previous files.'
            exit 1
          fi
          echo 'PRECHECK_OK: old page matches FTP, shared JS unchanged, hourly directory not present'

      - name: Preserve current hamadutu HTML backup before first write
        uses: actions/upload-artifact@v4
        with:
          name: ks-hamadutu-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ks-hamadutu-release/old-ftp.html
            ${{ runner.temp }}/ks-hamadutu-release/old-common.js
          if-no-files-found: error
          retention-days: 14

      - name: Upload new six hourly assets first, verify each; switch HTML last
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          D="$RUNNER_TEMP/ks-hamadutu-release"
          HTML_ATTEMPTED=0
          rollback() {
            status=$?
            trap - ERR
            set +e
            if [ "$HTML_ATTEMPTED" -eq 1 ]; then
              echo '::error::Deployment failed after HTML switch; restoring original HTML.'
              lftp <<LFTP_ROLLBACK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "$D/old-ftp.html" -o "$FTP_ROOT/hamadutu.html"
          bye
          LFTP_ROLLBACK
              test $? -eq 0 || echo '::error::Automatic HTML restore failed; private backup artifact retained'
            fi
            echo '::warning::New /kansai/hamadutu-hourly assets may remain isolated and unreferenced. No other spot was changed.'
            curl -fsSL --retry 2 "$SITE/hamadutu.html?verify_restore=$GITHUB_RUN_ID" -o "$D/restored.html"
            test "$(sha256sum "$D/restored.html" | cut -d' ' -f1)" = "$OLD_HTML" || echo '::error::Rollback HTTPS does not match original'
            exit "$status"
          }
          trap rollback ERR
          curl -fsSL --retry 3 "$SITE/hamadutu.html?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.html"
          cmp "$D/immediate.html" "$D/old-ftp.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate-common.js"
          test "$(sha256sum "$D/immediate-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"

          lftp <<LFTP_ASSETS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mkdir -p "$FTP_ROOT/hamadutu-hourly/data"
          put "hamadutu-hourly/data/T6-2026.json" -o "$FTP_ROOT/hamadutu-hourly/data/T6-2026.json"
          put "hamadutu-hourly/data/T6-2027.json" -o "$FTP_ROOT/hamadutu-hourly/data/T6-2027.json"
          put "hamadutu-hourly/styles.css" -o "$FTP_ROOT/hamadutu-hourly/styles.css"
          put "hamadutu-hourly/app.js" -o "$FTP_ROOT/hamadutu-hourly/app.js"
          put "hamadutu-hourly/adapter.js" -o "$FTP_ROOT/hamadutu-hourly/adapter.js"
          put "hamadutu-hourly/index.html" -o "$FTP_ROOT/hamadutu-hourly/index.html"
          bye
          LFTP_ASSETS
          verify_asset() {
            local rel="$1" sha="$2" label="$3"
            local target="$D/$label"
            curl -fsSL --retry 6 --retry-delay 2 "$SITE/$rel?asset_check=$GITHUB_RUN_ID" -o "$target"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$sha" || { echo "::error::Asset checksum mismatch $rel"; return 1; }
            echo "ASSET_VERIFIED $rel"
          }
          verify_asset 'hamadutu-hourly/data/T6-2026.json' "$SHA_T62026" 'T6-2026-verified.json'
          verify_asset 'hamadutu-hourly/data/T6-2027.json' "$SHA_T62027" 'T6-2027-verified.json'
          verify_asset 'hamadutu-hourly/styles.css' "$SHA_CSS" 'styles-verified.css'
          verify_asset 'hamadutu-hourly/app.js' "$SHA_APP" 'app-verified.js'
          verify_asset 'hamadutu-hourly/adapter.js' "$SHA_ADAPTER" 'adapter-verified.js'
          verify_asset 'hamadutu-hourly/index.html' "$SHA_INDEX" 'index-verified.html'

          # Switch only hamadutu public HTML after six new assets are verified.
          curl -fsSL --retry 3 "$SITE/hamadutu.html?switch_guard=$GITHUB_RUN_ID" -o "$D/switch-guard.html"
          cmp "$D/switch-guard.html" "$D/old-ftp.html"
          HTML_ATTEMPTED=1
          lftp <<LFTP_HTML
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "hamadutu.html" -o "$FTP_ROOT/hamadutu.html"
          bye
          LFTP_HTML
          curl -fsSL --retry 6 --retry-delay 2 "$SITE/hamadutu.html?html_verify=$GITHUB_RUN_ID" -o "$D/new.html"
          test "$(sha256sum "$D/new.html" | cut -d' ' -f1)" = "$NEW_HTML"
          grep -Fq 'id="hamadutu-windy"' "$D/new.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?common_verify=$GITHUB_RUN_ID" -o "$D/unchanged-common.js"
          test "$(sha256sum "$D/unchanged-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"
          trap - ERR
          echo 'SUCCESS: only hamadutu HTML + six scoped hourly assets were deployed'
