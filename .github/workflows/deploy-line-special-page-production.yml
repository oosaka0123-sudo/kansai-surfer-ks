name: hakuto guarded full UI release (7 paths only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  hakuto-only:
    if: github.ref == 'refs/heads/ops/hakuto-full-release-20261126' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_ROOT: /kansai
      SITE: https://kansai.rss7.net
      OLD_HTML: 7845d959cd2cb386ebda52b85b40f305012b52d2f6612c27cf4c3f9be2573ce7
      OLD_COMMON: 034ecc6cd950fbacf6b082336802f0d5fd9927bbd3bf962629e8fc56d44e09fd
      NEW_HTML: 382a9d62444e4f270e33642f02e6c69770d61bed1fb3005f80c2135e0bb97372
      SHA_INDEX: 0f8d1d1a3dc3cbb67f85a8dd24b6ad5873798f4c5ab797e7e95008985ad06c55
      SHA_CSS: 531331bdd5fb8c86e482a08366a7234426979d30f92a1076d52ed219043a8d5d
      SHA_ADAPTER: 1f4f18b125aae6d0301e63bbb6e6f4cb9bffbd1935d2ebb577f1d4b3146c24d9
      SHA_APP: cdba3963847cb550b93945fbb56dc012c62e6ec15909bfd9225e7bc11726281b
      SHA_ZE2026: 3656d3dcf21f5d538c6266a6c704af3bb8cff2f9e283721290bedd35bd160696
      SHA_ZE2027: 70bac12d9eb8a5f50b1e01954aff619ac2944e5ad9143fda5ee3ff7324b6a396

    steps:
      - name: Checkout exact reviewed commit (never deploy main)
        uses: actions/checkout@v4
        with:
          ref: f259167b06afbe851304c225dfe485dd30f90561
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exactly seven deployment files and twelve tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/hakuto-full-release-20261126'
          test "$FTP_HOST" = 'ftp.lolipop.jp' && test "$FTP_ROOT" = '/kansai'
          test "$SITE" = 'https://kansai.rss7.net'
          test "$(git rev-parse HEAD)" = 'f259167b06afbe851304c225dfe485dd30f90561'
          test "$(sha256sum hakuto.html | cut -d' ' -f1)" = "$NEW_HTML"
          test "$(sha256sum hakuto-hourly/index.html | cut -d' ' -f1)" = "$SHA_INDEX"
          test "$(sha256sum hakuto-hourly/styles.css | cut -d' ' -f1)" = "$SHA_CSS"
          test "$(sha256sum hakuto-hourly/adapter.js | cut -d' ' -f1)" = "$SHA_ADAPTER"
          test "$(sha256sum hakuto-hourly/app.js | cut -d' ' -f1)" = "$SHA_APP"
          test "$(sha256sum hakuto-hourly/data/ZE-2026.json | cut -d' ' -f1)" = "$SHA_ZE2026"
          test "$(sha256sum hakuto-hourly/data/ZE-2027.json | cut -d' ' -f1)" = "$SHA_ZE2027"
          grep -Fq 'id="hakuto-windy"' hakuto.html
          grep -Fq 'hakuto-hourly/index.html?v=20261126-3' hakuto.html
          grep -Fq 'lat=35.527370&amp;lon=134.116740' hakuto.html
          node --check hakuto-hourly/adapter.js
          node --check hakuto-hourly/app.js
          node --test tests/hakuto-20261126.test.cjs
          echo 'SOURCE_GUARDS_OK: exactly hakuto UI and ZE tides'

      - name: Install explicit secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Compare current HTTPS/FTPS, verify no preexisting hakuto hourly subtree
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          D="$RUNNER_TEMP/ks-hakuto-release"
          mkdir -p "$D"
          curl -fsSL --retry 3 "$SITE/hakuto.html?preflight=$GITHUB_RUN_ID" -o "$D/old-http.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?preflight=$GITHUB_RUN_ID" -o "$D/old-common.js"
          test "$(sha256sum "$D/old-http.html" | cut -d' ' -f1)" = "$OLD_HTML" || { echo '::error::hakuto HTML changed; refusing upload'; exit 1; }
          test "$(sha256sum "$D/old-common.js" | cut -d' ' -f1)" = "$OLD_COMMON" || { echo '::error::Shared JS changed; refusing upload'; exit 1; }
          lftp <<LFTP_PREFLIGHT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          get "$FTP_ROOT/hakuto.html" -o "$D/old-ftp.html"
          cls -1 "$FTP_ROOT" > "$D/root-names.txt"
          bye
          LFTP_PREFLIGHT
          cmp "$D/old-http.html" "$D/old-ftp.html"
          if grep -Fq 'hakuto-hourly' "$D/root-names.txt"; then
            echo '::error::hakuto hourly directory exists. Refusing to overwrite any previous files.'
            exit 1
          fi
          echo 'PRECHECK_OK: old page matches FTP, shared JS unchanged, hourly directory not present'

      - name: Preserve current hakuto HTML backup before first write
        uses: actions/upload-artifact@v4
        with:
          name: ks-hakuto-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ks-hakuto-release/old-ftp.html
            ${{ runner.temp }}/ks-hakuto-release/old-common.js
          if-no-files-found: error
          retention-days: 14

      - name: Upload new six hourly assets first, verify each; switch HTML last
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          D="$RUNNER_TEMP/ks-hakuto-release"
          HTML_ATTEMPTED=0
          rollback() {
            status=$?
            trap - ERR
            set +e
            if [ "$HTML_ATTEMPTED" -eq 1 ]; then
              echo '::error::Deployment failed after HTML switch; restoring original HTML.'
              lftp <<LFTP_ROLLBACK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "$D/old-ftp.html" -o "$FTP_ROOT/hakuto.html"
          bye
          LFTP_ROLLBACK
              test $? -eq 0 || echo '::error::Automatic HTML restore failed; private backup artifact retained'
            fi
            echo '::warning::New /kansai/hakuto-hourly assets may remain isolated and unreferenced. No other spot was changed.'
            curl -fsSL --retry 2 "$SITE/hakuto.html?verify_restore=$GITHUB_RUN_ID" -o "$D/restored.html"
            test "$(sha256sum "$D/restored.html" | cut -d' ' -f1)" = "$OLD_HTML" || echo '::error::Rollback HTTPS does not match original'
            exit "$status"
          }
          trap rollback ERR
          curl -fsSL --retry 3 "$SITE/hakuto.html?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.html"
          cmp "$D/immediate.html" "$D/old-ftp.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate-common.js"
          test "$(sha256sum "$D/immediate-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"

          lftp <<LFTP_ASSETS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mkdir -p "$FTP_ROOT/hakuto-hourly/data"
          put "hakuto-hourly/data/ZE-2026.json" -o "$FTP_ROOT/hakuto-hourly/data/ZE-2026.json"
          put "hakuto-hourly/data/ZE-2027.json" -o "$FTP_ROOT/hakuto-hourly/data/ZE-2027.json"
          put "hakuto-hourly/styles.css" -o "$FTP_ROOT/hakuto-hourly/styles.css"
          put "hakuto-hourly/app.js" -o "$FTP_ROOT/hakuto-hourly/app.js"
          put "hakuto-hourly/adapter.js" -o "$FTP_ROOT/hakuto-hourly/adapter.js"
          put "hakuto-hourly/index.html" -o "$FTP_ROOT/hakuto-hourly/index.html"
          bye
          LFTP_ASSETS
          verify_asset() {
            local rel="$1" sha="$2" label="$3"
            local target="$D/$label"
            curl -fsSL --retry 6 --retry-delay 2 "$SITE/$rel?asset_check=$GITHUB_RUN_ID" -o "$target"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$sha" || { echo "::error::Asset checksum mismatch $rel"; return 1; }
            echo "ASSET_VERIFIED $rel"
          }
          verify_asset 'hakuto-hourly/data/ZE-2026.json' "$SHA_ZE2026" 'ZE-2026-verified.json'
          verify_asset 'hakuto-hourly/data/ZE-2027.json' "$SHA_ZE2027" 'ZE-2027-verified.json'
          verify_asset 'hakuto-hourly/styles.css' "$SHA_CSS" 'styles-verified.css'
          verify_asset 'hakuto-hourly/app.js' "$SHA_APP" 'app-verified.js'
          verify_asset 'hakuto-hourly/adapter.js' "$SHA_ADAPTER" 'adapter-verified.js'
          verify_asset 'hakuto-hourly/index.html' "$SHA_INDEX" 'index-verified.html'

          # Switch only hakuto public HTML after six new assets are verified.
          curl -fsSL --retry 3 "$SITE/hakuto.html?switch_guard=$GITHUB_RUN_ID" -o "$D/switch-guard.html"
          cmp "$D/switch-guard.html" "$D/old-ftp.html"
          HTML_ATTEMPTED=1
          lftp <<LFTP_HTML
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "hakuto.html" -o "$FTP_ROOT/hakuto.html"
          bye
          LFTP_HTML
          curl -fsSL --retry 6 --retry-delay 2 "$SITE/hakuto.html?html_verify=$GITHUB_RUN_ID" -o "$D/new.html"
          test "$(sha256sum "$D/new.html" | cut -d' ' -f1)" = "$NEW_HTML"
          grep -Fq 'id="hakuto-windy"' "$D/new.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?common_verify=$GITHUB_RUN_ID" -o "$D/unchanged-common.js"
          test "$(sha256sum "$D/unchanged-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"
          trap - ERR
          echo 'SUCCESS: only hakuto HTML + six scoped hourly assets were deployed'
