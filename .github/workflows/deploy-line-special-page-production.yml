name: Isonoura deployment canary (MCP isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false
jobs:
  canary:
    if: github.ref == 'refs/heads/ops/isonoura-guarded-mcp-20261124' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    steps:
      - name: Canary, no writes
        run: |
          test "$GITHUB_REF" = 'refs/heads/ops/isonoura-guarded-mcp-20261124'
          echo 'CANARY_MCP_NO_DEPLOY_20261124'
