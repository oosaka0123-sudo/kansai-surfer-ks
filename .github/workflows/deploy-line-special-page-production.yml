name: Guarded Shimanto coastline view release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/ops/shimanto-coastview-178' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test scoped candidate and install FTPS
        run: |
          set -euo pipefail
          for t in candidates unified tides home verdict coastview; do node "tests/shimanto-$t.test.cjs"; done
          node --check shimanto/unified.js
          node --check shimanto/hourly/adapter.js
          python3 -m py_compile scripts/deploy-shimanto-coastview.py
          sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Read-only FTP collision and baseline check
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: python3 scripts/deploy-shimanto-coastview.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: shimanto-unified-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/shimanto-release/backup/
          if-no-files-found: error
          retention-days: 14
      - name: Publish five coastline view pages, verify or restore
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: python3 scripts/deploy-shimanto-coastview.py publish
