name: Guarded PWA single-file production release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/ops/pwa-sw-release-184' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test candidate and install FTPS
        run: |
          node --check sw.js
          node tests/pwa.test.cjs
          sudo apt-get update -qq
          sudo apt-get install -y lftp
      - name: Verify live manifest, icons, pages and worker; back up
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: python3 scripts/deploy-pwa-worker.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: original-public-pwa-worker
          path: ${{ runner.temp }}/ks-pwa-backup-sw.js
          if-no-files-found: error
          retention-days: 7
      - name: Publish only sw.js, verify or restore
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: python3 scripts/deploy-pwa-worker.py publish
