name: shizunami guarded full UI release (7 paths only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  shizunami-only:
    if: github.ref == 'refs/heads/ops/shizunami-full-release-20261126' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_ROOT: /kansai
      SITE: https://kansai.rss7.net
      OLD_HTML: 6e50d23f001ab23f04efce2dc8ce37cd07c5c23ef8bdb51a1d417760e8d3cee3
      OLD_COMMON: 034ecc6cd950fbacf6b082336802f0d5fd9927bbd3bf962629e8fc56d44e09fd
      NEW_HTML: 029945d5616217692b9c70909949144a97ba1c24624e09c0b70094b1961dd5c4
      SHA_INDEX: 6368c6fe7574412a681892731f7ccbafe7c178ce2762224e753ecf876b4abdbb
      SHA_CSS: 531331bdd5fb8c86e482a08366a7234426979d30f92a1076d52ed219043a8d5d
      SHA_ADAPTER: 5eb178d76944bc3ed5add3fdb25f3bbe1591e7a61b86ecfdc95db44829630ebc
      SHA_APP: f659f57cc4efab2482a0a523748dcaa81130c64a677674b7417bad542e1ab525
      SHA_OM2026: 6d5f5492e965ce811304c2bda5ddfe9e907a32c086d21a72114e98fae8d3570d
      SHA_OM2027: 369e1c20520db711a93bd7d99db0a595e93e856429ab17a4692b0ba59a6f7474

    steps:
      - name: Checkout exact reviewed commit (never deploy main)
        uses: actions/checkout@v4
        with:
          ref: ebfccb335dd1e90c0ed78c8c984402b77f46e2db
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exactly seven deployment files and twelve tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/shizunami-full-release-20261126'
          test "$FTP_HOST" = 'ftp.lolipop.jp' && test "$FTP_ROOT" = '/kansai'
          test "$SITE" = 'https://kansai.rss7.net'
          test "$(git rev-parse HEAD)" = 'ebfccb335dd1e90c0ed78c8c984402b77f46e2db'
          test "$(sha256sum shizunami.html | cut -d' ' -f1)" = "$NEW_HTML"
          test "$(sha256sum shizunami-hourly/index.html | cut -d' ' -f1)" = "$SHA_INDEX"
          test "$(sha256sum shizunami-hourly/styles.css | cut -d' ' -f1)" = "$SHA_CSS"
          test "$(sha256sum shizunami-hourly/adapter.js | cut -d' ' -f1)" = "$SHA_ADAPTER"
          test "$(sha256sum shizunami-hourly/app.js | cut -d' ' -f1)" = "$SHA_APP"
          test "$(sha256sum shizunami-hourly/data/OM-2026.json | cut -d' ' -f1)" = "$SHA_OM2026"
          test "$(sha256sum shizunami-hourly/data/OM-2027.json | cut -d' ' -f1)" = "$SHA_OM2027"
          grep -Fq 'id="shizunami-windy"' shizunami.html
          grep -Fq 'shizunami-hourly/index.html?v=20261126-3' shizunami.html
          grep -Fq 'lat=34.726&amp;lon=138.218' shizunami.html
          node --check shizunami-hourly/adapter.js
          node --check shizunami-hourly/app.js
          node --test tests/shizunami-20261126.test.cjs
          echo 'SOURCE_GUARDS_OK: exactly shizunami UI and OM tides'

      - name: Install explicit secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Compare current HTTPS/FTPS, verify no preexisting shizunami hourly subtree
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          D="$RUNNER_TEMP/ks-shizunami-release"
          mkdir -p "$D"
          curl -fsSL --retry 3 "$SITE/shizunami.html?preflight=$GITHUB_RUN_ID" -o "$D/old-http.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?preflight=$GITHUB_RUN_ID" -o "$D/old-common.js"
          test "$(sha256sum "$D/old-http.html" | cut -d' ' -f1)" = "$OLD_HTML" || { echo '::error::shizunami HTML changed; refusing upload'; exit 1; }
          test "$(sha256sum "$D/old-common.js" | cut -d' ' -f1)" = "$OLD_COMMON" || { echo '::error::Shared JS changed; refusing upload'; exit 1; }
          lftp <<LFTP_PREFLIGHT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          get "$FTP_ROOT/shizunami.html" -o "$D/old-ftp.html"
          cls -1 "$FTP_ROOT" > "$D/root-names.txt"
          bye
          LFTP_PREFLIGHT
          cmp "$D/old-http.html" "$D/old-ftp.html"
          if grep -Fq 'shizunami-hourly' "$D/root-names.txt"; then
            echo '::error::shizunami hourly directory exists. Refusing to overwrite any previous files.'
            exit 1
          fi
          echo 'PRECHECK_OK: old page matches FTP, shared JS unchanged, hourly directory not present'

      - name: Preserve current shizunami HTML backup before first write
        uses: actions/upload-artifact@v4
        with:
          name: ks-shizunami-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ks-shizunami-release/old-ftp.html
            ${{ runner.temp }}/ks-shizunami-release/old-common.js
          if-no-files-found: error
          retention-days: 14

      - name: Upload new six hourly assets first, verify each; switch HTML last
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          D="$RUNNER_TEMP/ks-shizunami-release"
          HTML_ATTEMPTED=0
          rollback() {
            status=$?
            trap - ERR
            set +e
            if [ "$HTML_ATTEMPTED" -eq 1 ]; then
              echo '::error::Deployment failed after HTML switch; restoring original HTML.'
              lftp <<LFTP_ROLLBACK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "$D/old-ftp.html" -o "$FTP_ROOT/shizunami.html"
          bye
          LFTP_ROLLBACK
              test $? -eq 0 || echo '::error::Automatic HTML restore failed; private backup artifact retained'
            fi
            echo '::warning::New /kansai/shizunami-hourly assets may remain isolated and unreferenced. No other spot was changed.'
            curl -fsSL --retry 2 "$SITE/shizunami.html?verify_restore=$GITHUB_RUN_ID" -o "$D/restored.html"
            test "$(sha256sum "$D/restored.html" | cut -d' ' -f1)" = "$OLD_HTML" || echo '::error::Rollback HTTPS does not match original'
            exit "$status"
          }
          trap rollback ERR
          curl -fsSL --retry 3 "$SITE/shizunami.html?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.html"
          cmp "$D/immediate.html" "$D/old-ftp.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate-common.js"
          test "$(sha256sum "$D/immediate-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"

          lftp <<LFTP_ASSETS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mkdir -p "$FTP_ROOT/shizunami-hourly/data"
          put "shizunami-hourly/data/OM-2026.json" -o "$FTP_ROOT/shizunami-hourly/data/OM-2026.json"
          put "shizunami-hourly/data/OM-2027.json" -o "$FTP_ROOT/shizunami-hourly/data/OM-2027.json"
          put "shizunami-hourly/styles.css" -o "$FTP_ROOT/shizunami-hourly/styles.css"
          put "shizunami-hourly/app.js" -o "$FTP_ROOT/shizunami-hourly/app.js"
          put "shizunami-hourly/adapter.js" -o "$FTP_ROOT/shizunami-hourly/adapter.js"
          put "shizunami-hourly/index.html" -o "$FTP_ROOT/shizunami-hourly/index.html"
          bye
          LFTP_ASSETS
          verify_asset() {
            local rel="$1" sha="$2" label="$3"
            local target="$D/$label"
            curl -fsSL --retry 6 --retry-delay 2 "$SITE/$rel?asset_check=$GITHUB_RUN_ID" -o "$target"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$sha" || { echo "::error::Asset checksum mismatch $rel"; return 1; }
            echo "ASSET_VERIFIED $rel"
          }
          verify_asset 'shizunami-hourly/data/OM-2026.json' "$SHA_OM2026" 'OM-2026-verified.json'
          verify_asset 'shizunami-hourly/data/OM-2027.json' "$SHA_OM2027" 'OM-2027-verified.json'
          verify_asset 'shizunami-hourly/styles.css' "$SHA_CSS" 'styles-verified.css'
          verify_asset 'shizunami-hourly/app.js' "$SHA_APP" 'app-verified.js'
          verify_asset 'shizunami-hourly/adapter.js' "$SHA_ADAPTER" 'adapter-verified.js'
          verify_asset 'shizunami-hourly/index.html' "$SHA_INDEX" 'index-verified.html'

          # Switch only shizunami public HTML after six new assets are verified.
          curl -fsSL --retry 3 "$SITE/shizunami.html?switch_guard=$GITHUB_RUN_ID" -o "$D/switch-guard.html"
          cmp "$D/switch-guard.html" "$D/old-ftp.html"
          HTML_ATTEMPTED=1
          lftp <<LFTP_HTML
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "shizunami.html" -o "$FTP_ROOT/shizunami.html"
          bye
          LFTP_HTML
          curl -fsSL --retry 6 --retry-delay 2 "$SITE/shizunami.html?html_verify=$GITHUB_RUN_ID" -o "$D/new.html"
          test "$(sha256sum "$D/new.html" | cut -d' ' -f1)" = "$NEW_HTML"
          grep -Fq 'id="shizunami-windy"' "$D/new.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?common_verify=$GITHUB_RUN_ID" -o "$D/unchanged-common.js"
          test "$(sha256sum "$D/unchanged-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"
          trap - ERR
          echo 'SUCCESS: only shizunami HTML + six scoped hourly assets were deployed'
