name: Komatsu guarded full UI release (7 paths only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  komatsu-only:
    if: github.ref == 'refs/heads/ops/komatsu-full-release-20261126' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_ROOT: /kansai
      SITE: https://kansai.rss7.net
      OLD_HTML: 088525d634226699a6835c5cabc29a5552c754c3f8a2b775122c5521dc1ef0ea
      OLD_COMMON: 034ecc6cd950fbacf6b082336802f0d5fd9927bbd3bf962629e8fc56d44e09fd
      NEW_HTML: 5744864be4fbd11d1b9c58901abaa6d54b0deafca819542b170efc9577c59cca
      SHA_INDEX: a2a42f650b54951824ebac47230e8c07235c56e44b085d4a694616da68c39ce3
      SHA_CSS: 531331bdd5fb8c86e482a08366a7234426979d30f92a1076d52ed219043a8d5d
      SHA_ADAPTER: eb7446e0363083dc20f6e3e331297b5c59d8c366215a17ed32a4f9474dabcf31
      SHA_APP: 4ce29663499cad94a768e09f19647941f2e52593f4e2cfa6db9718e92607cad6
      SHA_KM2026: 74360341493128661324ab600fe7227899a850e7a88e6979e8881de5990dd0af
      SHA_KM2027: 49a3c64281f561176a2b12d05bcfd9240d70937dd4a7b7213c09c0adae388d1e

    steps:
      - name: Checkout exact reviewed commit (never deploy main)
        uses: actions/checkout@v4
        with:
          ref: 30d0634f214770b3df553534388ab55be24b8a40
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exactly seven deployment files and nine tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/komatsu-full-release-20261126'
          test "$FTP_HOST" = 'ftp.lolipop.jp' && test "$FTP_ROOT" = '/kansai'
          test "$SITE" = 'https://kansai.rss7.net'
          test "$(git rev-parse HEAD)" = '30d0634f214770b3df553534388ab55be24b8a40'
          test "$(sha256sum komatsu.html | cut -d' ' -f1)" = "$NEW_HTML"
          test "$(sha256sum komatsu-hourly/index.html | cut -d' ' -f1)" = "$SHA_INDEX"
          test "$(sha256sum komatsu-hourly/styles.css | cut -d' ' -f1)" = "$SHA_CSS"
          test "$(sha256sum komatsu-hourly/adapter.js | cut -d' ' -f1)" = "$SHA_ADAPTER"
          test "$(sha256sum komatsu-hourly/app.js | cut -d' ' -f1)" = "$SHA_APP"
          test "$(sha256sum komatsu-hourly/data/KM-2026.json | cut -d' ' -f1)" = "$SHA_KM2026"
          test "$(sha256sum komatsu-hourly/data/KM-2027.json | cut -d' ' -f1)" = "$SHA_KM2027"
          grep -Fq 'id="komatsu-windy"' komatsu.html
          grep -Fq 'komatsu-hourly/index.html?v=20261125-1' komatsu.html
          grep -Fq 'lat=34.091594&amp;lon=134.604825' komatsu.html
          node --check komatsu-hourly/adapter.js
          node --check komatsu-hourly/app.js
          node --test tests/komatsu-20261126.test.cjs
          echo 'SOURCE_GUARDS_OK: exactly Komatsu UI and KM tides'

      - name: Install explicit secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Compare current HTTPS/FTPS, verify no preexisting Komatsu hourly subtree
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          D="$RUNNER_TEMP/ks-komatsu-release"
          mkdir -p "$D"
          curl -fsSL --retry 3 "$SITE/komatsu.html?preflight=$GITHUB_RUN_ID" -o "$D/old-http.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?preflight=$GITHUB_RUN_ID" -o "$D/old-common.js"
          test "$(sha256sum "$D/old-http.html" | cut -d' ' -f1)" = "$OLD_HTML" || { echo '::error::Komatsu HTML changed; refusing upload'; exit 1; }
          test "$(sha256sum "$D/old-common.js" | cut -d' ' -f1)" = "$OLD_COMMON" || { echo '::error::Shared JS changed; refusing upload'; exit 1; }
          lftp <<LFTP_PREFLIGHT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          get "$FTP_ROOT/komatsu.html" -o "$D/old-ftp.html"
          cls -1 "$FTP_ROOT" > "$D/root-names.txt"
          bye
          LFTP_PREFLIGHT
          cmp "$D/old-http.html" "$D/old-ftp.html"
          if grep -Fq 'komatsu-hourly' "$D/root-names.txt"; then
            echo '::error::Komatsu hourly directory exists. Refusing to overwrite any previous files.'
            exit 1
          fi
          echo 'PRECHECK_OK: old page matches FTP, shared JS unchanged, hourly directory not present'

      - name: Preserve current Komatsu HTML backup before first write
        uses: actions/upload-artifact@v4
        with:
          name: ks-komatsu-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ks-komatsu-release/old-ftp.html
            ${{ runner.temp }}/ks-komatsu-release/old-common.js
          if-no-files-found: error
          retention-days: 14

      - name: Upload new six hourly assets first, verify each; switch HTML last
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          D="$RUNNER_TEMP/ks-komatsu-release"
          HTML_ATTEMPTED=0
          rollback() {
            status=$?
            trap - ERR
            set +e
            if [ "$HTML_ATTEMPTED" -eq 1 ]; then
              echo '::error::Deployment failed after HTML switch; restoring original HTML.'
              lftp <<LFTP_ROLLBACK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "$D/old-ftp.html" -o "$FTP_ROOT/komatsu.html"
          bye
          LFTP_ROLLBACK
              test $? -eq 0 || echo '::error::Automatic HTML restore failed; private backup artifact retained'
            fi
            echo '::warning::New /kansai/komatsu-hourly assets may remain isolated and unreferenced. No other spot was changed.'
            curl -fsSL --retry 2 "$SITE/komatsu.html?verify_restore=$GITHUB_RUN_ID" -o "$D/restored.html"
            test "$(sha256sum "$D/restored.html" | cut -d' ' -f1)" = "$OLD_HTML" || echo '::error::Rollback HTTPS does not match original'
            exit "$status"
          }
          trap rollback ERR
          curl -fsSL --retry 3 "$SITE/komatsu.html?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.html"
          cmp "$D/immediate.html" "$D/old-ftp.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate-common.js"
          test "$(sha256sum "$D/immediate-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"

          lftp <<LFTP_ASSETS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mkdir -p "$FTP_ROOT/komatsu-hourly/data"
          put "komatsu-hourly/data/KM-2026.json" -o "$FTP_ROOT/komatsu-hourly/data/KM-2026.json"
          put "komatsu-hourly/data/KM-2027.json" -o "$FTP_ROOT/komatsu-hourly/data/KM-2027.json"
          put "komatsu-hourly/styles.css" -o "$FTP_ROOT/komatsu-hourly/styles.css"
          put "komatsu-hourly/app.js" -o "$FTP_ROOT/komatsu-hourly/app.js"
          put "komatsu-hourly/adapter.js" -o "$FTP_ROOT/komatsu-hourly/adapter.js"
          put "komatsu-hourly/index.html" -o "$FTP_ROOT/komatsu-hourly/index.html"
          bye
          LFTP_ASSETS
          verify_asset() {
            local rel="$1" sha="$2" label="$3"
            local target="$D/$label"
            curl -fsSL --retry 6 --retry-delay 2 "$SITE/$rel?asset_check=$GITHUB_RUN_ID" -o "$target"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$sha" || { echo "::error::Asset checksum mismatch $rel"; return 1; }
            echo "ASSET_VERIFIED $rel"
          }
          verify_asset 'komatsu-hourly/data/KM-2026.json' "$SHA_KM2026" 'KM-2026-verified.json'
          verify_asset 'komatsu-hourly/data/KM-2027.json' "$SHA_KM2027" 'KM-2027-verified.json'
          verify_asset 'komatsu-hourly/styles.css' "$SHA_CSS" 'styles-verified.css'
          verify_asset 'komatsu-hourly/app.js' "$SHA_APP" 'app-verified.js'
          verify_asset 'komatsu-hourly/adapter.js' "$SHA_ADAPTER" 'adapter-verified.js'
          verify_asset 'komatsu-hourly/index.html' "$SHA_INDEX" 'index-verified.html'

          # Switch only Komatsu public HTML after six new assets are verified.
          curl -fsSL --retry 3 "$SITE/komatsu.html?switch_guard=$GITHUB_RUN_ID" -o "$D/switch-guard.html"
          cmp "$D/switch-guard.html" "$D/old-ftp.html"
          HTML_ATTEMPTED=1
          lftp <<LFTP_HTML
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "komatsu.html" -o "$FTP_ROOT/komatsu.html"
          bye
          LFTP_HTML
          curl -fsSL --retry 6 --retry-delay 2 "$SITE/komatsu.html?html_verify=$GITHUB_RUN_ID" -o "$D/new.html"
          test "$(sha256sum "$D/new.html" | cut -d' ' -f1)" = "$NEW_HTML"
          grep -Fq 'id="komatsu-windy"' "$D/new.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?common_verify=$GITHUB_RUN_ID" -o "$D/unchanged-common.js"
          test "$(sha256sum "$D/unchanged-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"
          trap - ERR
          echo 'SUCCESS: only Komatsu HTML + six scoped hourly assets were deployed'
