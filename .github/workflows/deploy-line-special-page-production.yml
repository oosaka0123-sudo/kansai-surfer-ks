name: Ikumi guarded full UI release (7 paths only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  ikumi-only:
    if: github.ref == 'refs/heads/ops/ikumi-full-release-20261126' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_ROOT: /kansai
      SITE: https://kansai.rss7.net
      OLD_HTML: 89018c433b14a7050c7610fa685193e7120cc8b0abdd968b90a7615430692606
      OLD_COMMON: 034ecc6cd950fbacf6b082336802f0d5fd9927bbd3bf962629e8fc56d44e09fd
      NEW_HTML: 194a07b184f98e9b2b2148b436cc8d8e5d53b1889ad9ff6ffd8305c3bb4a8d81
      SHA_INDEX: 557dd44040562fc7d44dec3f7f5bc508386c3926d03b06e0634784dd22d697c3
      SHA_CSS: 531331bdd5fb8c86e482a08366a7234426979d30f92a1076d52ed219043a8d5d
      SHA_ADAPTER: 423af9651f1475e0316ba6acbada5751ade0201a86cc17a809f2115129a43245
      SHA_APP: 373bc02de9142358867fe97e54f6829f69425e419e9ed801891b0c15d612c084
      SHA_L72026: 86be8e9a7d896de4b0eceef48e682c98e6015acc23bc88f6af89d619fd153b38
      SHA_L72027: 4e2f7734e9959620426c6f46530c528968cb37396c82188ada73bda2927470a1

    steps:
      - name: Checkout exact reviewed commit (never deploy main)
        uses: actions/checkout@v4
        with:
          ref: acfc86ff526fba2c34793e25e1485d9112936dd3
          persist-credentials: false

      - name: Validate exactly seven deployment files and six tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/ikumi-full-release-20261126'
          test "$FTP_HOST" = 'ftp.lolipop.jp' && test "$FTP_ROOT" = '/kansai'
          test "$SITE" = 'https://kansai.rss7.net'
          test "$(git rev-parse HEAD)" = 'acfc86ff526fba2c34793e25e1485d9112936dd3'
          test "$(sha256sum ikumi.html | cut -d' ' -f1)" = "$NEW_HTML"
          test "$(sha256sum ikumi-hourly/index.html | cut -d' ' -f1)" = "$SHA_INDEX"
          test "$(sha256sum ikumi-hourly/styles.css | cut -d' ' -f1)" = "$SHA_CSS"
          test "$(sha256sum ikumi-hourly/adapter.js | cut -d' ' -f1)" = "$SHA_ADAPTER"
          test "$(sha256sum ikumi-hourly/app.js | cut -d' ' -f1)" = "$SHA_APP"
          test "$(sha256sum ikumi-hourly/data/L7-2026.json | cut -d' ' -f1)" = "$SHA_L72026"
          test "$(sha256sum ikumi-hourly/data/L7-2027.json | cut -d' ' -f1)" = "$SHA_L72027"
          grep -Fq 'id="ikumi-windy"' ikumi.html
          grep -Fq 'ikumi-hourly/index.html?v=20261125-1' ikumi.html
          grep -Fq 'lat=33.52425&amp;lon=134.28453' ikumi.html
          node --check ikumi-hourly/adapter.js
          node --check ikumi-hourly/app.js
          node --test tests/ikumi-20261126.test.cjs
          echo 'SOURCE_GUARDS_OK: exactly Ikumi UI and L7 tides'

      - name: Install explicit secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Compare current HTTPS/FTPS, verify no preexisting Ikumi hourly subtree
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          D="$RUNNER_TEMP/ks-ikumi-release"
          mkdir -p "$D"
          curl -fsSL --retry 3 "$SITE/ikumi.html?preflight=$GITHUB_RUN_ID" -o "$D/old-http.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?preflight=$GITHUB_RUN_ID" -o "$D/old-common.js"
          test "$(sha256sum "$D/old-http.html" | cut -d' ' -f1)" = "$OLD_HTML" || { echo '::error::Ikumi HTML changed; refusing upload'; exit 1; }
          test "$(sha256sum "$D/old-common.js" | cut -d' ' -f1)" = "$OLD_COMMON" || { echo '::error::Shared JS changed; refusing upload'; exit 1; }
          lftp <<LFTP_PREFLIGHT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          get "$FTP_ROOT/ikumi.html" -o "$D/old-ftp.html"
          cls -1 "$FTP_ROOT" > "$D/root-names.txt"
          bye
          LFTP_PREFLIGHT
          cmp "$D/old-http.html" "$D/old-ftp.html"
          if grep -Fq 'ikumi-hourly' "$D/root-names.txt"; then
            echo '::error::Ikumi hourly directory exists. Refusing to overwrite any previous files.'
            exit 1
          fi
          echo 'PRECHECK_OK: old page matches FTP, shared JS unchanged, hourly directory not present'

      - name: Preserve current Ikumi HTML backup before first write
        uses: actions/upload-artifact@v4
        with:
          name: ks-ikumi-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ks-ikumi-release/old-ftp.html
            ${{ runner.temp }}/ks-ikumi-release/old-common.js
          if-no-files-found: error
          retention-days: 14

      - name: Upload new six hourly assets first, verify each; switch HTML last
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          D="$RUNNER_TEMP/ks-ikumi-release"
          HTML_ATTEMPTED=0
          rollback() {
            status=$?
            trap - ERR
            set +e
            if [ "$HTML_ATTEMPTED" -eq 1 ]; then
              echo '::error::Deployment failed after HTML switch; restoring original HTML.'
              lftp <<LFTP_ROLLBACK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "$D/old-ftp.html" -o "$FTP_ROOT/ikumi.html"
          bye
          LFTP_ROLLBACK
              test $? -eq 0 || echo '::error::Automatic HTML restore failed; private backup artifact retained'
            fi
            echo '::warning::New /kansai/ikumi-hourly assets may remain isolated and unreferenced. No other spot was changed.'
            curl -fsSL --retry 2 "$SITE/ikumi.html?verify_restore=$GITHUB_RUN_ID" -o "$D/restored.html"
            test "$(sha256sum "$D/restored.html" | cut -d' ' -f1)" = "$OLD_HTML" || echo '::error::Rollback HTTPS does not match original'
            exit "$status"
          }
          trap rollback ERR
          curl -fsSL --retry 3 "$SITE/ikumi.html?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.html"
          cmp "$D/immediate.html" "$D/old-ftp.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate-common.js"
          test "$(sha256sum "$D/immediate-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"

          lftp <<LFTP_ASSETS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mkdir -p "$FTP_ROOT/ikumi-hourly/data"
          put "ikumi-hourly/data/L7-2026.json" -o "$FTP_ROOT/ikumi-hourly/data/L7-2026.json"
          put "ikumi-hourly/data/L7-2027.json" -o "$FTP_ROOT/ikumi-hourly/data/L7-2027.json"
          put "ikumi-hourly/styles.css" -o "$FTP_ROOT/ikumi-hourly/styles.css"
          put "ikumi-hourly/app.js" -o "$FTP_ROOT/ikumi-hourly/app.js"
          put "ikumi-hourly/adapter.js" -o "$FTP_ROOT/ikumi-hourly/adapter.js"
          put "ikumi-hourly/index.html" -o "$FTP_ROOT/ikumi-hourly/index.html"
          bye
          LFTP_ASSETS
          verify_asset() {
            local rel="$1" sha="$2" label="$3"
            local target="$D/$label"
            curl -fsSL --retry 6 --retry-delay 2 "$SITE/$rel?asset_check=$GITHUB_RUN_ID" -o "$target"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$sha" || { echo "::error::Asset checksum mismatch $rel"; return 1; }
            echo "ASSET_VERIFIED $rel"
          }
          verify_asset 'ikumi-hourly/data/L7-2026.json' "$SHA_L72026" 'L7-2026-verified.json'
          verify_asset 'ikumi-hourly/data/L7-2027.json' "$SHA_L72027" 'L7-2027-verified.json'
          verify_asset 'ikumi-hourly/styles.css' "$SHA_CSS" 'styles-verified.css'
          verify_asset 'ikumi-hourly/app.js' "$SHA_APP" 'app-verified.js'
          verify_asset 'ikumi-hourly/adapter.js' "$SHA_ADAPTER" 'adapter-verified.js'
          verify_asset 'ikumi-hourly/index.html' "$SHA_INDEX" 'index-verified.html'

          # Switch only Ikumi public HTML after six new assets are verified.
          curl -fsSL --retry 3 "$SITE/ikumi.html?switch_guard=$GITHUB_RUN_ID" -o "$D/switch-guard.html"
          cmp "$D/switch-guard.html" "$D/old-ftp.html"
          HTML_ATTEMPTED=1
          lftp <<LFTP_HTML
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "ikumi.html" -o "$FTP_ROOT/ikumi.html"
          bye
          LFTP_HTML
          curl -fsSL --retry 6 --retry-delay 2 "$SITE/ikumi.html?html_verify=$GITHUB_RUN_ID" -o "$D/new.html"
          test "$(sha256sum "$D/new.html" | cut -d' ' -f1)" = "$NEW_HTML"
          grep -Fq 'id="ikumi-windy"' "$D/new.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?common_verify=$GITHUB_RUN_ID" -o "$D/unchanged-common.js"
          test "$(sha256sum "$D/unchanged-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"
          trap - ERR
          echo 'SUCCESS: only Ikumi HTML + six scoped hourly assets were deployed'
