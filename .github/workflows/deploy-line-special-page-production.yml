name: takahama guarded full UI release (7 paths only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  takahama-only:
    if: github.ref == 'refs/heads/ops/takahama-full-release-20261126' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_ROOT: /kansai
      SITE: https://kansai.rss7.net
      OLD_HTML: 69cf1ddffded8c0f87eeb340b9e8e71b5171b65a67a78ac0786b9a866740e293
      OLD_COMMON: 034ecc6cd950fbacf6b082336802f0d5fd9927bbd3bf962629e8fc56d44e09fd
      NEW_HTML: e478ac4d827a9cdba6d1ba715a8a95cfaf6df8927a2f88f2ac5b25692e38fcfb
      SHA_INDEX: 396e88f8feba9dd6d0786cd7d9fb2f8847be41b51e1ba42c39e06b2fc84be528
      SHA_CSS: 531331bdd5fb8c86e482a08366a7234426979d30f92a1076d52ed219043a8d5d
      SHA_ADAPTER: 0977e6a01a97fdb1864016179f417b7d1d9ce2704485eacb183804938f4c325c
      SHA_APP: f7a92f29c9a2b338271527eb99ac1209b36690ff720b2de27acc30a8ffdee201
      SHA_MZ2026: d49d34b2f8439f23612e9d0ed58ce532532a11f212e1c1caad19ce0715eac55d
      SHA_MZ2027: 59f4b0add0e505409cda0e89e4c7ff804ed24f3080f8c755c8782a0def54c0bd

    steps:
      - name: Checkout exact reviewed commit (never deploy main)
        uses: actions/checkout@v4
        with:
          ref: af2242c39f4937ecb200da8de4d3e97997585051
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exactly seven deployment files and twelve tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/takahama-full-release-20261126'
          test "$FTP_HOST" = 'ftp.lolipop.jp' && test "$FTP_ROOT" = '/kansai'
          test "$SITE" = 'https://kansai.rss7.net'
          test "$(git rev-parse HEAD)" = 'af2242c39f4937ecb200da8de4d3e97997585051'
          test "$(sha256sum takahama.html | cut -d' ' -f1)" = "$NEW_HTML"
          test "$(sha256sum takahama-hourly/index.html | cut -d' ' -f1)" = "$SHA_INDEX"
          test "$(sha256sum takahama-hourly/styles.css | cut -d' ' -f1)" = "$SHA_CSS"
          test "$(sha256sum takahama-hourly/adapter.js | cut -d' ' -f1)" = "$SHA_ADAPTER"
          test "$(sha256sum takahama-hourly/app.js | cut -d' ' -f1)" = "$SHA_APP"
          test "$(sha256sum takahama-hourly/data/MZ-2026.json | cut -d' ' -f1)" = "$SHA_MZ2026"
          test "$(sha256sum takahama-hourly/data/MZ-2027.json | cut -d' ' -f1)" = "$SHA_MZ2027"
          grep -Fq 'id="takahama-windy"' takahama.html
          grep -Fq 'takahama-hourly/index.html?v=20261126-3' takahama.html
          grep -Fq 'lat=35.49133&amp;lon=135.55782' takahama.html
          node --check takahama-hourly/adapter.js
          node --check takahama-hourly/app.js
          node --test tests/takahama-20261126.test.cjs
          echo 'SOURCE_GUARDS_OK: exactly takahama UI and MZ tides'

      - name: Install explicit secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Compare current HTTPS/FTPS, verify no preexisting takahama hourly subtree
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          D="$RUNNER_TEMP/ks-takahama-release"
          mkdir -p "$D"
          curl -fsSL --retry 3 "$SITE/takahama.html?preflight=$GITHUB_RUN_ID" -o "$D/old-http.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?preflight=$GITHUB_RUN_ID" -o "$D/old-common.js"
          test "$(sha256sum "$D/old-http.html" | cut -d' ' -f1)" = "$OLD_HTML" || { echo '::error::takahama HTML changed; refusing upload'; exit 1; }
          test "$(sha256sum "$D/old-common.js" | cut -d' ' -f1)" = "$OLD_COMMON" || { echo '::error::Shared JS changed; refusing upload'; exit 1; }
          lftp <<LFTP_PREFLIGHT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          get "$FTP_ROOT/takahama.html" -o "$D/old-ftp.html"
          cls -1 "$FTP_ROOT" > "$D/root-names.txt"
          bye
          LFTP_PREFLIGHT
          cmp "$D/old-http.html" "$D/old-ftp.html"
          if grep -Fq 'takahama-hourly' "$D/root-names.txt"; then
            echo '::error::takahama hourly directory exists. Refusing to overwrite any previous files.'
            exit 1
          fi
          echo 'PRECHECK_OK: old page matches FTP, shared JS unchanged, hourly directory not present'

      - name: Preserve current takahama HTML backup before first write
        uses: actions/upload-artifact@v4
        with:
          name: ks-takahama-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ks-takahama-release/old-ftp.html
            ${{ runner.temp }}/ks-takahama-release/old-common.js
          if-no-files-found: error
          retention-days: 14

      - name: Upload new six hourly assets first, verify each; switch HTML last
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          D="$RUNNER_TEMP/ks-takahama-release"
          HTML_ATTEMPTED=0
          rollback() {
            status=$?
            trap - ERR
            set +e
            if [ "$HTML_ATTEMPTED" -eq 1 ]; then
              echo '::error::Deployment failed after HTML switch; restoring original HTML.'
              lftp <<LFTP_ROLLBACK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "$D/old-ftp.html" -o "$FTP_ROOT/takahama.html"
          bye
          LFTP_ROLLBACK
              test $? -eq 0 || echo '::error::Automatic HTML restore failed; private backup artifact retained'
            fi
            echo '::warning::New /kansai/takahama-hourly assets may remain isolated and unreferenced. No other spot was changed.'
            curl -fsSL --retry 2 "$SITE/takahama.html?verify_restore=$GITHUB_RUN_ID" -o "$D/restored.html"
            test "$(sha256sum "$D/restored.html" | cut -d' ' -f1)" = "$OLD_HTML" || echo '::error::Rollback HTTPS does not match original'
            exit "$status"
          }
          trap rollback ERR
          curl -fsSL --retry 3 "$SITE/takahama.html?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.html"
          cmp "$D/immediate.html" "$D/old-ftp.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate-common.js"
          test "$(sha256sum "$D/immediate-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"

          lftp <<LFTP_ASSETS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mkdir -p "$FTP_ROOT/takahama-hourly/data"
          put "takahama-hourly/data/MZ-2026.json" -o "$FTP_ROOT/takahama-hourly/data/MZ-2026.json"
          put "takahama-hourly/data/MZ-2027.json" -o "$FTP_ROOT/takahama-hourly/data/MZ-2027.json"
          put "takahama-hourly/styles.css" -o "$FTP_ROOT/takahama-hourly/styles.css"
          put "takahama-hourly/app.js" -o "$FTP_ROOT/takahama-hourly/app.js"
          put "takahama-hourly/adapter.js" -o "$FTP_ROOT/takahama-hourly/adapter.js"
          put "takahama-hourly/index.html" -o "$FTP_ROOT/takahama-hourly/index.html"
          bye
          LFTP_ASSETS
          verify_asset() {
            local rel="$1" sha="$2" label="$3"
            local target="$D/$label"
            curl -fsSL --retry 6 --retry-delay 2 "$SITE/$rel?asset_check=$GITHUB_RUN_ID" -o "$target"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$sha" || { echo "::error::Asset checksum mismatch $rel"; return 1; }
            echo "ASSET_VERIFIED $rel"
          }
          verify_asset 'takahama-hourly/data/MZ-2026.json' "$SHA_MZ2026" 'MZ-2026-verified.json'
          verify_asset 'takahama-hourly/data/MZ-2027.json' "$SHA_MZ2027" 'MZ-2027-verified.json'
          verify_asset 'takahama-hourly/styles.css' "$SHA_CSS" 'styles-verified.css'
          verify_asset 'takahama-hourly/app.js' "$SHA_APP" 'app-verified.js'
          verify_asset 'takahama-hourly/adapter.js' "$SHA_ADAPTER" 'adapter-verified.js'
          verify_asset 'takahama-hourly/index.html' "$SHA_INDEX" 'index-verified.html'

          # Switch only takahama public HTML after six new assets are verified.
          curl -fsSL --retry 3 "$SITE/takahama.html?switch_guard=$GITHUB_RUN_ID" -o "$D/switch-guard.html"
          cmp "$D/switch-guard.html" "$D/old-ftp.html"
          HTML_ATTEMPTED=1
          lftp <<LFTP_HTML
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "takahama.html" -o "$FTP_ROOT/takahama.html"
          bye
          LFTP_HTML
          curl -fsSL --retry 6 --retry-delay 2 "$SITE/takahama.html?html_verify=$GITHUB_RUN_ID" -o "$D/new.html"
          test "$(sha256sum "$D/new.html" | cut -d' ' -f1)" = "$NEW_HTML"
          grep -Fq 'id="takahama-windy"' "$D/new.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?common_verify=$GITHUB_RUN_ID" -o "$D/unchanged-common.js"
          test "$(sha256sum "$D/unchanged-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"
          trap - ERR
          echo 'SUCCESS: only takahama HTML + six scoped hourly assets were deployed'
