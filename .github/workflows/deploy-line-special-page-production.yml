name: Guarded current-forecast safety release

on:
  workflow_dispatch:
    inputs:
      spot:
        description: Release a single spot, or the ordered nine-spot batch
        type: choice
        required: true
        default: isonoura
        options:
          - isonoura
          - kounohama
          - ikumi
          - komatsu
          - irago
          - shizunami
          - hamadutu
          - takahama
          - hakuto
          - all

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  guarded-unify:
    if: github.ref == 'refs/heads/ops/current-forecast-safety-168' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE: 799ac0a56dd46188b0871d7fc73484f2c565253f
      SPOT: ${{ inputs.spot }}
      SITE: https://kansai.rss7.net
      FTP_HOST: ftp.lolipop.jp
      FTP_ROOT: /kansai
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@v4
        with:
          ref: 799ac0a56dd46188b0871d7fc73484f2c565253f
          fetch-depth: 0
          persist-credentials: false
      - name: Validate all 116 regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mapfile -t tests < <(git diff --name-only 29f7c9e32b24659729f825379cfcf4a4f51cbec5 HEAD -- tests | grep '\.test\.cjs$')
          test "${#tests[@]}" -eq 16
          node --test "${tests[@]}"
          sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Validate paths and back up the selected current production files
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          cat > "$RUNNER_TEMP/ks-unify-guard.py" <<'PY'
          import os, sys, pathlib, hashlib, json, subprocess, time
          from pathlib import Path
          order = ['isonoura','kounohama','ikumi','komatsu','irago','shizunami','hamadutu','takahama','hakuto']
          codes = dict(zip(order, ['WY','TB','L7','KM','I4','OM','T6','MZ','ZE']))
          mode = sys.argv[1]
          spot = os.environ['SPOT']
          assert spot == 'all'
          selected = order if spot == 'all' else [spot]
          site = 'https://kansai.rss7.net'
          host = 'ftp.lolipop.jp'
          remote = '/kansai'
          assert os.environ['SITE'] == site and os.environ['FTP_HOST'] == host and os.environ['FTP_ROOT'] == remote
          user, password = os.environ['FTP_USER'], os.environ['FTP_PASS']
          assert user and password and not any(c in user+password for c in '\r\n\x00')
          backup = Path(os.environ['RUNNER_TEMP'])/'ks-unify-backup'
          backup.mkdir(exist_ok=True)
          manifest = json.loads(Path('docs/nine-spot-unification-release-manifest.json').read_text())
          assert manifest['version'] == 3 and set(manifest['spots']) == set(order)
          assert set(manifest['shared']) == {'nami_common.js'}
          def sha(b): return hashlib.sha256(b).hexdigest()
          def get_http(f):
              p = subprocess.run(['curl','-fsSL','--retry','3','--retry-delay','1','--max-time','20',site+'/'+f+'?unify='+os.environ['GITHUB_RUN_ID']+'-'+str(time.time_ns())],capture_output=True)
              if p.returncode: raise RuntimeError('HTTPS read failed: '+f)
              return p.stdout
          def q(v):
              return '"' + v.replace('\\','\\\\').replace('"','\\"').replace('$','\\$').replace('`','\\`') + '"'
          def ftp(commands):
              body = '\n'.join(['set cmd:fail-exit true','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true','set ftp:passive-mode true','set net:timeout 25','set net:max-retries 3','open -u '+q(user)+','+q(password)+' '+host]+commands+['bye',''])
              result = subprocess.run(['lftp'],input=body,text=True,capture_output=True)
              if result.returncode: raise RuntimeError('FTPS operation failed (credentials not printed)')
              return result.stdout
          def paths(s):
              prefix=s+'-hourly/'
              changed=(['nami_isonoura.js'] if s=='isonoura' else [])+[s+'.html']
              expected=set([s+'.html',prefix+'app.js',prefix+'adapter.js',prefix+'index.html',prefix+'styles.css',prefix+'data/'+codes[s]+'-2026.json',prefix+'data/'+codes[s]+'-2027.json'])
              if s=='isonoura': expected.update(['nami_isonoura.js','isonoura-beach-wave.js'])
              records=manifest['spots'][s]
              assert set(records)==expected
              assert {f for f,pair in records.items() if pair[0]!=pair[1]}==set(changed)
              for f,(old,new) in records.items():
                  assert len(old)==64 and len(new)==64
                  assert sha(Path(f).read_bytes())==new, 'source hash '+f
              return changed,records
          def shared():
              for f,digest in manifest['shared'].items():
                  assert sha(get_http(f))==digest,'shared changed '+f
          def check_http(records, version):
              for f,pair in records.items():
                  assert sha(get_http(f))==pair[version], 'live hash mismatch '+f
          newfile='nami_spot_current.js'
          assert set(manifest['dedicated']) == {newfile}
          old,new=manifest['dedicated'][newfile]
          assert old is None and len(new)==64 and sha(Path(newfile).read_bytes())==new
          def ensure_new_absent():
              entries=ftp(['cls -1 '+q(remote+'/')]).splitlines()
              assert entries and not any(Path(x.strip().rstrip('/')).name==newfile for x in entries),'new asset already exists'
              p=subprocess.run(['curl','-sS','--max-time','20','-o','/dev/null','-w','%{http_code}',site+'/'+newfile+'?preflight='+os.environ['GITHUB_RUN_ID']],capture_output=True,text=True)
              assert p.returncode==0 and p.stdout in ('404','410','500'),'new asset HTTPS preflight not absent'
          shared()
          if mode=='preflight':
              ensure_new_absent()
              for s in selected:
                  changed,records=paths(s)
                  check_http(records,0)
                  commands=[]
                  for f in changed:
                      dst=backup/f
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      commands.append('get '+q(remote+'/'+f)+' -o '+q(str(dst)))
                  ftp(commands)
                  for f in changed:
                      assert sha((backup/f).read_bytes())==records[f][0], 'FTP/HTTP old mismatch '+f
                  print('BACKUP_VERIFIED',s,flush=True)
          elif mode=='publish':
              ensure_new_absent()
              for s in selected:
                  changed,records=paths(s)
                  check_http(records,0)
                  for f in changed:
                      assert sha((backup/f).read_bytes())==records[f][0], 'backup mismatch '+f
              ftp(['put '+q(newfile)+' -o '+q(remote+'/'+newfile)])
              assert sha(get_http(newfile))==new,'new dedicated asset mismatch'
              print('NEW_DEDICATED_ASSET_VERIFIED',flush=True)
              for s in selected:
                  changed,records=paths(s)
                  shared()
                  check_http(records,0)
                  for f in changed:
                      assert sha((backup/f).read_bytes())==records[f][0], 'backup mismatch '+f
                  attempted=[]
                  try:
                      for f in changed:
                          attempted.append(f)
                          ftp(['put '+q(f)+' -o '+q(remote+'/'+f)])
                          assert sha(get_http(f))==records[f][1], 'new hash mismatch '+f
                      check_http(records,1)
                      shared()
                      assert sha(get_http(newfile))==new
                      print('RELEASE_VERIFIED',s,flush=True)
                  except Exception:
                      if attempted:
                          print('ROLLBACK',s,flush=True)
                          for f in changed:
                              ftp(['put '+q(str(backup/f))+' -o '+q(remote+'/'+f)])
                          check_http(records,0)
                          print('ROLLBACK_VERIFIED',s,flush=True)
                      raise
          else: raise RuntimeError('invalid mode')
          PY
          python3 "$RUNNER_TEMP/ks-unify-guard.py" preflight
      - name: Keep original files before any upload
        uses: actions/upload-artifact@v4
        with:
          name: ks-unify-original-${{ github.run_id }}
          path: ${{ runner.temp }}/ks-unify-backup/
          if-no-files-found: error
          retention-days: 14
      - name: Update only changed files per selected spot and verify each
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          python3 "$RUNNER_TEMP/ks-unify-guard.py" publish
