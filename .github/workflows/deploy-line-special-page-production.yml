name: Irago guarded full UI release (7 paths only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  irago-only:
    if: github.ref == 'refs/heads/ops/irago-full-release-20261126' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_ROOT: /kansai
      SITE: https://kansai.rss7.net
      OLD_HTML: cca3028cd74c6aa5adac38734ab4736ae706e2206c8740dc0ed3be217cf49e29
      OLD_COMMON: 034ecc6cd950fbacf6b082336802f0d5fd9927bbd3bf962629e8fc56d44e09fd
      NEW_HTML: 074f96143a1745d693c234ad5de53f236ac19f6ee420d5c901cc65e77aea5159
      SHA_INDEX: dddd557990aea456fade7e62e398450e4bb21d91c013a0065934bd1812ff5786
      SHA_CSS: 531331bdd5fb8c86e482a08366a7234426979d30f92a1076d52ed219043a8d5d
      SHA_ADAPTER: 2fd9ac41df3444e368880bad918045821d5eb736e6883f288dbd7a38c3993795
      SHA_APP: 73638a80ec9ac0bea7c88cd361fb9df9e39c662785bc08ae98eaee67edf4a7b9
      SHA_I42026: ffd37798f0348710d3d3f4a51bb7558d16003ec6c14ad7e39939ec42df0097dd
      SHA_I42027: 2cb40d0cbe9d7b1f62baa2fee114df1a4ef7c1794d6a5ef2d9842dab489eecc1

    steps:
      - name: Checkout exact reviewed commit (never deploy main)
        uses: actions/checkout@v4
        with:
          ref: eea3438dbd725a101f16b8369df79391a4c49c45
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exactly seven deployment files and nine tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/irago-full-release-20261126'
          test "$FTP_HOST" = 'ftp.lolipop.jp' && test "$FTP_ROOT" = '/kansai'
          test "$SITE" = 'https://kansai.rss7.net'
          test "$(git rev-parse HEAD)" = 'eea3438dbd725a101f16b8369df79391a4c49c45'
          test "$(sha256sum irago.html | cut -d' ' -f1)" = "$NEW_HTML"
          test "$(sha256sum irago-hourly/index.html | cut -d' ' -f1)" = "$SHA_INDEX"
          test "$(sha256sum irago-hourly/styles.css | cut -d' ' -f1)" = "$SHA_CSS"
          test "$(sha256sum irago-hourly/adapter.js | cut -d' ' -f1)" = "$SHA_ADAPTER"
          test "$(sha256sum irago-hourly/app.js | cut -d' ' -f1)" = "$SHA_APP"
          test "$(sha256sum irago-hourly/data/I4-2026.json | cut -d' ' -f1)" = "$SHA_I42026"
          test "$(sha256sum irago-hourly/data/I4-2027.json | cut -d' ' -f1)" = "$SHA_I42027"
          grep -Fq 'id="irago-windy"' irago.html
          grep -Fq 'irago-hourly/index.html?v=20261125-1' irago.html
          grep -Fq 'lat=34.613290&amp;lon=137.213273' irago.html
          node --check irago-hourly/adapter.js
          node --check irago-hourly/app.js
          node --test tests/irago-20261126.test.cjs
          echo 'SOURCE_GUARDS_OK: exactly Irago UI and I4 tides'

      - name: Install explicit secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Compare current HTTPS/FTPS, verify no preexisting Irago hourly subtree
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          D="$RUNNER_TEMP/ks-irago-release"
          mkdir -p "$D"
          curl -fsSL --retry 3 "$SITE/irago.html?preflight=$GITHUB_RUN_ID" -o "$D/old-http.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?preflight=$GITHUB_RUN_ID" -o "$D/old-common.js"
          test "$(sha256sum "$D/old-http.html" | cut -d' ' -f1)" = "$OLD_HTML" || { echo '::error::Irago HTML changed; refusing upload'; exit 1; }
          test "$(sha256sum "$D/old-common.js" | cut -d' ' -f1)" = "$OLD_COMMON" || { echo '::error::Shared JS changed; refusing upload'; exit 1; }
          lftp <<LFTP_PREFLIGHT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          get "$FTP_ROOT/irago.html" -o "$D/old-ftp.html"
          cls -1 "$FTP_ROOT" > "$D/root-names.txt"
          bye
          LFTP_PREFLIGHT
          cmp "$D/old-http.html" "$D/old-ftp.html"
          if grep -Fq 'irago-hourly' "$D/root-names.txt"; then
            echo '::error::Irago hourly directory exists. Refusing to overwrite any previous files.'
            exit 1
          fi
          echo 'PRECHECK_OK: old page matches FTP, shared JS unchanged, hourly directory not present'

      - name: Preserve current Irago HTML backup before first write
        uses: actions/upload-artifact@v4
        with:
          name: ks-irago-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ks-irago-release/old-ftp.html
            ${{ runner.temp }}/ks-irago-release/old-common.js
          if-no-files-found: error
          retention-days: 14

      - name: Upload new six hourly assets first, verify each; switch HTML last
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          D="$RUNNER_TEMP/ks-irago-release"
          HTML_ATTEMPTED=0
          rollback() {
            status=$?
            trap - ERR
            set +e
            if [ "$HTML_ATTEMPTED" -eq 1 ]; then
              echo '::error::Deployment failed after HTML switch; restoring original HTML.'
              lftp <<LFTP_ROLLBACK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "$D/old-ftp.html" -o "$FTP_ROOT/irago.html"
          bye
          LFTP_ROLLBACK
              test $? -eq 0 || echo '::error::Automatic HTML restore failed; private backup artifact retained'
            fi
            echo '::warning::New /kansai/irago-hourly assets may remain isolated and unreferenced. No other spot was changed.'
            curl -fsSL --retry 2 "$SITE/irago.html?verify_restore=$GITHUB_RUN_ID" -o "$D/restored.html"
            test "$(sha256sum "$D/restored.html" | cut -d' ' -f1)" = "$OLD_HTML" || echo '::error::Rollback HTTPS does not match original'
            exit "$status"
          }
          trap rollback ERR
          curl -fsSL --retry 3 "$SITE/irago.html?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.html"
          cmp "$D/immediate.html" "$D/old-ftp.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate-common.js"
          test "$(sha256sum "$D/immediate-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"

          lftp <<LFTP_ASSETS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mkdir -p "$FTP_ROOT/irago-hourly/data"
          put "irago-hourly/data/I4-2026.json" -o "$FTP_ROOT/irago-hourly/data/I4-2026.json"
          put "irago-hourly/data/I4-2027.json" -o "$FTP_ROOT/irago-hourly/data/I4-2027.json"
          put "irago-hourly/styles.css" -o "$FTP_ROOT/irago-hourly/styles.css"
          put "irago-hourly/app.js" -o "$FTP_ROOT/irago-hourly/app.js"
          put "irago-hourly/adapter.js" -o "$FTP_ROOT/irago-hourly/adapter.js"
          put "irago-hourly/index.html" -o "$FTP_ROOT/irago-hourly/index.html"
          bye
          LFTP_ASSETS
          verify_asset() {
            local rel="$1" sha="$2" label="$3"
            local target="$D/$label"
            curl -fsSL --retry 6 --retry-delay 2 "$SITE/$rel?asset_check=$GITHUB_RUN_ID" -o "$target"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$sha" || { echo "::error::Asset checksum mismatch $rel"; return 1; }
            echo "ASSET_VERIFIED $rel"
          }
          verify_asset 'irago-hourly/data/I4-2026.json' "$SHA_I42026" 'I4-2026-verified.json'
          verify_asset 'irago-hourly/data/I4-2027.json' "$SHA_I42027" 'I4-2027-verified.json'
          verify_asset 'irago-hourly/styles.css' "$SHA_CSS" 'styles-verified.css'
          verify_asset 'irago-hourly/app.js' "$SHA_APP" 'app-verified.js'
          verify_asset 'irago-hourly/adapter.js' "$SHA_ADAPTER" 'adapter-verified.js'
          verify_asset 'irago-hourly/index.html' "$SHA_INDEX" 'index-verified.html'

          # Switch only Irago public HTML after six new assets are verified.
          curl -fsSL --retry 3 "$SITE/irago.html?switch_guard=$GITHUB_RUN_ID" -o "$D/switch-guard.html"
          cmp "$D/switch-guard.html" "$D/old-ftp.html"
          HTML_ATTEMPTED=1
          lftp <<LFTP_HTML
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "irago.html" -o "$FTP_ROOT/irago.html"
          bye
          LFTP_HTML
          curl -fsSL --retry 6 --retry-delay 2 "$SITE/irago.html?html_verify=$GITHUB_RUN_ID" -o "$D/new.html"
          test "$(sha256sum "$D/new.html" | cut -d' ' -f1)" = "$NEW_HTML"
          grep -Fq 'id="irago-windy"' "$D/new.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?common_verify=$GITHUB_RUN_ID" -o "$D/unchanged-common.js"
          test "$(sha256sum "$D/unchanged-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"
          trap - ERR
          echo 'SUCCESS: only Irago HTML + six scoped hourly assets were deployed'
