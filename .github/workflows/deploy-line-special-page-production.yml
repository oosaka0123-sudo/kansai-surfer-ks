name: Kounohama guarded full UI release (7 paths only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  kounohama-only:
    if: github.ref == 'refs/heads/ops/kounohama-full-release-20261125' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_ROOT: /kansai
      SITE: https://kansai.rss7.net
      OLD_HTML: f23f1fdf7c05e2ae709644139565ca6c07b3330f8abb5092dd4faa51215fe675
      OLD_COMMON: 034ecc6cd950fbacf6b082336802f0d5fd9927bbd3bf962629e8fc56d44e09fd
      NEW_HTML: 2ba792ce6b1311be3f428424053fefeec5f16ad1bced2269ca3fc92310fc1f0c
      SHA_INDEX: 8cdafb2c8b89c50df0e89830d333a40f818ca9ada6a1438b84148044768d17ff
      SHA_CSS: 0db55514fd86b56c7d40f6317d2efa6643e961e1c9cef73772140e3d50500e68
      SHA_ADAPTER: 47c8a5639cf2d5183bbb9cc80bd6ae1147b410e56f6d30c06c50d987817a72bd
      SHA_APP: a4507a4ed4b29f39f3472d232194f289340ef21af05e8f4f22c24f7d895936c6
      SHA_TB2026: 627afaa59ae1af74e9b438409756741da4f8248ac0786adc96b0cfca8bf9fb92
      SHA_TB2027: 4ccec9f3a7e2ebfc331811f056bcde758fa1e398b02a02dedcd0bf7d8a5cfa03

    steps:
      - name: Checkout exact reviewed commit (never deploy main)
        uses: actions/checkout@v4
        with:
          ref: ec654ffe66e976e5551b08ababe49e98255a7687
          persist-credentials: false

      - name: Validate exactly seven deployment files and seven tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/kounohama-full-release-20261125'
          test "$FTP_HOST" = 'ftp.lolipop.jp' && test "$FTP_ROOT" = '/kansai'
          test "$SITE" = 'https://kansai.rss7.net'
          test "$(git rev-parse HEAD)" = 'ec654ffe66e976e5551b08ababe49e98255a7687'
          test "$(sha256sum kounohama.html | cut -d' ' -f1)" = "$NEW_HTML"
          test "$(sha256sum kounohama-hourly/index.html | cut -d' ' -f1)" = "$SHA_INDEX"
          test "$(sha256sum kounohama-hourly/styles.css | cut -d' ' -f1)" = "$SHA_CSS"
          test "$(sha256sum kounohama-hourly/adapter.js | cut -d' ' -f1)" = "$SHA_ADAPTER"
          test "$(sha256sum kounohama-hourly/app.js | cut -d' ' -f1)" = "$SHA_APP"
          test "$(sha256sum kounohama-hourly/data/TB-2026.json | cut -d' ' -f1)" = "$SHA_TB2026"
          test "$(sha256sum kounohama-hourly/data/TB-2027.json | cut -d' ' -f1)" = "$SHA_TB2027"
          grep -Fq 'id="kounohama-windy"' kounohama.html
          grep -Fq 'kounohama-hourly/index.html?v=20261125-1' kounohama.html
          grep -Fq 'lat=34.34&amp;lon=136.92' kounohama.html
          node --check kounohama-hourly/adapter.js
          node --check kounohama-hourly/app.js
          node --test tests/kounohama-20261125.test.cjs
          echo 'SOURCE_GUARDS_OK: exactly Kounohama UI and TB tides'

      - name: Install explicit secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Compare current HTTPS/FTPS, verify no preexisting Kounohama hourly subtree
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          D="$RUNNER_TEMP/ks-kounohama-release"
          mkdir -p "$D"
          curl -fsSL --retry 3 "$SITE/kounohama.html?preflight=$GITHUB_RUN_ID" -o "$D/old-http.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?preflight=$GITHUB_RUN_ID" -o "$D/old-common.js"
          test "$(sha256sum "$D/old-http.html" | cut -d' ' -f1)" = "$OLD_HTML" || { echo '::error::Kounohama HTML changed; refusing upload'; exit 1; }
          test "$(sha256sum "$D/old-common.js" | cut -d' ' -f1)" = "$OLD_COMMON" || { echo '::error::Shared JS changed; refusing upload'; exit 1; }
          lftp <<LFTP_PREFLIGHT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          get "$FTP_ROOT/kounohama.html" -o "$D/old-ftp.html"
          cls -1 "$FTP_ROOT" > "$D/root-names.txt"
          bye
          LFTP_PREFLIGHT
          cmp "$D/old-http.html" "$D/old-ftp.html"
          if grep -Fq 'kounohama-hourly' "$D/root-names.txt"; then
            echo '::error::Kounohama hourly directory exists. Refusing to overwrite any previous files.'
            exit 1
          fi
          echo 'PRECHECK_OK: old page matches FTP, shared JS unchanged, hourly directory not present'

      - name: Preserve current Kounohama HTML backup before first write
        uses: actions/upload-artifact@v4
        with:
          name: ks-kounohama-before-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ks-kounohama-release/old-ftp.html
            ${{ runner.temp }}/ks-kounohama-release/old-common.js
          if-no-files-found: error
          retention-days: 14

      - name: Upload new six hourly assets first, verify each; switch HTML last
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          D="$RUNNER_TEMP/ks-kounohama-release"
          HTML_ATTEMPTED=0
          rollback() {
            status=$?
            trap - ERR
            set +e
            if [ "$HTML_ATTEMPTED" -eq 1 ]; then
              echo '::error::Deployment failed after HTML switch; restoring original HTML.'
              lftp <<LFTP_ROLLBACK
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "$D/old-ftp.html" -o "$FTP_ROOT/kounohama.html"
          bye
          LFTP_ROLLBACK
              test $? -eq 0 || echo '::error::Automatic HTML restore failed; private backup artifact retained'
            fi
            echo '::warning::New /kansai/kounohama-hourly assets may remain isolated and unreferenced. No other spot was changed.'
            curl -fsSL --retry 2 "$SITE/kounohama.html?verify_restore=$GITHUB_RUN_ID" -o "$D/restored.html"
            test "$(sha256sum "$D/restored.html" | cut -d' ' -f1)" = "$OLD_HTML" || echo '::error::Rollback HTTPS does not match original'
            exit "$status"
          }
          trap rollback ERR
          curl -fsSL --retry 3 "$SITE/kounohama.html?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.html"
          cmp "$D/immediate.html" "$D/old-ftp.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate-common.js"
          test "$(sha256sum "$D/immediate-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"

          lftp <<LFTP_ASSETS
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mkdir -p "$FTP_ROOT/kounohama-hourly/data"
          put "kounohama-hourly/data/TB-2026.json" -o "$FTP_ROOT/kounohama-hourly/data/TB-2026.json"
          put "kounohama-hourly/data/TB-2027.json" -o "$FTP_ROOT/kounohama-hourly/data/TB-2027.json"
          put "kounohama-hourly/styles.css" -o "$FTP_ROOT/kounohama-hourly/styles.css"
          put "kounohama-hourly/app.js" -o "$FTP_ROOT/kounohama-hourly/app.js"
          put "kounohama-hourly/adapter.js" -o "$FTP_ROOT/kounohama-hourly/adapter.js"
          put "kounohama-hourly/index.html" -o "$FTP_ROOT/kounohama-hourly/index.html"
          bye
          LFTP_ASSETS
          verify_asset() {
            local rel="$1" sha="$2" label="$3"
            local target="$D/$label"
            curl -fsSL --retry 6 --retry-delay 2 "$SITE/$rel?asset_check=$GITHUB_RUN_ID" -o "$target"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$sha" || { echo "::error::Asset checksum mismatch $rel"; return 1; }
            echo "ASSET_VERIFIED $rel"
          }
          verify_asset 'kounohama-hourly/data/TB-2026.json' "$SHA_TB2026" 'TB-2026-verified.json'
          verify_asset 'kounohama-hourly/data/TB-2027.json' "$SHA_TB2027" 'TB-2027-verified.json'
          verify_asset 'kounohama-hourly/styles.css' "$SHA_CSS" 'styles-verified.css'
          verify_asset 'kounohama-hourly/app.js' "$SHA_APP" 'app-verified.js'
          verify_asset 'kounohama-hourly/adapter.js' "$SHA_ADAPTER" 'adapter-verified.js'
          verify_asset 'kounohama-hourly/index.html' "$SHA_INDEX" 'index-verified.html'

          # Switch only Kounohama public HTML after six new assets are verified.
          curl -fsSL --retry 3 "$SITE/kounohama.html?switch_guard=$GITHUB_RUN_ID" -o "$D/switch-guard.html"
          cmp "$D/switch-guard.html" "$D/old-ftp.html"
          HTML_ATTEMPTED=1
          lftp <<LFTP_HTML
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          put "kounohama.html" -o "$FTP_ROOT/kounohama.html"
          bye
          LFTP_HTML
          curl -fsSL --retry 6 --retry-delay 2 "$SITE/kounohama.html?html_verify=$GITHUB_RUN_ID" -o "$D/new.html"
          test "$(sha256sum "$D/new.html" | cut -d' ' -f1)" = "$NEW_HTML"
          grep -Fq 'id="kounohama-windy"' "$D/new.html"
          curl -fsSL --retry 3 "$SITE/nami_common.js?common_verify=$GITHUB_RUN_ID" -o "$D/unchanged-common.js"
          test "$(sha256sum "$D/unchanged-common.js" | cut -d' ' -f1)" = "$OLD_COMMON"
          trap - ERR
          echo 'SUCCESS: only Kounohama HTML + six scoped hourly assets were deployed'
