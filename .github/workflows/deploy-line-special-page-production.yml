name: Publish Isonoura beach wave estimate

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/ops/isonoura-beach-wave-20261125' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://kansai.rss7.net
      HOST: ftp.lolipop.jp
      ROOT: /kansai
      BASE: 0aa852598aed166928393a1c044ef0993337ada8
      RELEASE: a5a22ae46282ac5e6099ac2fcc22d22313d64ac9
    steps:
      - name: Check out the reviewed source and its live baseline
        uses: actions/checkout@v4
        with:
          ref: a5a22ae46282ac5e6099ac2fcc22d22313d64ac9
          fetch-depth: 2
          persist-credentials: false

      - name: Test the model and restrict the release to Isonoura
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          printf '%s\n' isonoura-beach-wave.js isonoura-hourly/adapter.js isonoura-hourly/app.js isonoura-hourly/index.html isonoura.html nami_isonoura.js tests/isonoura-beach-wave.test.cjs | sort > "$RUNNER_TEMP/expected"
          git diff --name-only "$BASE" "$RELEASE" | sort > "$RUNNER_TEMP/diff"
          cmp "$RUNNER_TEMP/expected" "$RUNNER_TEMP/diff"
          node --check isonoura-beach-wave.js
          node --check nami_isonoura.js
          node --check isonoura-hourly/adapter.js
          node --check isonoura-hourly/app.js
          node --test tests/isonoura-beach-wave.test.cjs

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Verify the existing production files and save backups
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test "$SITE" = 'https://kansai.rss7.net'
          test "$HOST" = 'ftp.lolipop.jp'
          test "$ROOT" = '/kansai'
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          backup="$RUNNER_TEMP/ks-isonoura-backup"
          mkdir -p "$backup/isonoura-hourly"
          lftp <<FTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:timeout 25
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" "$HOST"
          cls -1 "$ROOT" > "$RUNNER_TEMP/site-files"
          get "$ROOT/isonoura.html" -o "$backup/isonoura.html"
          get "$ROOT/nami_isonoura.js" -o "$backup/nami_isonoura.js"
          get "$ROOT/isonoura-hourly/index.html" -o "$backup/isonoura-hourly/index.html"
          get "$ROOT/isonoura-hourly/adapter.js" -o "$backup/isonoura-hourly/adapter.js"
          get "$ROOT/isonoura-hourly/app.js" -o "$backup/isonoura-hourly/app.js"
          bye
          FTP
          if grep -Eq '(^|/)isonoura-beach-wave[.]js$' "$RUNNER_TEMP/site-files"; then
            echo "::error::Isonoura helper already exists. Review the deployed baseline."
            exit 1
          fi
          for file in isonoura.html nami_isonoura.js isonoura-hourly/{index.html,adapter.js,app.js}; do
            git show "$BASE:$file" | cmp - "$backup/$file"
            curl -fsSL --retry 3 --max-time 20 "$SITE/$file?ks_preflight=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live"
            cmp "$RUNNER_TEMP/live" "$backup/$file"
          done

      - name: Keep the verified originals for recovery
        uses: actions/upload-artifact@v4
        with:
          name: isonoura-before-beach-estimate-${{ github.run_id }}
          path: ${{ runner.temp }}/ks-isonoura-backup
          retention-days: 14
          if-no-files-found: error

      - name: Publish and verify the six Isonoura files
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          backup="$RUNNER_TEMP/ks-isonoura-backup"
          mkdir -p "$RUNNER_TEMP/immediate/isonoura-hourly" "$RUNNER_TEMP/uploaded/isonoura-hourly"
          done_files=()
          ftps() {
            lftp <<FTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:timeout 25
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" "$HOST"
          $1
          bye
          FTP
          }
          rollback() {
            code=$?
            trap - ERR
            set +e
            for ((i=${#done_files[@]}-1; i>=0; i--)); do
              file="${done_files[i]}"
              if [ -f "$backup/$file" ]; then
                ftps "put \"$backup/$file\" -o \"$ROOT/$file\"" || echo "::error::Restore failed for $file"
              else
                ftps "rm \"$ROOT/$file\"" || echo "::warning::Could not remove newly added Isonoura helper"
              fi
            done
            exit "$code"
          }
          for file in isonoura.html nami_isonoura.js isonoura-hourly/{index.html,adapter.js,app.js}; do
            ftps "get \"$ROOT/$file\" -o \"$RUNNER_TEMP/immediate/$file\""
            cmp "$RUNNER_TEMP/immediate/$file" "$backup/$file"
          done
          trap rollback ERR
          for file in isonoura-beach-wave.js isonoura-hourly/app.js isonoura-hourly/adapter.js isonoura-hourly/index.html nami_isonoura.js isonoura.html; do
            done_files+=("$file")
            ftps "put \"$file\" -o \"$ROOT/$file\""
            ftps "get \"$ROOT/$file\" -o \"$RUNNER_TEMP/uploaded/$file\""
            cmp "$file" "$RUNNER_TEMP/uploaded/$file"
            curl -fsSL --retry 4 --max-time 25 "$SITE/$file?ks_beach=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/public"
            cmp "$file" "$RUNNER_TEMP/public"
          done
          trap - ERR
          echo 'Verified Isonoura: six production files match the reviewed commit over FTPS and HTTPS.'
