name: Isonoura Windy and feature relocation - one-file guarded deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  isonoura-html-only:
    if: github.ref == 'refs/heads/ops/isonoura-windy-layout-20261125' && github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: ftp.lolipop.jp
      ROOT: /kansai
      SITE: https://kansai.rss7.net
      BASE_SHA: 5dde51ea84cd6d31f2c20196ea671389b4a2e7efab0e45f7a591825d455b0192
      NEW_SHA: 64c29bce8e86968e3a665fe4ca039f8a15f70643588c7db99c4f0a6685ea5a6d
      ISONOURA_JS_SHA: 0974d36653095953d641003868bccc3afeb6dcfa1eea3cc8a602de53fe8690b2
      COMMON_SHA: 034ecc6cd950fbacf6b082336802f0d5fd9927bbd3bf962629e8fc56d44e09fd
    steps:
      - name: Checkout exact reviewed commit (no main merge)
        uses: actions/checkout@v4
        with:
          ref: 250a4d9131da0351c48bfcf6c7a99a18d4427935
          persist-credentials: false

      - name: Verify exact source and only two layout adjustments
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/isonoura-windy-layout-20261125'
          test "$HOST" = 'ftp.lolipop.jp'
          test "$ROOT" = '/kansai'
          test "$SITE" = 'https://kansai.rss7.net'
          test "$(git rev-parse HEAD)" = '250a4d9131da0351c48bfcf6c7a99a18d4427935'
          test "$(sha256sum isonoura.html | cut -d' ' -f1)" = "$NEW_SHA"
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const s=fs.readFileSync('isonoura.html','utf8');
          assert.equal((s.match(/id="ks10-forecast"/g)||[]).length,1);
          assert.equal((s.match(/id="isonoura-windy"/g)||[]).length,1);
          assert.equal((s.match(/class="context-call"/g)||[]).length,1);
          assert.equal((s.match(/<span class="no">08<\/span>/g)||[]).length,1);
          const a=s.indexOf('id="ks10-forecast"'),b=s.indexOf('id="isonoura-windy"'),c=s.indexOf('class="context-call"'),d=s.indexOf('<span class="no">08</span>');
          assert(a>=0&&a<b&&b<c&&c<d);
          assert(s.includes('https://embed.windy.com/embed2.html?lat=34.18'));
          assert(s.includes('src="nami_isonoura.js?v=20261125-1"'));
          assert(s.includes('src="isonoura-beach-wave.js?v=20261125-1"'));
          console.log('LAYOUT_SOURCE_GUARD_OK');
          NODE

      - name: Install explicit FTPS
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Verify HTTP and FTP source identity; prepare private rollback
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          D="$RUNNER_TEMP/isonoura-windy-rollback"
          mkdir -p "$D"
          curl -fsSL --retry 3 "$SITE/isonoura.html?release_preflight=$GITHUB_RUN_ID" -o "$D/http-before.html"
          curl -fsSL --retry 3 "$SITE/nami_isonoura.js?release_preflight=$GITHUB_RUN_ID" -o "$D/site-before.js"
          curl -fsSL --retry 3 "$SITE/nami_common.js?release_preflight=$GITHUB_RUN_ID" -o "$D/common-before.js"
          test "$(sha256sum "$D/http-before.html" | cut -d' ' -f1)" = "$BASE_SHA" || { echo '::error::Production HTML changed, refusing deploy'; exit 1; }
          test "$(sha256sum "$D/site-before.js" | cut -d' ' -f1)" = "$ISONOURA_JS_SHA" || { echo '::error::Dedicated JS changed, refusing deploy'; exit 1; }
          test "$(sha256sum "$D/common-before.js" | cut -d' ' -f1)" = "$COMMON_SHA" || { echo '::error::Shared JS changed, refusing deploy'; exit 1; }
          lftp <<LFTP_PREFLIGHT
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$HOST"
          get "$ROOT/isonoura.html" -o "$D/ftp-before.html"
          bye
          LFTP_PREFLIGHT
          cmp "$D/http-before.html" "$D/ftp-before.html"
          test "$(sha256sum "$D/ftp-before.html" | cut -d' ' -f1)" = "$BASE_SHA"
          echo 'PREFLIGHT_OK: FTP and HTTPS equal, dedicated and shared JS unchanged'

      - name: Back up Isonoura HTML before first write
        uses: actions/upload-artifact@v4
        with:
          name: ks-isonoura-windy-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/isonoura-windy-rollback/ftp-before.html
            ${{ runner.temp }}/isonoura-windy-rollback/site-before.js
          retention-days: 14
          if-no-files-found: error

      - name: Upload ONLY /kansai/isonoura.html with automatic rollback
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          D="$RUNNER_TEMP/isonoura-windy-rollback"
          ATTEMPTED=0
          rollback() {
            status=$?
            trap - ERR
            set +e
            echo '::error::One-file update failed; rolling back Isonoura HTML'
            if [ "$ATTEMPTED" -eq 1 ]; then
              lftp <<LFTP_RESTORE
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$HOST"
          put "$D/ftp-before.html" -o "$ROOT/isonoura.html"
          bye
          LFTP_RESTORE
              test $? -eq 0 || echo '::error::Automatic rollback failed; private artifact retained'
            fi
            curl -fsSL --retry 2 "$SITE/isonoura.html?rollback=$GITHUB_RUN_ID" -o "$D/http-rollback.html"
            test "$(sha256sum "$D/http-rollback.html" | cut -d' ' -f1)" = "$BASE_SHA" || echo '::error::Rollback HTTP SHA mismatch'
            exit "$status"
          }
          trap rollback ERR
          curl -fsSL --retry 3 "$SITE/isonoura.html?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.html"
          cmp "$D/immediate.html" "$D/ftp-before.html"
          curl -fsSL --retry 3 "$SITE/nami_isonoura.js?immediate_before=$GITHUB_RUN_ID" -o "$D/immediate.js"
          test "$(sha256sum "$D/immediate.js" | cut -d' ' -f1)" = "$ISONOURA_JS_SHA"

          ATTEMPTED=1
          lftp <<LFTP_UPLOAD
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" "$HOST"
          put "isonoura.html" -o "$ROOT/isonoura.html"
          bye
          LFTP_UPLOAD

          curl -fsSL --retry 6 --retry-delay 2 "$SITE/isonoura.html?release_after=$GITHUB_RUN_ID" -o "$D/http-after.html"
          test "$(sha256sum "$D/http-after.html" | cut -d' ' -f1)" = "$NEW_SHA"
          grep -Fq 'id="isonoura-windy"' "$D/http-after.html"
          grep -Fq '<span class="no">08</span>' "$D/http-after.html"
          curl -fsSL --retry 3 "$SITE/nami_isonoura.js?unchanged_after=$GITHUB_RUN_ID" -o "$D/site-after.js"
          curl -fsSL --retry 3 "$SITE/nami_common.js?unchanged_after=$GITHUB_RUN_ID" -o "$D/common-after.js"
          test "$(sha256sum "$D/site-after.js" | cut -d' ' -f1)" = "$ISONOURA_JS_SHA"
          test "$(sha256sum "$D/common-after.js" | cut -d' ' -f1)" = "$COMMON_SHA"
          trap - ERR
          echo 'SUCCESS: ONLY Isonoura HTML updated and verified'
