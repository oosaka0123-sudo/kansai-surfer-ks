name: Read-only KS blog article diagnosis 20261119
on:
  push:
    branches: [audit/ks-blog-individual-error-20261119]
    paths: [.github/workflows/ks-blog-diagnostic-20261119.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect related-blog JSON slug consistency and individual article HTTP results
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from html.parser import HTMLParser
          from collections import Counter
          import json
          BASE='https://kansai.rss7.net'
          def retrieve(path):
            req=Request(BASE+path,headers={'User-Agent':'KS-readonly-blog-link-check/1.0'})
            with urlopen(req,timeout=25) as r: return r.read().decode('utf-8','replace')
          class Links(HTMLParser):
            def __init__(self): super().__init__(); self.links=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='a' and a.get('href'): self.links.append(a['href'])
          articles=json.loads(retrieve('/blog/articles.json'))
          print('JSON_COUNT',len(articles),'TYPE',type(articles).__name__)
          html=retrieve('/blog/index.php')
          parser=Links(); parser.feed(html)
          in_index=set(x.removeprefix('posts/') for x in parser.links if x.startswith('posts/'))
          print('INDEX_FILES',len(in_index))
          for i,a in enumerate(articles[:6]):
            print('JSON_SAMPLE',i,repr(str(a.get('title',''))[:50]),repr(str(a.get('slug',''))[:90]),repr(a.get('status')),repr(a.get('region')),repr(a.get('category')))
          slugs=Counter(str(a.get('slug','')) for a in articles)
          titles=Counter(str(a.get('title','')) for a in articles)
          print('DUP_SLUGS',[(k,v) for k,v in slugs.items() if v>1][:20])
          print('DUP_TITLES',[(k,v) for k,v in titles.items() if v>1][:12])
          chosen=[]
          for i,a in enumerate(articles):
            title=str(a.get('title',''))
            region=str(a.get('region',''))
            if i<18 or any(x in title for x in ['ビーチホッピング','東洋町','白浜海水浴場']) or (region in ['生見','白兎','鳥取'] and len(chosen)<40):
              slug=str(a.get('slug',''))
              if slug and slug not in [y[0] for y in chosen]: chosen.append((slug,title,region))
          for slug,title,region in chosen[:58]:
            path='/blog/posts/'+quote(slug,safe='-_.~')+'.php'
            try:
              with urlopen(Request(BASE+path,headers={'User-Agent':'KS-readonly-blog-link-check/1.0'}),timeout=15) as r:
                status=r.status
            except HTTPError as e: status=e.code
            except Exception as e: status=type(e).__name__
            in_listing=(slug+'.php' in in_index)
            print('ARTICLE',status,'in_listing='+str(in_listing),'region='+region,'slug='+slug[:95],'TITLE='+title[:50])
          print('TOTAL_TESTED',min(len(chosen),58))
          PY
