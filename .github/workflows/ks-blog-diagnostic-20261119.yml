name: Read-only KS blog article diagnosis 20261119
on:
  push:
    branches: [audit/ks-blog-individual-error-20261119]
    paths: [.github/workflows/ks-blog-diagnostic-20261119.yml]
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect mobile-related layout and navigation code on blog posts
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          from html.parser import HTMLParser
          BASE='https://kansai.rss7.net'
          def get(p):
            with urlopen(Request(BASE+p,headers={'User-Agent':'KS-Blog-Mobile-Audit/1.0'}),timeout=25) as r:
              return r.read().decode('utf-8','replace')
          arts=json.loads(get('/blog/articles.json'))
          targets=arts[:2]+[a for a in arts if a.get('region')=='生見' or a.get('category')=='ニュース'][:10]
          seen=set()
          for a in targets:
            slug=str(a['slug'])
            if slug in seen: continue
            seen.add(slug)
            p='/blog/posts/'+quote(slug,safe='-_.~')+'.php'
            h=get(p)
            print('PAGE',slug,'length',len(h),'TITLE',str(a.get('title',''))[:70])
            matches=list(re.finditer('RELATED|関連ブログ|最新の記事|related-blog',h,re.I))
            print('RELATED_MARKERS',len(matches))
            for m in matches[:5]:
              print('RELATED_CONTEXT',re.sub(r'\s+',' ',h[max(0,m.start()-500):m.start()+1000])[:1350])
            links=re.findall(r'<link\b[^>]*rel=["\']stylesheet["\'][^>]*>',h,re.I)
            print('STYLESHEETS',links[:10])
            for m in re.finditer(r'grid-template-columns\s*:\s*[^;}]+',h,re.I):
              print('GRID_CSS',re.sub(r'\s+',' ',h[max(0,m.start()-150):m.end()+70])[:450])
            print('SCRIPT_SRCS',re.findall(r'<script\b[^>]*src=["\']([^"\']+)',h,re.I)[:12])
            print('SCROLL_JS',bool(re.search(r'scrollRestoration|scrollTo|scrollIntoView|pageshow',h,re.I)))
          PY
