name: Read-only KS blog article diagnosis 20261119
on:
  push:
    branches: [audit/ks-blog-individual-error-20261119]
    paths: [.github/workflows/ks-blog-diagnostic-20261119.yml]
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Chrome and install Puppeteer controller
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "Chrome not installed; no browser verification possible"; exit 1; }
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ks-puppeteer"
          npm install --prefix "$RUNNER_TEMP/ks-puppeteer" puppeteer-core@24 --no-audit --no-fund --silent
      - name: Verify related cards one column on mobile, image valid and desktop intact
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/blog-mobile-check.js" <<'JS'
          const puppeteer=require(process.env.RUNNER_TEMP+'/ks-puppeteer/node_modules/puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-gpu']});
            const slug='2026-09-03-112458-台風24号-迷走の可能性-四国-近畿-東海は大雨-高波に警戒';
            const url='https://kansai.rss7.net/blog/posts/'+encodeURIComponent(slug)+'.php';
            for (const width of [390,600,900,1280]) {
              const page=await browser.newPage();
              await page.setViewport({width,height:900,deviceScaleFactor:1,isMobile:width<640});
              const response=await page.goto(url,{waitUntil:'networkidle2',timeout:40000});
              const result=await page.evaluate(()=>{
                const grid=document.querySelector('.related-posts .related-grid');
                if(!grid) return {error:'related grid not found'};
                const a=[...grid.querySelectorAll('a.blog-card')];
                const rects=a.slice(0,2).map(e=>{const r=e.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width)}});
                const im=grid.querySelector('img[src*="noimage.jpg"]');
                return{gridComputed:getComputedStyle(grid).gridTemplateColumns,cardCount:a.length,rects,titleFont:a[0]?getComputedStyle(a[0].querySelector('h3')).fontSize:'none',image:im?{loaded:im.complete,naturalWidth:im.naturalWidth}:null};
              });
              const sameColumn=result.rects?.length>1&&Math.abs(result.rects[0].x-result.rects[1].x)<3&&result.rects[1].y>result.rects[0].y;
              const good=width<=600 ? sameColumn : true;
              console.log(JSON.stringify({width,http:response.status(),sameColumn,good,...result}));
              if(response.status()!==200||!good||width===390&&result.image&&(!result.image.loaded||!result.image.naturalWidth)){
                await browser.close();
                process.exit(1);
              }
              await page.close();
            }
            await browser.close();
            console.log('MOBILE_CHROME_CHECK_SUCCESS');
          })().catch(e=>{console.error('SMOKE_ERR',e.message);process.exit(1)});
          JS
          node "$RUNNER_TEMP/blog-mobile-check.js"
