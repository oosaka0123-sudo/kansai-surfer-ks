name: Read-only KS blog article diagnosis 20261119
on:
  push:
    branches: [audit/ks-blog-individual-error-20261119]
    paths: [.github/workflows/ks-blog-diagnostic-20261119.yml]
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect blog mobile CSS and related card fallbacks read-only
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          import re
          BASE='https://kansai.rss7.net'
          for path in ['/blog/blog_cms.css?v=999','/nami_common.css?v=1018']:
            try:
              with urlopen(Request(BASE+path,headers={'User-Agent':'KS-blog-CSS-audit/1.0'}),timeout=25) as r:
                css=r.read().decode('utf-8','replace')
                print('CSS',path,'status',r.status,'size',len(css))
              for needle in ['.blog-grid','.related-grid','.related-card','.blog-card','.blog-thumb','.blog-card-body','.blog-meta','.blog-badge','@media','h3']:
                matches=[(m.start(),css[max(0,m.start()-80):m.start()+450]) for m in re.finditer(re.escape(needle),css,re.I)]
                print('SELECTOR',needle,'count',len(matches))
                for i,snip in matches[:7]:
                  print('CSS_MATCH',needle,i,re.sub(r'\s+',' ',snip)[:500])
            except Exception as e: print('CSS_ERR',path,type(e).__name__,str(e)[:120])
          for path in ['/blog/img/noimage.jpg','/blog/img/noimage.png']:
            try:
              with urlopen(Request(BASE+path,headers={'User-Agent':'KS-blog-CSS-audit/1.0'}),timeout=15) as r: print('IMAGE',path,r.status,r.headers.get('content-type'),r.headers.get('content-length'))
            except HTTPError as e: print('IMAGE',path,e.code)
          PY
