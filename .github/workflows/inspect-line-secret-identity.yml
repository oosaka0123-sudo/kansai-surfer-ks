name: Inspect LINE secret identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect configured LINE bot identity safely
        shell: bash
        env:
          TOKEN: ${{ secrets.KS_LINE_BOT_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$TOKEN" ]; then
            echo 'token_configured=no'
            exit 0
          fi
          echo 'token_configured=yes'
          INFO="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" https://api.line.me/v2/bot/info)"
          INFO="$INFO" php -r '$d=json_decode(getenv("INFO"),true); echo "displayName=".($d["displayName"]??"").PHP_EOL; echo "basicId=".($d["basicId"]??"").PHP_EOL;'
