name: Run footer sync once
on:
  push:
    paths:
      - '.github/workflows/run-footer-sync-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch footer-only sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run unify-production-footer-from-line.yml --ref main
