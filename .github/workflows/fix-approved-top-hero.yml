name: Fix approved Top Hero on redesign branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  fix-top-hero:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.user.type != 'Bot' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@fix-approved-top-hero')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: feat/top-isonoura-production-redesign
          fetch-depth: 0

      - name: Apply approved dark-upper photo-lower Hero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_pattern = re.compile(
              r'/\* ---- Hero: full/near-full viewport photo \+ HTML/CSS text overlay ---- \*/.*?(?=/\* ---- Lightweight reveal-on-scroll)',
              re.S,
          )
          if not css_pattern.search(s):
              raise SystemExit('Expected old Hero CSS block not found; refusing broad rewrite.')

          css = r'''/* ---- Hero: approved dark-upper / photo-lower composition ---- */
          .site-header-fixed .top-bar {
            background: rgba(6, 18, 28, 0.96);
            border-bottom-color: rgba(242,234,217,0.12);
          }
          .site-header-fixed .top-strip { display: none; }
          .site-header-fixed .logo img { height: 54px !important; width: auto !important; }
          .site-header-fixed .logo .en {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 300;
            letter-spacing: .035em;
          }
          .top-hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            grid-template-rows: minmax(58svh, auto) 42svh;
            padding: 0;
            text-align: left;
            background: #06121c;
            border-bottom: none;
          }
          .hero-copy {
            grid-row: 1;
            position: relative;
            z-index: 2;
            align-self: end;
            width: min(100%, 1240px);
            max-width: none;
            margin: 0 auto;
            padding: clamp(150px, 17svh, 205px) clamp(28px, 6vw, 82px) clamp(28px, 4.5svh, 50px);
            box-sizing: border-box;
          }
          .hero-script {
            position: absolute;
            top: clamp(112px, 12svh, 150px);
            right: clamp(30px, 7vw, 96px);
            margin: 0;
            color: rgba(245,240,232,.12);
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 300;
            font-size: clamp(1.05rem, 2.1vw, 1.9rem);
            letter-spacing: .03em;
            white-space: nowrap;
            pointer-events: none;
          }
          .hero-kicker {
            margin: 0 0 14px;
            color: rgba(245,240,232,.78);
            font-family: 'Noto Sans JP', sans-serif;
            font-size: clamp(.74rem, 1.05vw, .9rem);
            font-weight: 400;
            letter-spacing: .13em;
          }
          #top-hero-title {
            width: 100%;
            max-width: 900px;
            margin: 0;
            color: var(--cream, #f5f0e8);
            font-family: 'Shippori Mincho B1', serif;
            font-size: clamp(2rem, 4.2vw, 3.9rem);
            font-weight: 400;
            line-height: 1.42;
            letter-spacing: .012em;
            white-space: normal !important;
            overflow-wrap: anywhere;
            word-break: normal;
            text-shadow: none;
          }
          .top-hero .subtitle {
            margin-top: 17px;
            color: var(--teal-pale, #9bd4cf);
            font-size: clamp(.9rem, 1.4vw, 1.08rem);
            font-weight: 500;
            line-height: 1.65;
            letter-spacing: .035em;
            text-shadow: none;
          }
          .top-hero .lead {
            max-width: 760px;
            margin: 12px 0 0;
            color: rgba(245,240,232,.72);
            font-size: clamp(.8rem, 1.1vw, .96rem);
            line-height: 1.82;
            text-shadow: none;
          }
          .hero-media {
            grid-row: 2;
            position: relative;
            inset: auto;
            z-index: 1;
            min-height: 42svh;
            overflow: hidden;
            background: #06121c;
          }
          .hero-media picture,
          .hero-media img { width: 100%; height: 100%; display: block; }
          .hero-media img {
            object-fit: cover;
            object-position: 44% 42%;
            transform: scale(1.015);
          }
          .hero-media-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #06121c 0%, rgba(6,18,28,.46) 11%, rgba(6,18,28,.03) 34%, rgba(6,18,28,.06) 72%, rgba(6,18,28,.36) 100%);
            pointer-events: none;
          }
          .hero-scroll, .hero-mantra {
            position: absolute;
            z-index: 2;
            bottom: 16px;
            color: rgba(255,255,255,.74);
            font-family: 'JetBrains Mono', monospace;
            font-size: .64rem;
            letter-spacing: .18em;
            text-transform: uppercase;
          }
          .hero-scroll { left: clamp(22px, 4vw, 60px); writing-mode: vertical-rl; transform: rotate(180deg); }
          .hero-mantra { right: clamp(22px, 4vw, 60px); }
          @media (max-width: 760px) {
            .site-header-fixed .top-bar { padding: 10px 16px; min-height: 76px; box-sizing: border-box; }
            .site-header-fixed .logo { min-width: 0; flex: 0 1 auto; }
            .site-header-fixed .logo img { height: 48px !important; margin-right: 8px !important; }
            .site-header-fixed .logo .en { font-size: .9rem; white-space: nowrap; }
            .site-header-fixed .nav-pc { display: none !important; }
            .site-header-fixed .sns-buttons { margin-left: auto; margin-right: 10px; gap: 13px; }
            .site-header-fixed .sns-buttons a { font-size: 21px; }
            .site-header-fixed .hamburger { display: flex !important; flex: 0 0 34px; }
            .site-header-fixed .tag-live { display: none !important; }
            .top-hero { grid-template-rows: minmax(58svh, auto) 42svh; }
            .hero-copy { padding: 124px 22px 26px; }
            .hero-script { top: 100px; right: 22px; font-size: .94rem; opacity: .72; }
            .hero-kicker { margin-bottom: 11px; font-size: .7rem; letter-spacing: .1em; }
            #top-hero-title {
              max-width: 100%;
              font-size: clamp(1.44rem, 6.25vw, 2.15rem);
              line-height: 1.52;
              letter-spacing: 0;
              white-space: normal !important;
              overflow-wrap: anywhere;
              word-break: normal;
            }
            .top-hero .subtitle { margin-top: 13px; font-size: .86rem; line-height: 1.62; }
            .top-hero .lead { margin-top: 9px; font-size: .76rem; line-height: 1.72; }
            .hero-media { min-height: 42svh; }
            .hero-media img { object-position: 38% 46%; transform: scale(1.02); }
            .hero-scroll, .hero-mantra { bottom: 13px; font-size: .56rem; }
            .hero-mantra { max-width: 158px; text-align: right; line-height: 1.55; }
          }
          @media (max-width: 390px) {
            .hero-copy { padding-left: 20px; padding-right: 20px; }
            #top-hero-title { font-size: 1.38rem; line-height: 1.54; }
            .top-hero .lead { font-size: .74rem; }
          }
          '''
          s = css_pattern.sub(css, s, count=1)

          hero_pattern = re.compile(r'<section class="top-hero" id="topHero">.*?</section>', re.S)
          hero = hero_pattern.search(s)
          if not hero:
              raise SystemExit('Top Hero markup not found')
          block = hero.group(0)
          h1 = re.search(r'<h1 id="top-hero-title">(.*?)</h1>', block, re.S)
          subtitle = re.search(r'<div class="subtitle">(.*?)</div>', block, re.S)
          lead = re.search(r'<p class="lead">(.*?)</p>', block, re.S)
          if not all((h1, subtitle, lead)):
              raise SystemExit('Hero copy hooks not found')

          new_hero = f'''<section class="top-hero" id="topHero">
            <div class="hero-copy">
              <p class="hero-script" aria-hidden="true">Good Waves Better Days</p>
              <p class="hero-kicker">波がある、人生が動き出す。</p>
              <h1 id="top-hero-title">{h1.group(1)}</h1>
              <div class="subtitle">{subtitle.group(1)}</div>
              <p class="lead">{lead.group(1)}</p>
            </div>
            <div class="hero-media">
              <picture>
                <source media="(min-width: 761px)" type="image/avif" srcset="img/hero-surf-desktop.avif">
                <source media="(min-width: 761px)" type="image/webp" srcset="img/hero-surf-desktop.webp">
                <source type="image/avif" srcset="img/hero-surf-mobile.avif">
                <source type="image/webp" srcset="img/hero-surf-mobile.webp">
                <img src="img/hero-surf-mobile.webp" alt="" loading="eager" fetchpriority="high" decoding="async">
              </picture>
              <div class="hero-media-overlay" aria-hidden="true"></div>
              <span class="hero-scroll" aria-hidden="true">SCROLL</span>
              <span class="hero-mantra" aria-hidden="true">SURF / LOCAL / LIVE BETTER</span>
            </div>
          </section>'''
          s = s[:hero.start()] + new_hero + s[hero.end():]
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

          # The stored mobile binaries are corrupt. Replace them with the verified approved scene
          # from the valid desktop binaries; CSS supplies the mobile crop.
          cp img/hero-surf-desktop.webp img/hero-surf-mobile.webp
          cp img/hero-surf-desktop.avif img/hero-surf-mobile.avif

      - name: Validate correction scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F '波がある、人生が動き出す。' index.html
          grep -F 'Good Waves Better Days' index.html
          grep -F 'SURF / LOCAL / LIVE BETTER' index.html
          grep -F '関西サーフィン波情報｜磯ノ浦・生見・国府の浜・伊良湖の無料波予報' index.html
          grep -F 'hero-surf-mobile.webp' index.html
          file img/hero-surf-mobile.webp | grep -qi 'Web/P image'
          file img/hero-surf-mobile.avif | grep -qi 'AVIF'
          git diff --check
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(index\.html|img/hero-surf-mobile\.(webp|avif))$'; then
            echo '::error::Unexpected file changed in Hero correction'
            exit 1
          fi

      - name: Commit and push correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html img/hero-surf-mobile.webp img/hero-surf-mobile.avif
          git commit -m 'fix: match approved dark-upper photo-lower Top Hero'
          git push origin HEAD:feat/top-isonoura-production-redesign
          echo "CORRECTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Approved Top Hero correction pushed to \`feat/top-isonoura-production-redesign\` at \`$CORRECTION_SHA\`. The Top now uses the dark-upper/photo-lower composition, mobile H1 wrapping, visible mobile hamburger/social row, and repaired mobile Hero image files. Isonoura was not touched by this correction pass."