name: LINE Saturday destination poll

on:
  schedule:
    - cron: '0 10 * * 6'
    - cron: '0 12 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ks-line-saturday-poll
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger time-gated LINE poll endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location             --retry 3 --retry-delay 5             'https://kansai.rss7.net/line/weekly_poll.php?mode=auto')"
          echo "$response"
