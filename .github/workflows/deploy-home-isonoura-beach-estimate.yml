name: Guarded Kansai homepage Isonoura beach estimate

on:
  push:
    branches: [fix/home-isonoura-beach-estimate-20261125]
    paths:
      - '.github/workflows/deploy-home-isonoura-beach-estimate.yml'

permissions:
  contents: read

concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/fix/home-isonoura-beach-estimate-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://kansai.rss7.net
      ROOT: /kansai
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage verified top card fix
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-home-isonoura.cjs
          mkdir -p "$RUNNER_TEMP/ks-home"
          curl -4 -fsSL --retry 3 --max-time 25 -H 'Cache-Control: no-cache' "$SITE/index.html?preflight=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/ks-home/before.html"
          curl -4 -fsSL --retry 3 --max-time 25 "$SITE/isonoura-beach-wave.js?v=20261125-1" -o "$RUNNER_TEMP/ks-home/helper.js"
          echo 'df3b15ab5d45fd412bc1fa9adf561456007d1bd7b8ef373428cb8cf583e84c5f  '"$RUNNER_TEMP/ks-home/helper.js" | sha256sum -c -
          node - "$RUNNER_TEMP/ks-home/helper.js" <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const ctx={};ctx.globalThis=ctx;
          vm.runInNewContext(fs.readFileSync(process.argv[2],'utf8'),ctx);
          const data={wave_height:[0.82],wave_direction:[291],wave_period:[4.35],swell_wave_height:[0.32],swell_wave_direction:[195],swell_wave_period:[5.95]};
          const x=ctx.ksIsonouraBeachWave.estimate(data,0);
          assert.ok(Math.abs(x.height-0.224)<1e-9);
          assert.equal(x.direction,195);assert.equal(x.period,5.95);
          NODE
          node scripts/patch-home-isonoura.cjs "$RUNNER_TEMP/ks-home/before.html" "$RUNNER_TEMP/ks-home/index.html"
          node - "$RUNNER_TEMP/ks-home/index.html" <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync(process.argv[2],'utf8');
          for(const [x,n] of [['data-ks-isonoura-home-beach-wave',1],['const estimator = window.ksIsonouraBeachWave?.estimate',1],['波（ビーチ推定）',2]]){
            assert.equal(h.split(x).length-1,n,x);
          }
          const script=[...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].find(x=>x[1].includes('const SPOTS = ['));
          assert.ok(script);new vm.Script(script[1]);
          console.log('PASS: exact Isonoura-only patch; main JS parses');
          NODE
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Back up unchanged public homepage
        id: backup
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test "$SITE" = https://kansai.rss7.net
          test "$ROOT" = /kansai
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          lftp <<FTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" ftp.lolipop.jp
          get "$ROOT/index.html" -o "$RUNNER_TEMP/ks-home/backup.html"
          bye
          FTP
          cmp "$RUNNER_TEMP/ks-home/before.html" "$RUNNER_TEMP/ks-home/backup.html"
          curl -4 -fsSL --retry 3 "$SITE/?preflight=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/ks-home/home-before.html"
          cmp "$RUNNER_TEMP/ks-home/home-before.html" "$RUNNER_TEMP/ks-home/backup.html"
      - name: Preserve rollback copy
        uses: actions/upload-artifact@v4
        with:
          name: ks-home-before-${{ github.run_id }}
          path: ${{ runner.temp }}/ks-home/backup.html
          retention-days: 14
          if-no-files-found: error
      - name: Upload only index.html
        id: upload
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp <<FTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" ftp.lolipop.jp
          put "$RUNNER_TEMP/ks-home/index.html" -o "$ROOT/index.html"
          bye
          FTP
      - name: Verify public index and root byte for byte
        id: verify
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp <<FTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" ftp.lolipop.jp
          get "$ROOT/index.html" -o "$RUNNER_TEMP/ks-home/ftp-new.html"
          bye
          FTP
          cmp "$RUNNER_TEMP/ks-home/index.html" "$RUNNER_TEMP/ks-home/ftp-new.html"
          for page in 'index.html' ''; do
            curl -4 -fsSL --retry 4 -H 'Cache-Control: no-cache' "$SITE/$page?ks_fixed=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/ks-home/live-new.html"
            cmp "$RUNNER_TEMP/ks-home/index.html" "$RUNNER_TEMP/ks-home/live-new.html"
          done
          echo 'PASS: Isonoura home card aligned; other 8 spots and detail JS unchanged'
      - name: Restore previous homepage on failed upload or verification
        if: failure() && steps.backup.outcome == 'success' && (steps.upload.outcome == 'failure' || steps.verify.outcome == 'failure')
        shell: bash
        env:
          FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp <<FTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 25
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASS" ftp.lolipop.jp
          put "$RUNNER_TEMP/ks-home/backup.html" -o "$ROOT/index.html"
          bye
          FTP
          echo 'Previous homepage restored'
