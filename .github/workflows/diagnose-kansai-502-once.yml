name: Diagnose Kansai 502 once

on:
  push:
    paths:
      - '.github/workflows/diagnose-kansai-502-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: DNS and HTTP checks
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DNS ==="
          getent ahostsv4 kansai.rss7.net || true
          getent ahostsv4 nami.rss7.net || true
          getent ahostsv4 rss7.net || true

          echo "=== HTTP status ==="
          for u in             https://kansai.rss7.net/             https://kansai.rss7.net/index.html             https://kansai.rss7.net/isonoura.html             https://kansai.rss7.net/line/             https://nami.rss7.net/             https://rss7.net/             https://kanto.rss7.net/
          do
            code=$(curl -A 'KS-health-check/1.0' -L -sS -o /tmp/body -w '%{http_code}' --connect-timeout 10 --max-time 20 "$u" || true)
            size=$(wc -c </tmp/body 2>/dev/null || echo 0)
            ctype=$(curl -A 'KS-health-check/1.0' -I -L -sS --connect-timeout 10 --max-time 20 "$u" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{v=$2} END{print v}')
            server=$(curl -A 'KS-health-check/1.0' -I -L -sS --connect-timeout 10 --max-time 20 "$u" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="server"{v=$2} END{print v}')
            echo "$code bytes=$size server=$server type=$ctype $u"
          done

      - name: Verify production files still exist on FTPS
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y lftp >/dev/null
          W="$RUNNER_TEMP/ks-502"
          mkdir -p "$W"
          set +x
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; get /kansai/index.html -o \"$W/index.html\"; get /kansai/isonoura.html -o \"$W/isonoura.html\"; get /kansai/.htaccess -o \"$W/htaccess\"; bye" || true
          for f in index.html isonoura.html htaccess; do
            if [ -f "$W/$f" ]; then
              echo "$f bytes=$(wc -c < "$W/$f") sha256=$(sha256sum "$W/$f" | awk '{print $1}')"
            else
              echo "$f MISSING"
            fi
          done
          if [ -f "$W/htaccess" ]; then
            echo "=== .htaccess non-secret directives ==="
            grep -Ev '(password|secret|token|key)' "$W/htaccess" | sed -n '1,160p'
          fi
