name: Unify production footer from LINE page
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ks-footer-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ftp.lolipop.jp
      PROD_ROOT: /kansai
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Build footer-only patch
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          W="$RUNNER_TEMP/footer-sync"; O="$W/orig"; P="$W/patched"; B="$W/backup"
          mkdir -p "$O" "$P" "$B"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          get /kansai/line/index.html -o "$W/line.html"
          mirror --verbose=0 --parallel=8 --include-glob '*.html' --include-glob '*.php' --exclude-glob 'admin/**' --exclude-glob 'data/**' --exclude-glob 'uploads/**' --exclude-glob 'line-bot/**' --exclude-glob 'line/**' --exclude-glob 'img/**' --exclude-glob 'secret/**' /kansai "$O"
          bye
          LFTP_EOF
          LINE="$W/line.html" O="$O" P="$P" B="$B" python - <<'PY'
          import os,pathlib,re,shutil
          line=pathlib.Path(os.environ["LINE"]).read_text(encoding="utf-8")
          o=pathlib.Path(os.environ["O"]); p=pathlib.Path(os.environ["P"]); b=pathlib.Path(os.environ["B"])
          rx=re.compile(r"<footer\b[^>]*>.*?</footer>",re.I|re.S)
          mm=list(rx.finditer(line))
          if len(mm)!=1: raise SystemExit(f"canonical footer count={len(mm)}")
          footer=mm[0].group(0)
          rows=[]
          for f in sorted(o.rglob("*")):
              if not f.is_file() or f.suffix.lower() not in {".html",".php"}: continue
              try: before=f.read_text(encoding="utf-8")
              except UnicodeDecodeError: continue
              m=list(rx.finditer(before))
              if not m: continue
              if len(m)!=1: raise SystemExit(f"{f.relative_to(o)} footer count={len(m)}")
              x=m[0]
              # Only replace a literal page footer. If the footer text appears
              # while PHP code is open (for example inside a helper string),
              # it is not a rendered page footer and must not be touched.
              if f.suffix.lower()==".php":
                  prev_open=max(before.rfind("<?php",0,x.start()),before.rfind("<?=",0,x.start()),before.rfind("<?",0,x.start()))
                  prev_close=before.rfind("?>",0,x.start())
                  if prev_open>prev_close:
                      continue
              after=before[:x.start()]+footer+before[x.end():]
              if after==before: continue
              # hard proof: only the footer span changes
              if before[:x.start()]!=after[:x.start()]: raise SystemExit("prefix changed")
              if before[x.end():]!=after[x.start()+len(footer):]: raise SystemExit("suffix changed")
              rel=f.relative_to(o)
              dst=p/rel; dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_text(after,encoding="utf-8")
              bak=b/rel; bak.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(f,bak)
              rows.append(str(rel))
          (p/"_changed.txt").write_text("\n".join(rows)+("\n" if rows else ""),encoding="utf-8")
          print("FOOTER_FILES_CHANGED="+str(len(rows)))
          for r in rows: print("PATCH "+r)
          PY
          if [ -s "$P/_changed.txt" ]; then
            while IFS= read -r rel; do case "$rel" in *.php) php -l "$P/$rel" >/dev/null;; esac; done < "$P/_changed.txt"
          fi
      - name: Deploy and verify exact files
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          W="$RUNNER_TEMP/footer-sync"; P="$W/patched"; B="$W/backup"; V="$W/verify"
          mkdir -p "$V"
          [ -s "$P/_changed.txt" ] || { echo FOOTER_ALREADY_UNIFIED; exit 0; }

          rollback(){
            echo "::warning::Restoring originals after failed verification."
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; mirror -R --verbose=0 --parallel=8 --include-glob '*.html' --include-glob '*.php' \"$B\" /kansai; bye" || true
          }
          trap rollback ERR

          # Upload all prepared footer-only patches in one parallel FTPS session.
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          mirror -R --verbose=0 --parallel=8 --include-glob '*.html' --include-glob '*.php' --exclude-glob '_changed.txt' "$P" /kansai
          bye
          LFTP_EOF

          # Re-download the public page tree once, then compare only changed files.
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          mirror --verbose=0 --parallel=8 --include-glob '*.html' --include-glob '*.php' --exclude-glob 'admin/**' --exclude-glob 'data/**' --exclude-glob 'uploads/**' --exclude-glob 'line-bot/**' --exclude-glob 'line/**' --exclude-glob 'img/**' --exclude-glob 'secret/**' /kansai "$V"
          bye
          LFTP_EOF

          while IFS= read -r rel; do
            cmp -s "$P/$rel" "$V/$rel"
            case "$rel" in *.php) php -l "$V/$rel" >/dev/null;; esac
          done < "$P/_changed.txt"

          curl --fail --silent --show-error --location "https://kansai.rss7.net/index.html?v=$GITHUB_RUN_ID" >/dev/null
          curl --fail --silent --show-error --location "https://kansai.rss7.net/line/?v=$GITHUB_RUN_ID" >/dev/null
          trap - ERR
          echo PRODUCTION_FOOTER_SYNC_OK
