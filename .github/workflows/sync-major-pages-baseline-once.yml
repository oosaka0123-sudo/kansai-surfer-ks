name: Sync 10 major production pages baseline once

on:
  push:
    paths:
      - '.github/workflows/sync-major-pages-baseline-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import exact live production pages into audit branch
        shell: bash
        run: |
          set -euo pipefail
          pages=(index.html isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html)
          W="$RUNNER_TEMP/ks-major-baseline"
          mkdir -p "$W"

          for p in "${pages[@]}"; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2               "https://kansai.rss7.net/$p?v=$GITHUB_RUN_ID" -o "$W/$p"
            test -s "$W/$p"
          done

          git checkout -B chore/import-production-baseline-major-pages main
          for p in "${pages[@]}"; do
            cp "$W/$p" "$p"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${pages[@]}"

          if git diff --cached --quiet; then
            echo "NO_MAJOR_PAGE_BASELINE_CHANGES"
          else
            git commit -m "chore: sync exact production 10-page baseline"
          fi

          git push --force-with-lease origin chore/import-production-baseline-major-pages
          git rev-parse HEAD
