name: Run LINE Hero v2 production once
on:
  push:
    paths:
      - '.github/workflows/run-line-hero-v2-production-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-line-hero-v2-production.yml -R oosaka0123-sudo/kansai-surfer-ks --ref main
