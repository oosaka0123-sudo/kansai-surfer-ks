name: Deploy Isonoura share button once

on:
  push:
    paths:
      - '.github/workflows/deploy-isonoura-share-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SOURCE_SHA: d0332e98db8dd47cfdcb5b06abd6b6a6db01eaf8
      BASELINE_SHA: 896e9ff04308b8a420bf4b5ec2f8aa71e90805b7
      SITE_URL: https://kansai.rss7.net/isonoura.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify committed source and unchanged production baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="isonouraShareBtn"' isonoura.html
          grep -q 'fa-share-nodes' isonoura.html
          grep -q 'border: 0;' isonoura.html
          grep -q 'navigator.share' isonoura.html
          grep -q 'navigator.clipboard' isonoura.html
          grep -q 'AbortError' isonoura.html

          git show "$BASELINE_SHA:isonoura.html" > "$RUNNER_TEMP/isonoura-baseline.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2             "$SITE_URL?v=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/isonoura-live-before.html"

          cmp -s "$RUNNER_TEMP/isonoura-baseline.html" "$RUNNER_TEMP/isonoura-live-before.html" || {
            echo "::error::Production Isonoura changed after baseline commit; refusing upload."
            exit 1
          }

      - run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Upload Isonoura only and verify live
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          W="$RUNNER_TEMP/isonoura-share-prod"
          mkdir -p "$W"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; get /kansai/isonoura.html -o \"$W/backup.html\"; bye"

          rollback(){
            echo "::warning::Verification failed; restoring original Isonoura page."
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; put \"$W/backup.html\" -o /kansai/isonoura.html; bye" || true
          }
          trap rollback ERR

          cmp -s "$W/backup.html" "$RUNNER_TEMP/isonoura-live-before.html"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; put isonoura.html -o /kansai/isonoura.html; get /kansai/isonoura.html -o \"$W/ftp-verify.html\"; bye"
          cmp -s isonoura.html "$W/ftp-verify.html"

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2             "$SITE_URL?v=$GITHUB_RUN_ID-final" -o "$W/live.html"
          cmp -s isonoura.html "$W/live.html"

          grep -q 'id="isonouraShareBtn"' "$W/live.html"
          grep -q 'fa-share-nodes' "$W/live.html"
          grep -q 'border: 0;' "$W/live.html"
          grep -q 'navigator.share' "$W/live.html"
          grep -q 'navigator.clipboard' "$W/live.html"

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          set +e
          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --virtual-time-budget=1800 --window-size=390,844             --screenshot="$W/live-390.png"             "$SITE_URL?v=$GITHUB_RUN_ID-final"
          CHROME_RC=$?
          set -e
          test -s "$W/live-390.png" || {
            echo "::error::Live mobile screenshot was not created (chrome rc=$CHROME_RC)."
            false
          }

          trap - ERR
          echo ISONOURA_SHARE_LIVE_OK

      - uses: actions/upload-artifact@v4
        with:
          name: isonoura-share-live-proof
          path: ${{ runner.temp }}/isonoura-share-prod/live-390.png
          retention-days: 3
