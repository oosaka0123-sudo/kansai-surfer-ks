name: Deploy Hakuto compact editorial layout (one HTML)
on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Dry-run first, then deploy one approved hakuto.html only"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy
permissions:
  contents: read
concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false
jobs:
  hakuto-only:
    if: github.ref == 'refs/heads/deploy/ks-hakuto-editorial-layout-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4

      - name: Validate approved changes against live production, make backup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, difflib, pathlib, os, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          stage=root/'hakuto-stage'; back=root/'hakuto-backup'
          stage.mkdir(exist_ok=True); back.mkdir(exist_ok=True)
          def get(url):
            request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'KS-Hakuto-SafeDeploy/1.0'})
            with urllib.request.urlopen(request,timeout=25) as response:
              if response.status != 200: raise ValueError('Unexpected HTTP status')
              return response.read()
          live=get('https://kansai.rss7.net/hakuto.html')
          baseline=get('https://raw.githubusercontent.com/oosaka0123-sudo/kansai-surfer-ks/fix/ks-hakuto-related-editorial-only-20261119/hakuto.html')
          if live != baseline: raise ValueError('Production Hakuto changed since baseline; STOP before any upload')
          approved=pathlib.Path('hakuto.html').read_bytes()
          if live==approved: raise ValueError('Fix already deployed; STOP')
          a=live.decode('utf-8');b=approved.decode('utf-8')
          ops=[o for o in difflib.SequenceMatcher(a=a.splitlines(),b=b.splitlines(),autojunk=False).get_opcodes() if o[0]!='equal']
          old_start='<!-- 白兎 関連ブログ -->'
          new_start='<!-- 白兎 関連ブログ：地域ニュース専用のコンパクト表示 -->'
          suffix='\n<footer>'
          if a.count(old_start)!=1 or b.count(new_start)!=1 or a.count(suffix)!=1 or b.count(suffix)!=1: raise ValueError('Expected unique section boundaries missing')
          if a.split(old_start,1)[0] != b.split(new_start,1)[0]: raise ValueError('Code changed before related section')
          if a.split(suffix,1)[1] != b.split(suffix,1)[1]: raise ValueError('Code changed after related section')
          if 'hakuto-news-card' not in b or 'hakuto-news-title' not in b or 'hakuto-related-local-style' not in b: raise ValueError('New compact layout missing')
          if hashlib.sha256(live).hexdigest() != '782d5c34763931e80a7210cd3c2348a4a2934b971ea56e1f6ef593de89902de2': raise ValueError('Baseline changed; abort')
          if hashlib.sha256(approved).hexdigest() != 'fe8550fe7b33f3d2b9a1909cb7705e67d20777530badc716a5967c58294d0077': raise ValueError('Approved file changed; abort')
          if "category === '波予想'" not in b or "category === '波予報'" not in b or 'seenTitles[title]' not in b: raise ValueError('Missing editorial filter or dedup')
          if 'id="hakutoSpotBlogGrid" class="all-spots-grid" style=' in b: raise ValueError('Mobile hard-coded grid still present')
          if '<title>白兎 波情報・波予想｜関西サーファーKS</title>' not in b: raise ValueError('SEO title modified')
          if 'window.scrollTo({top:0,left:0,behavior:' not in b: raise ValueError('Menu fix missing')
          (back/'hakuto.html').write_bytes(live)
          home=get('https://kansai.rss7.net/index.html')
          (back/'homepage.sha256').write_text(hashlib.sha256(home).hexdigest())
          (stage/'hakuto.html').write_bytes(approved)
          print('SAFE STAGING: one file only; one bounded section updated, original backed up',len(live),len(approved))
          PY

      - name: Upload original Hakuto HTML as recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ks-hakuto-editorial-original
          path: ${{ runner.temp }}/hakuto-backup/
          retention-days: 14
          if-no-files-found: error

      - name: Upload approved Hakuto HTML for review
        uses: actions/upload-artifact@v4
        with:
          name: ks-hakuto-editorial-approved
          path: ${{ runner.temp }}/hakuto-stage/
          retention-days: 14
          if-no-files-found: error

      - name: Install secured FTPS client
        if: inputs.deploy_mode == 'deploy'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null

      - name: Verify FTPS path is this exact public production, read only
        if: inputs.deploy_mode == 'deploy'
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/hakuto-ftp"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          cd /kansai
          lcd "$RUNNER_TEMP/hakuto-ftp"
          get hakuto.html
          get index.html
          bye
          LFTP_EOF
          cmp "$RUNNER_TEMP/hakuto-backup/hakuto.html" "$RUNNER_TEMP/hakuto-ftp/hakuto.html" || { echo "::error::FTP Hakuto differs; abort"; exit 1; }
          HOME_SHA="$(sha256sum "$RUNNER_TEMP/hakuto-ftp/index.html" | cut -d' ' -f1)"
          PUBLIC_HOME_SHA="$(cat "$RUNNER_TEMP/hakuto-backup/homepage.sha256")"
          [ "$HOME_SHA" = "$PUBLIC_HOME_SHA" ] || { echo "::error::FTP homepage differs from public site; abort"; exit 1; }
          python3 - <<'PY'
          import urllib.request,pathlib,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'hakuto-backup/hakuto.html'
          with urllib.request.urlopen(urllib.request.Request('https://kansai.rss7.net/hakuto.html',headers={'Cache-Control':'no-cache'}),timeout=25) as r: current=r.read()
          if current != p.read_bytes(): raise ValueError('Live Hakuto updated during preflight; abort')
          print('FTPS and public contents match baseline immediately before deployment.')
          PY

      - name: FTPS upload of hakuto.html only
        if: inputs.deploy_mode == 'deploy'
        id: ftp_upload
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          cd /kansai
          lcd "$RUNNER_TEMP/hakuto-stage"
          put hakuto.html
          bye
          LFTP_EOF

      - name: Verify only Hakuto changed and home stayed intact
        if: inputs.deploy_mode == 'deploy'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,os,time
          root=Path(os.environ['RUNNER_TEMP'])
          expected=(root/'hakuto-stage/hakuto.html').read_bytes()
          ok=False
          for attempt in range(5):
            request=urllib.request.Request('https://kansai.rss7.net/hakuto.html?verify='+str(int(time.time())),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
            with urllib.request.urlopen(request,timeout=25) as r: actual=r.read()
            if actual==expected: ok=True;break
            time.sleep(3)
          if not ok: raise ValueError('Published Hakuto does not match uploaded approved HTML')
          with urllib.request.urlopen(urllib.request.Request('https://kansai.rss7.net/index.html',headers={'Cache-Control':'no-cache'}),timeout=25) as r: home=r.read()
          if hashlib.sha256(home).hexdigest()!=(root/'hakuto-backup/homepage.sha256').read_text().strip(): raise ValueError('Homepage unexpectedly changed')
          print('SUCCESS: exactly one HTML uploaded, verified public content and homepage unchanged')
          PY

      - name: Restore original Hakuto if upload or verification fails
        if: failure() && inputs.deploy_mode == 'deploy' && (steps.ftp_upload.outcome == 'failure' || steps.verify.outcome == 'failure')
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          cd /kansai
          lcd "$RUNNER_TEMP/hakuto-backup"
          put hakuto.html
          bye
          LFTP_EOF
          echo 'Rolled back original Hakuto HTML.'
