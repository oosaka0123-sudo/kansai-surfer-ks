name: KS guarded 9 spot deployment
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "true = deploy 9 files; false = read-only backup check"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ks9-spot-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/deploy/ks-9spots-only-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_USER: ${{ secrets.KS_NAMI_FTP_USER }}
      FTP_PASS: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
      FTP_SERVER: ftp.lolipop.jp
      STAGE: /tmp/ks-seo9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact approved source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/source" "$STAGE/baseline" "$STAGE/backup" "$STAGE/verify" "$STAGE/http"
          for f in isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html; do
            test -f "$f"
            git show "3e47446a7bab5533f7aac67d4ea594696e47ed9e:$f" > "$STAGE/source/$f"
            git show "8d7161ac70cb785254c8a1d0a41b823859251d53:$f" > "$STAGE/baseline/$f"
            cmp "$f" "$STAGE/source/$f"
            grep -q 'rel="canonical"' "$f"
          done
          test -n "$FTP_USER" && test -n "$FTP_PASS"
          test "$FTP_SERVER" = "ftp.lolipop.jp"
          echo "SOURCE_CHECK_OK"
      - name: Install lftp
        run: sudo apt-get -qq update && sudo apt-get install -y -qq lftp
      - name: Read-only FTPS backup and baseline safety check
        shell: bash
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER"
          cd /kansai
          lcd "$STAGE/backup"
          get "isonoura.html" -o "isonoura.html"
          get "kounohama.html" -o "kounohama.html"
          get "ikumi.html" -o "ikumi.html"
          get "komatsu.html" -o "komatsu.html"
          get "irago.html" -o "irago.html"
          get "shizunami.html" -o "shizunami.html"
          get "hamadutu.html" -o "hamadutu.html"
          get "takahama.html" -o "takahama.html"
          get "hakuto.html" -o "hakuto.html"
          bye
          LFTP
          for f in isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html; do test -s "$STAGE/backup/$f"; done
          python3 - "$STAGE" isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html <<'PY'
          import pathlib,sys
          b=pathlib.Path(sys.argv[1])
          bad=[name for name in sys.argv[2:] if (b/"backup"/name).read_bytes().rstrip(b"\r\n") != (b/"baseline"/name).read_bytes().rstrip(b"\r\n")]
          if bad: raise SystemExit("ABORT: production diverged from approved backup baseline: "+str(bad))
          print("FTP_READ_ONLY_CHECK_OK nine pages match audited baseline")
          PY
      - name: Archive original production files
        uses: actions/upload-artifact@v4
        with:
          name: ks9-original-${{ github.run_id }}
          path: /tmp/ks-seo9/backup/
          retention-days: 30
          if-no-files-found: error
      - name: Publish approved 9 HTML only
        id: upload
        if: inputs.publish == true
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER"
          cd /kansai
          lcd "$STAGE/source"
          put "isonoura.html" -o "isonoura.html"
          put "kounohama.html" -o "kounohama.html"
          put "ikumi.html" -o "ikumi.html"
          put "komatsu.html" -o "komatsu.html"
          put "irago.html" -o "irago.html"
          put "shizunami.html" -o "shizunami.html"
          put "hamadutu.html" -o "hamadutu.html"
          put "takahama.html" -o "takahama.html"
          put "hakuto.html" -o "hakuto.html"
          lcd "$STAGE/verify"
          get "isonoura.html" -o "isonoura.html"
          get "kounohama.html" -o "kounohama.html"
          get "ikumi.html" -o "ikumi.html"
          get "komatsu.html" -o "komatsu.html"
          get "irago.html" -o "irago.html"
          get "shizunami.html" -o "shizunami.html"
          get "hamadutu.html" -o "hamadutu.html"
          get "takahama.html" -o "takahama.html"
          get "hakuto.html" -o "hakuto.html"
          bye
          LFTP
          for f in isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html; do cmp "$STAGE/source/$f" "$STAGE/verify/$f"; done
          for f in isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html; do
            curl -fsSL --retry 2 --max-time 20 "https://kansai.rss7.net/$f?verify=${{ github.run_id }}" > "$STAGE/http/$f"
            python3 - "$STAGE/source/$f" "$STAGE/http/$f" "$f" <<'PY'
          import pathlib,re,sys,html
          a=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          b=pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          def extract(s,p):
            m=re.search(p,s,re.I|re.S)
            if not m: raise SystemExit("Missing markup "+sys.argv[3])
            return re.sub(r"<[^>]+>","",html.unescape(m.group(1))).strip()
          for pat in [r"<title>(.*?)</title>",r"<h1\b[^>]*>(.*?)</h1>"]:
            if extract(a,pat)!=extract(b,pat): raise SystemExit("HTTP title/H1 mismatch "+sys.argv[3])
          if 'rel="canonical"' not in b: raise SystemExit("No canonical "+sys.argv[3])
          print("VERIFIED",sys.argv[3])
          PY
          done
          echo "DEPLOYED_9_HTML_ONLY"
      - name: Auto-rollback on publish or verification error
        if: steps.upload.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          set +x
          echo "::warning::Partial deploy or verification failure. Restoring original nine HTML files."
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER"
          cd /kansai
          lcd "$STAGE/backup"
          put "isonoura.html" -o "isonoura.html"
          put "kounohama.html" -o "kounohama.html"
          put "ikumi.html" -o "ikumi.html"
          put "komatsu.html" -o "komatsu.html"
          put "irago.html" -o "irago.html"
          put "shizunami.html" -o "shizunami.html"
          put "hamadutu.html" -o "hamadutu.html"
          put "takahama.html" -o "takahama.html"
          put "hakuto.html" -o "hakuto.html"
          bye
          LFTP
          echo "ROLLBACK_DONE"
      - name: Mark attempted deploy as failed
        if: steps.upload.outcome == 'failure'
        run: exit 1
      - name: Report outcome
        if: success()
        run: echo "Safe nine-page job finished (publish=${{ inputs.publish }})"
