name: Deploy Hakuto footer-line guard (one HTML)
on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Dry-run first, then deploy one approved hakuto.html only"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy
permissions:
  contents: read
concurrency:
  group: kansai-surfer-production-deploy
  cancel-in-progress: false
jobs:
  hakuto-only:
    if: github.ref == 'refs/heads/deploy/ks-hakuto-footer-guard-only-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4

      - name: Validate approved changes against live production, make backup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, os, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          stage=root/'hakuto-stage'; back=root/'hakuto-backup'
          stage.mkdir(exist_ok=True); back.mkdir(exist_ok=True)
          def get(url):
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'KS-Hakuto-Footer-Guard/1.0'})
            with urllib.request.urlopen(req,timeout=25) as response:
              if response.status!=200: raise ValueError('Unexpected status')
              return response.read()
          live=get('https://kansai.rss7.net/hakuto.html')
          baseline=get('https://raw.githubusercontent.com/oosaka0123-sudo/kansai-surfer-ks/fix/ks-hakuto-editorial-layout-20261119/hakuto.html')
          if live != baseline: raise ValueError('Production changed since captured baseline; refuse upload')
          approved=pathlib.Path('hakuto.html').read_bytes()
          if hashlib.sha256(live).hexdigest() != 'fe8550fe7b33f3d2b9a1909cb7705e67d20777530badc716a5967c58294d0077': raise ValueError('Unexpected live snapshot hash')
          if hashlib.sha256(approved).hexdigest() != '1d1bce9bd3f6c53ddbacdba34728797998f70042e75952cf2a08b11fd3b70eee': raise ValueError('Unexpected approved patch hash')
          b=approved.decode('utf-8')
          marker='<!-- Hakuto only: prevent the floating LINE CTA from covering the footer on mobile. -->'
          if b.count(marker)!=1: raise ValueError('Guard marker missing or repeated')
          pos=b.index(marker)
          if b.count('</script>',pos)==0: raise ValueError('Guard script closing tag missing')
          finish=b.index('</script>\n\n',pos)+len('</script>\n\n')
          restored=b[:pos]+b[finish:]
          if restored.encode('utf-8')!=live: raise ValueError('Changes outside single guard insertion detected; REFUSE')
          if 'ks-hakuto-footer-near' not in b or 'requestAnimationFrame(updateVisibility)' not in b: raise ValueError('Guard safety missing')
          if 'hakuto-related-local-style' not in b or 'seenTitles[title]' not in b: raise ValueError('Existing blog section damaged')
          (back/'hakuto.html').write_bytes(live)
          home=get('https://kansai.rss7.net/index.html')
          (back/'homepage.sha256').write_text(hashlib.sha256(home).hexdigest())
          (stage/'hakuto.html').write_bytes(approved)
          print('SAFE STAGING one hakuto.html only; exact single insertion; backup saved',len(live),len(approved))
          PY

      - name: Upload original Hakuto HTML as recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ks-hakuto-footer-original
          path: ${{ runner.temp }}/hakuto-backup/
          retention-days: 14
          if-no-files-found: error

      - name: Upload approved Hakuto HTML for review
        uses: actions/upload-artifact@v4
        with:
          name: ks-hakuto-footer-approved
          path: ${{ runner.temp }}/hakuto-stage/
          retention-days: 14
          if-no-files-found: error

      - name: Install secured FTPS client
        if: inputs.deploy_mode == 'deploy'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null

      - name: Verify FTPS path is this exact public production, read only
        if: inputs.deploy_mode == 'deploy'
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/hakuto-ftp"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          cd /kansai
          lcd "$RUNNER_TEMP/hakuto-ftp"
          get hakuto.html
          get index.html
          bye
          LFTP_EOF
          cmp "$RUNNER_TEMP/hakuto-backup/hakuto.html" "$RUNNER_TEMP/hakuto-ftp/hakuto.html" || { echo "::error::FTP Hakuto differs; abort"; exit 1; }
          HOME_SHA="$(sha256sum "$RUNNER_TEMP/hakuto-ftp/index.html" | cut -d' ' -f1)"
          PUBLIC_HOME_SHA="$(cat "$RUNNER_TEMP/hakuto-backup/homepage.sha256")"
          [ "$HOME_SHA" = "$PUBLIC_HOME_SHA" ] || { echo "::error::FTP homepage differs from public site; abort"; exit 1; }
          python3 - <<'PY'
          import urllib.request,pathlib,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'hakuto-backup/hakuto.html'
          with urllib.request.urlopen(urllib.request.Request('https://kansai.rss7.net/hakuto.html',headers={'Cache-Control':'no-cache'}),timeout=25) as r: current=r.read()
          if current != p.read_bytes(): raise ValueError('Live Hakuto updated during preflight; abort')
          print('FTPS and public contents match baseline immediately before deployment.')
          PY

      - name: FTPS upload of hakuto.html only
        if: inputs.deploy_mode == 'deploy'
        id: ftp_upload
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          cd /kansai
          lcd "$RUNNER_TEMP/hakuto-stage"
          put hakuto.html
          bye
          LFTP_EOF

      - name: Verify only Hakuto changed and home stayed intact
        if: inputs.deploy_mode == 'deploy'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,os,time
          root=Path(os.environ['RUNNER_TEMP'])
          expected=(root/'hakuto-stage/hakuto.html').read_bytes()
          ok=False
          for attempt in range(5):
            request=urllib.request.Request('https://kansai.rss7.net/hakuto.html?verify='+str(int(time.time())),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
            with urllib.request.urlopen(request,timeout=25) as r: actual=r.read()
            if actual==expected: ok=True;break
            time.sleep(3)
          if not ok: raise ValueError('Published Hakuto does not match uploaded approved HTML')
          with urllib.request.urlopen(urllib.request.Request('https://kansai.rss7.net/index.html',headers={'Cache-Control':'no-cache'}),timeout=25) as r: home=r.read()
          if hashlib.sha256(home).hexdigest()!=(root/'hakuto-backup/homepage.sha256').read_text().strip(): raise ValueError('Homepage unexpectedly changed')
          print('SUCCESS: exactly one HTML uploaded, verified public content and homepage unchanged')
          PY

      - name: Restore original Hakuto if upload or verification fails
        if: failure() && inputs.deploy_mode == 'deploy' && (steps.ftp_upload.outcome == 'failure' || steps.verify.outcome == 'failure')
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp.lolipop.jp
          cd /kansai
          lcd "$RUNNER_TEMP/hakuto-backup"
          put hakuto.html
          bye
          LFTP_EOF
          echo 'Rolled back original Hakuto HTML.'
