name: Patch LINE hajimemashite intros on nami

on:
  push:
    branches:
      - chore/line-group-welcome-bot
    paths:
      - '.github/workflows/patch-line-hajimemashite-nami.yml'
      - '.github/scripts/patch-line-hajimemashite.php'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ftp.lolipop.jp
      BOT_DIR: /nami/ks-line-bot
      WEBHOOK_URL: https://nami.rss7.net/ks-line-bot/webhook.php

    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Download current live webhook
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          get "$BOT_DIR/webhook.php" -o /tmp/webhook-before.php
          bye
          LFTP
          php -l /tmp/webhook-before.php

      - name: Save rollback copy
        uses: actions/upload-artifact@v4
        with:
          name: line-webhook-before-hajimemashite-detection
          path: /tmp/webhook-before.php
          retention-days: 30

      - name: Apply exact function patch
        run: |
          set -euo pipefail
          php .github/scripts/patch-line-hajimemashite.php /tmp/webhook-before.php /tmp/webhook-after.php
          php -l /tmp/webhook-after.php

      - name: Test detection rules
        run: |
          php -r '
          function t(string $text): bool {
            if (mb_stripos($text,"#自己紹介") !== false || mb_stripos($text,"＃自己紹介") !== false) return true;
            if (preg_match("/(?:^|\\R)[\\t 　]*ニックネーム[\\t 　]*[：:][\\t 　]*\\S+/u",$text) === 1) return true;
            return preg_match("/^[\\t 　]*はじめまして/u",$text) === 1;
          }
          $cases=[
            ["#自己紹介\nニックネーム：太郎",true],
            ["ニックネーム：ゆうさん\nよく行くポイント：磯ノ浦",true],
            ["はじめまして！\nミカンです。大阪市港区に住んでます。",true],
            ["　はじめまして。星一徹です",true],
            ["昨日はじめましてって言いました",false],
            ["今日はよろしくお願いします",false]
          ];
          foreach($cases as [$txt,$want]) {
            if (t($txt) !== $want) { fwrite(STDERR,"case failed\n"); exit(1); }
          }
          echo "detection tests ok\n";
          '

      - name: Upload patched webhook only
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          put /tmp/webhook-after.php -o "$BOT_DIR/webhook.php"
          bye
          LFTP

      - name: Verify live webhook
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(curl --fail --silent --show-error --location "$WEBHOOK_URL")" = 'ok'
          set +x
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          get "$BOT_DIR/webhook.php" -o /tmp/webhook-live.php
          bye
          LFTP
          php -l /tmp/webhook-live.php
          grep -q 'はじめまして' /tmp/webhook-live.php
          echo "LINE hajimemashite intro detection deployed."
