name: Deploy share buttons to 10 major pages once

on:
  push:
    paths:
      - '.github/workflows/deploy-major-share-buttons-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_SHA: 8d7161ac70cb785254c8a1d0a41b823859251d53
      BASELINE_SHA: 3ccde9538f7bcb5300528793cd8e4bd965a13bf1
      SITE_ROOT: https://kansai.rss7.net
      FTP_HOST: ftp.lolipop.jp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify source and unchanged live baseline
        shell: bash
        run: |
          set -euo pipefail
          pages=(index.html isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html)
          spots=(isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html)
          W="$RUNNER_TEMP/major-share-prod"
          mkdir -p "$W/baseline" "$W/live-before" "$W/upload" "$W/backup" "$W/verify" "$W/screens"

          for p in "${pages[@]}"; do
            git show "$BASELINE_SHA:$p" > "$W/baseline/$p"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2               "$SITE_ROOT/$p?v=$GITHUB_RUN_ID-before" -o "$W/live-before/$p"
            cmp -s "$W/baseline/$p" "$W/live-before/$p" || {
              echo "::error::Production changed after baseline sync: $p"
              exit 1
            }
          done

          python3 - <<'PY'
          import pathlib,re
          pages=["index.html","isonoura.html","kounohama.html","ikumi.html","komatsu.html","irago.html","shizunami.html","hamadutu.html","takahama.html","hakuto.html"]
          for p in pages:
              s=pathlib.Path(p).read_text(encoding="utf-8")
              start=s.find('<div class="top-strip">')
              ends=[x for x in (s.find('<section class="verdict-banner">',start),s.find('<section class="top-hero">',start)) if x>=0]
              if start<0 or not ends: raise SystemExit(f"{p}: top strip boundary missing")
              strip=s[start:min(ends)]
              if p=="index.html":
                  if s.count('id="topShareBtn"')!=1 or 'id="topShareBtn"' not in strip:
                      raise SystemExit("Top share control invalid")
              else:
                  if s.count('id="spotPageShareBtn"')!=1 or 'id="spotPageShareBtn"' not in strip:
                      raise SystemExit(f"{p}: share control invalid")
                  for token in ("navigator.share","navigator.clipboard","AbortError","border: 0","background: transparent"):
                      if token not in s: raise SystemExit(f"{p}: missing {token}")
          print("MAJOR_SHARE_SOURCE_OK")
          PY

          for p in "${spots[@]}"; do
            cp "$p" "$W/upload/$p"
          done

      - run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Backup, upload 9 spots, verify all 10 live
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.KS_NAMI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KS_NAMI_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          pages=(index.html isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html)
          spots=(isonoura.html kounohama.html ikumi.html komatsu.html irago.html shizunami.html hamadutu.html takahama.html hakuto.html)
          W="$RUNNER_TEMP/major-share-prod"

          for p in "${spots[@]}"; do
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; get \"/kansai/$p\" -o \"$W/backup/$p\"; bye"
            cmp -s "$W/backup/$p" "$W/live-before/$p"
          done

          rollback(){
            echo "::warning::Verification failed; restoring all 9 original spot pages."
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; mirror -R --verbose=0 --parallel=6 \"$W/backup\" /kansai; bye" || true
          }
          trap rollback ERR

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; mirror -R --verbose=0 --parallel=6 \"$W/upload\" /kansai; bye"

          for p in "${spots[@]}"; do
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; get \"/kansai/$p\" -o \"$W/verify/$p\"; bye"
            cmp -s "$p" "$W/verify/$p"
          done

          for p in "${pages[@]}"; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2               "$SITE_ROOT/$p?v=$GITHUB_RUN_ID-final-$p" -o "$W/live-$p"
            if [ "$p" = "index.html" ]; then
              cmp -s "$W/baseline/$p" "$W/live-$p"
            else
              cmp -s "$p" "$W/live-$p"
            fi
          done

          python3 - "$W" <<'PY'
          import pathlib,re,sys
          w=pathlib.Path(sys.argv[1])
          pages=["index.html","isonoura.html","kounohama.html","ikumi.html","komatsu.html","irago.html","shizunami.html","hamadutu.html","takahama.html","hakuto.html"]
          for p in pages:
              s=(w/f"live-{p}").read_text(encoding="utf-8")
              start=s.find('<div class="top-strip">')
              ends=[x for x in (s.find('<section class="verdict-banner">',start),s.find('<section class="top-hero">',start)) if x>=0]
              strip=s[start:min(ends)]
              token='id="topShareBtn"' if p=="index.html" else 'id="spotPageShareBtn"'
              if start<0 or not ends or token not in strip:
                  raise SystemExit(f"{p}: live share control not in update strip")
              print("LIVE_OK",p)
          PY

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          for p in "${pages[@]}"; do
            out="${p%.html}-390.png"
            timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars               --virtual-time-budget=1400 --window-size=390,844               --screenshot="$W/screens/$out"               "$SITE_ROOT/$p?v=$GITHUB_RUN_ID-screen"
            test -s "$W/screens/$out"
          done

          trap - ERR
          echo MAJOR_10_SHARE_LIVE_OK

      - uses: actions/upload-artifact@v4
        with:
          name: major-10-share-live-proof
          path: ${{ runner.temp }}/major-share-prod/screens/*.png
          retention-days: 3
