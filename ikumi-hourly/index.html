<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082331">
<title>生見｜波・風・潮位・降水量｜関西サーファーKS</title>
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="./styles.css?v=dfce290-ikumi">
<style>
/* Render Kanto's original compact component without its redundant global site chrome. */
html,body{margin:0;padding:0;min-width:0;width:100%;overflow:hidden;background:#082331;color:#f4efe6}
body{font-family:"Yu Gothic","Noto Sans JP",sans-serif}
.forecast-section{width:100%;max-width:none;margin:0;padding:0}
.forecast-shell[data-compact-test]{width:100%;margin:0;padding:0;box-shadow:none}
.forecast-shell[data-compact-test] .forecast-panel{padding:0}
.forecast-shell[data-compact-test] .compact-days{margin-bottom:12px}
.forecast-shell[data-compact-test] .compact-days button{min-height:40px;font-size:13px}
.forecast-shell[data-compact-test] .forecast-legend{padding:0 3px 8px}
.forecast-shell[data-compact-test] .compact-extra-panel{margin:0}
.forecast-shell[data-compact-test] .compact-extrema{font-size:10px}
.forecast-shell[data-compact-test] .compact-tide-note{line-height:1.5;padding:0 2px;margin:7px 0 6px}
.forecast-shell[data-compact-test] .compact-tide-note a{color:#7fd7e8}
.k-is-visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.forecast-note{padding:0 2px;margin:6px 0;font-size:10px;line-height:1.55}
@media(max-width:520px){.forecast-shell[data-compact-test] .compact-extras{padding-top:7px}.forecast-shell[data-compact-test] .compact-extra-panel{padding-top:8px}}
</style>
<script defer src="./adapter.js?v=ikumi-20261125"></script>
</head>
<body>
<section class="forecast-section" aria-labelledby="forecast-title">
<h2 id="forecast-title" class="k-is-visually-hidden">波・風</h2>
<div class="forecast-shell" data-forecast data-compact-test="1" data-default-spot="ikumi">
  <div class="forecast-panel" id="panel-forecast" aria-labelledby="forecast-title">
    <nav class="compact-days" aria-label="日付切替">
      <button type="button" data-compact-day="0" class="is-active" aria-pressed="true">今日</button>
      <button type="button" data-compact-day="1" aria-pressed="false">明日</button>
      <button type="button" data-compact-day="2" aria-pressed="false">明後日</button>
    </nav>
    <div class="forecast-legend" aria-label="グラフ凡例">
      <span><i class="legend-wave"></i><span data-wave-label>沖合モデル波高・推定(m)</span></span>
      <span><i class="legend-wind"></i>風(m/s)</span>
      <span class="data-state" data-state>読み込み中</span>
    </div>
    <div class="chart-wrap" aria-label="生見の沖合モデル波高の推定と風速の推移">
      <div class="chart-scroll" data-chart-scroll tabindex="0" aria-label="波・風グラフ。左右へスクロールできます">
        <div class="chart-inner" data-chart-inner>
          <svg class="forecast-chart" viewBox="0 0 800 190" preserveAspectRatio="none" data-chart role="img" aria-label="水色の棒が沖合モデル波高の推定、オレンジ色の線が風速"></svg>
        </div>
      </div>
      <p class="chart-empty" data-chart-empty>予報データ未接続</p>
    </div>
    <div class="scroll-hint" aria-hidden="true">← 横にスワイプ →</div>
    <div class="forecast-scroll" tabindex="0" aria-label="波高、周期、風速、風向の時間別表。横にスクロールできます" data-scroll>
      <div class="forecast-grid" data-grid></div>
    </div>
    <div class="compact-extras" data-compact-extras>
      <section class="compact-extra-panel compact-tide-rain-panel" aria-labelledby="ikumi-tide-rain-title">
        <div class="compact-tide-rain-header">
          <h3 id="ikumi-tide-rain-title" class="compact-tide-rain-title"><span>潮位</span><i class="tide-line-chip" aria-hidden="true"></i><span class="compact-title-divider">−</span><span>降水量</span><i class="rain-bar-chip" aria-hidden="true"></i></h3>
          <p class="compact-extra-meta" data-rain-info aria-live="polite">予報データ読み込み中</p>
        </div>
        <div class="compact-rain-scroll" data-rain-scroll tabindex="0" aria-label="甲浦の天文潮位・降水量・降水確率・気温。横にスクロールできます">
          <div data-rain-inner>
            <svg data-rain-chart role="img" aria-label="水色の曲線が気象庁甲浦の天文潮位、青い棒がOpen-Meteoの降水量"></svg>
            <div class="compact-tide-rain-grid" data-tide-rain-grid></div>
          </div>
        </div>
        <p class="compact-tide-phase" data-tide-phase aria-live="polite">潮回り：—</p>
        <p class="compact-extrema" data-tide-info aria-live="polite">満潮・干潮データ読み込み中</p>
        <p class="compact-tide-note">
          潮位は<a href="https://www.data.jma.go.jp/kaiyou/db/tide/suisan/suisan.php?stn=L7" target="_blank" rel="noopener noreferrer">気象庁・甲浦（L7）の推算潮位</a>（cm）で、生見の実測潮位ではありません。風・波・降水量はOpen-Meteoのモデル予報です。</p>
      </section>
    </div>
    <aside class="verified-observation" data-observation hidden aria-live="polite"></aside>
  </div>
</div>
<p class="forecast-note" id="forecast-note" data-forecast-note>Open-Meteoの波向・うねりから沖合モデル波高を推定しています。</p>
</section>
<script>
(function(){
  const send=()=>{
    if(window.parent===window)return;
    const section=document.querySelector(".forecast-section");
    const h=Math.ceil((section?.getBoundingClientRect().height||document.documentElement.scrollHeight))+5;
    window.parent.postMessage({type:'ks-ikumi-kanto-frame-height',height:h},window.location.origin);
  };
  addEventListener('load',send);
  if('ResizeObserver' in window)new ResizeObserver(send).observe(document.querySelector('.forecast-section'));
  // ResizeObserver handles data/layout changes without polling or transient document scrollHeight.
})();
</script>
</body>
</html>
